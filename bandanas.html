<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MYSTRA — Bandanas DROP_01</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:        #000000;
  --line:      rgba(232,226,214,0.32);
  --line-2:    rgba(232,226,214,0.55);
  --text:      #d8d2c4;
  --text-dim:  #7c7466;
  --text-mute: #4a4538;
  --accent:    #ffb142;
  --accent-dim:#a8731d;
  --glow:      rgba(255,180,80,.22);

  --c-blue:   #5d8fff;
  --c-green:  #6cd97e;
  --c-red:    #ff5e5e;

  --ok:   var(--c-green);
  --warn: var(--accent);
  --bad:  var(--c-red);

  --bw:   2px;

  --mono:     "JetBrains Mono", "IBM Plex Mono", "SF Mono", Menlo, monospace;
  --terminal: "VT323", "JetBrains Mono", monospace;
  --pixel:    "Press Start 2P", monospace;
}

* { box-sizing: border-box; }
html, body, #root { background: var(--bg); }
body {
  margin: 0;
  font-family: var(--mono);
  color: var(--text);
  font-size: 12px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; }

.shell { position: relative; min-height: 100vh; }
.shell.has-grid::before {
  content: "";
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(232,226,214,0.16) 0, transparent 240px),
    radial-gradient(circle at top left, rgba(232,226,214,0.4) 1.3px, transparent 2.4px),
    linear-gradient(0deg,  rgba(232,226,214,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,226,214,0.07) 1px, transparent 1px);
  background-size: auto auto, 88px 88px, 88px 88px, 88px 88px;
}
.shell.has-scanlines::after {
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.02) 0,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px),
    radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.45) 100%);
  pointer-events: none;
  z-index: 9998;
}

/* ── Topbar (same vocabulary as Lab) ─────────────────── */
.topbar {
  border-bottom: var(--bw) solid var(--line);
  background: rgba(0,0,0,0.85);
  position: sticky; top: 0; z-index: 100;
  font-family: var(--mono);
}
.tb-row { display: flex; align-items: center; padding: 0 24px; }
.tb-row-1 {
  height: 44px; gap: 14px;
  font-size: 11px; letter-spacing: 0.1em;
  border-bottom: 1px solid var(--line);
}
.tb-row-2 { height: 36px; gap: 0; font-size: 11px; }
.tb-link {
  color: var(--text-dim);
  padding: 0 14px;
  letter-spacing: 0.14em;
  border-right: 1px solid var(--line);
  height: 100%;
  display: inline-flex; align-items: center;
}
.tb-link:first-child { padding-left: 0; }
.tb-link:last-child  { border-right: 0; }
.tb-link:hover, .tb-link.is-current { color: var(--accent); }
.tb-brand { color: var(--accent); font-weight: 700; letter-spacing: 0.16em; font-size: 12px; }
.tb-btc {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 4px 12px;
  border: 1px solid var(--line);
  background: #000;
  font-size: 11px; letter-spacing: 0.1em;
}
.tb-btc .btc-lbl { color: var(--accent); font-weight: 700; letter-spacing: 0.18em; }
.tb-btc .btc-px  { color: var(--text); font-weight: 600; min-width: 92px; text-align: right; }
.tb-btc .btc-chg.is-up { color: var(--c-green); }
.tb-btc .btc-chg.is-dn { color: var(--c-red); }
.tb-btc .btc-dot { width: 6px; height: 6px; margin: 0; }

/* Dot */
.dot {
  display: inline-block;
  width: 7px; height: 7px;
  background: var(--text-mute);
  vertical-align: middle;
}
.dot-ok   { background: var(--ok);   box-shadow: 0 0 6px var(--ok); }
.dot-warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: blink 1.6s infinite; }
.dot-bad  { background: var(--bad);  box-shadow: 0 0 6px var(--bad); }
@keyframes blink { 0%,60%,100%{opacity:1;} 70%,80%{opacity:0.25;} }

/* ── Page ─────────────────────────────────────────────── */
.bnd-page {
  max-width: 1240px;
  margin: 0 auto;
  padding: 30px 44px 60px;
  position: relative;
  z-index: 1;
  display: flex; flex-direction: column; gap: 30px;
}

/* Header */
.bnd-header {
  display: flex; flex-direction: column; gap: 10px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
}
.bh-title-row { display: flex; align-items: baseline; justify-content: center; gap: 16px; }
.bh-folder-id {
  border: var(--bw) solid var(--line);
  color: var(--accent);
  padding: 5px 12px;
  font-size: 11px;
  letter-spacing: 0.18em;
}
.bh-title {
  margin: 0;
  font-family: var(--pixel);
  font-size: 30px;
  color: var(--accent);
  letter-spacing: 0.06em;
  text-shadow: 0 0 14px var(--glow);
}

/* ── Catalog grid ─────────────────────────────────────── */
.bnd-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.bnd-card {
  border: var(--bw) solid var(--line);
  background: rgba(0,0,0,0.6);
  display: flex; flex-direction: column;
  transition: border-color .18s, box-shadow .18s;
}
.bnd-card:hover { border-color: var(--line-2); box-shadow: 0 0 22px var(--glow); }
.bnd-card.is-sold { opacity: 0.55; }

.bnd-preview {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.bnd-folded { position: absolute; inset: 14px; display: block; }
.bnd-img {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  image-rendering: pixelated;
  display: block;
}
.bnd-tint {
  position: absolute; inset: 0;
  mix-blend-mode: color;
  opacity: 0.5;
  pointer-events: none;
  display: block;
}
.bnd-foldline { position: absolute; background: rgba(0,0,0,0.55); display: block; }
.bnd-fl-v { top: 0; bottom: 0; left: 50%; width: 2px; }
.bnd-fl-h { left: 0; right: 0; top: 50%; height: 2px; }
.bnd-sparks { position: absolute; inset: 0; pointer-events: none; display: block; }
.bnd-spark {
  position: absolute;
  display: block;
  background: rgba(255,255,255,0.7);
  animation: bndSpark 0.5s steps(3, jump-none) forwards;
}
.bnd-spark.is-bright {
  background: #fff;
  box-shadow: 0 0 7px rgba(255,255,255,0.85);
}
@keyframes bndSpark {
  0%   { opacity: 0; }
  35%  { opacity: 1; }
  100% { opacity: 0; }
}
.bnd-open-hint {
  position: absolute;
  left: 50%; bottom: 10px;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--accent);
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--line);
  padding: 4px 10px;
  opacity: 0;
  transition: opacity .18s;
}
.bnd-card:hover .bnd-open-hint { opacity: 1; }
.bnd-sold-stamp {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-12deg);
  font-family: var(--pixel);
  font-size: 13px;
  color: var(--c-red);
  border: var(--bw) solid var(--c-red);
  padding: 7px 12px;
  background: rgba(0,0,0,0.82);
  letter-spacing: 0.08em;
}

/* locked design — needs to be unlocked, game-style */
.bnd-card.is-locked .bnd-img { filter: brightness(0.3) grayscale(1) contrast(0.85); }
.bnd-card.is-locked .bnd-tint { display: none; }
.bnd-card.is-locked .bnd-preview { cursor: default; }
.bnd-card.is-locked .bnd-open-hint { display: none; }
.bnd-card.is-locked .bnd-name,
.bnd-card.is-locked .bnd-price { color: var(--text-mute); }
.bnd-locked-stamp {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--pixel);
  font-size: 11px;
  color: var(--text-dim);
  border: var(--bw) solid var(--line);
  padding: 7px 12px;
  background: rgba(0,0,0,0.85);
  letter-spacing: 0.1em;
}

.bnd-meta { display: flex; flex-direction: column; gap: 7px; padding: 13px 15px 15px; }
.bnd-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bnd-code { color: var(--text-dim); font-size: 10px; letter-spacing: 0.16em; }
.bnd-status { color: var(--text-dim); font-size: 10px; letter-spacing: 0.12em; display: inline-flex; align-items: center; gap: 6px; }
.bnd-name {
  margin: 0;
  font-family: var(--pixel);
  font-size: 12px;
  color: var(--text);
  letter-spacing: 0.04em;
}
.bnd-price { color: var(--accent); font-size: 14px; font-weight: 700; }
.bnd-price i { font-style: normal; font-size: 10px; color: var(--accent-dim); letter-spacing: 0.1em; }
.bnd-swatches { display: inline-flex; gap: 6px; }
.bnd-swatch {
  width: 10px; height: 10px;
  border: 1px solid rgba(255,255,255,0.25);
  outline: 1px solid transparent;
}
.bnd-swatch.is-on { outline: 1px solid var(--accent); outline-offset: 1px; }

/* Footer strip */
.bnd-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  font-size: 10px; letter-spacing: 0.14em;
  color: var(--text-mute);
}
.bnd-back { color: var(--text-dim); letter-spacing: 0.16em; }
.bnd-back:hover { color: var(--accent); }

/* ── Detail overlay ───────────────────────────────────── */
.detail-overlay { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
.detail-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.87); }
.detail-panel {
  /* scoped palette: amber by default, overridden by .is-mono */
  --dl:  var(--line);
  --dl2: var(--line-2);
  --da:  var(--accent);
  --dg:  var(--glow);
  position: relative;
  width: min(1040px, 100%);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  border: var(--bw) solid var(--dl2);
  background: #000;
  padding: 30px 32px 26px;
  box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 30px var(--dg);
}
.detail-panel.is-mono {
  --dl:  rgba(226,224,216,0.28);
  --dl2: rgba(226,224,216,0.55);
  --da:  #e2e0d8;
  --dg:  rgba(226,224,216,0.10);
}
/* film grain over the whole panel */
.d-grain {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 4;
  background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='140'%20height='140'%20filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 140px 140px;
  mix-blend-mode: overlay;
  opacity: 0.16;
}
/* pixel erosion eating the top border */
.d-erode { position: absolute; top: calc(-1 * var(--bw)); left: 0; right: 0; height: 16px; pointer-events: none; z-index: 5; }
.d-erode .de-px { position: absolute; display: block; }
.d-erode .de-off { background: #000; }
.d-erode .de-on  { background: var(--da); opacity: 0.7; }
.detail-close {
  position: absolute;
  top: 12px; right: 14px;
  font-size: 10px; letter-spacing: 0.16em;
  color: var(--text-dim);
  border: 1px solid var(--dl);
  padding: 5px 10px;
  background: #000;
  z-index: 6;
}
.detail-close:hover { color: var(--da); border-color: var(--dl2); }
.detail-cols {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(250px, 0.78fr);
  gap: 30px;
  align-items: center;
}

/* ── Spread viewer: unfold + gallery filmstrip ────────── */
.spread-viewer {
  position: relative;
  display: flex; flex-direction: column;
  align-items: center;
  width: 100%;
}
.gal-thumb.is-locked {
  position: relative;
  cursor: not-allowed;
  opacity: 0.6;
  filter: grayscale(1) brightness(0.35) contrast(0.8);
}
.gal-thumb.is-locked:hover { opacity: 0.75; }
.gal-thumb-lock {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text);
  background: rgba(0,0,0,0.55);
  text-shadow: 0 0 4px #000;
}
.zoom-overlay {
  position: fixed; inset: 0;
  z-index: 700;
  background: rgba(0,0,0,0.96);
  display: flex; align-items: center; justify-content: center;
  cursor: zoom-out;
}
.zoom-img {
  max-width: 94vw; max-height: 92vh;
  display: block;
  border: 1px solid var(--line);
}
.zoom-hint {
  position: fixed;
  bottom: 16px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px; letter-spacing: 0.16em;
  color: var(--text-dim);
}
.gal-warn {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 6;
  pointer-events: none;
  animation: warnFlash 1.3s steps(2, jump-none) forwards;
}
.gal-warn-box {
  font-family: var(--pixel);
  font-size: 11px;
  color: var(--text);
  border: var(--bw) solid var(--line-2);
  background: rgba(0,0,0,0.92);
  padding: 10px 16px;
  letter-spacing: 0.08em;
  box-shadow: 0 0 18px rgba(232,226,214,0.12);
  animation: warnShake 0.3s steps(2, jump-none) 2;
}
@keyframes warnFlash {
  0%   { opacity: 0; }
  8%   { opacity: 1; }
  72%  { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes warnShake {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-4px); }
  75%  { transform: translateX(4px); }
  100% { transform: translateX(0); }
}
.gal-strip {
  display: flex; flex-wrap: wrap; gap: 6px;
  justify-content: center;
  width: min(100%, 640px, calc(100vh - 300px));
  margin-top: 12px;
}
.gal-thumb {
  width: 46px; height: 46px;
  background-size: cover; background-position: center;
  border: 1px solid var(--dl);
  background-color: transparent;
  cursor: pointer;
  opacity: 0.5;
  padding: 0;
  transition: opacity 0.15s, border-color 0.15s;
}
.gal-thumb:hover { opacity: 0.9; }
.gal-thumb.is-on {
  opacity: 1;
  border-color: var(--da);
  box-shadow: 0 0 7px var(--dg);
}
.gal-thumb-spread {
  width: auto; padding: 0 10px;
  font-family: inherit; font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--da);
}

/* ── Unfold spread ────────────────────────────────────── */
.spread-stage {
  width: 100%;
  display: flex; flex-direction: column; gap: 10px;
  align-items: center;
  perspective: 1300px;
  padding: 4px 0 0;
}
.spread {
  position: relative;
  width: min(100%, 640px, calc(100vh - 300px));
  aspect-ratio: 1 / 1;   /* overridden inline from the image's real ratio */
  transform-style: preserve-3d;
}
.spread-caption { width: min(100%, 640px, calc(100vh - 300px)); }
.sq, .flap { position: absolute; }
.sq.q-tl {
  top: 0; left: 0; width: 50%; height: 50%;
  background-size: 200% 200%;
  z-index: 3;
  border: 1px solid var(--dl);
}
.q-tint {
  position: absolute; inset: 0;
  background: var(--tint);
  mix-blend-mode: color;
  opacity: 0.5;
  pointer-events: none;
  display: block;
}
.flap {
  transform-style: preserve-3d;
  transition-property: transform, opacity;
  transition-timing-function: cubic-bezier(.6, .05, .3, 1);
  transition-duration: 620ms;
  opacity: 0;
}
.flap-face, .flap-back {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: block;
}
.flap-face { border: 1px solid var(--dl); }
.flap-back {
  background:
    repeating-linear-gradient(45deg, #0a0907 0 8px, #050404 8px 16px);
  border: 1px solid var(--dl);
}
.f-tr {
  top: 0; left: 50%; width: 50%; height: 50%;
  transform-origin: left center;
  transform: rotateY(-180deg);
  z-index: 2;
}
.f-tr .flap-back { transform: rotateY(180deg); }
.f-bottom {
  top: 50%; left: 0; width: 100%; height: 50%;
  transform-origin: center top;
  transform: rotateX(180deg);
  z-index: 1;
}
.f-bottom .flap-back { transform: rotateX(180deg); }

.spread[data-stage="1"] .f-tr,
.spread[data-stage="2"] .f-tr,
.spread[data-stage="3"] .f-tr,
.spread[data-stage="2"] .f-bottom,
.spread[data-stage="3"] .f-bottom {
  transform: none;
  opacity: 1;
}
.spread[data-stage="1"] .f-bottom { opacity: 0; }

/* flat full image — fades in after the unfold completes */
.spread-flat {
  position: absolute; inset: 0;
  background-size: 100% 100%;
  background-position: center;
  border: 1px solid var(--dl);
  opacity: 0;
  pointer-events: none;
  z-index: 4;
  transition: opacity 180ms linear;
}
.spread[data-stage="3"] .spread-flat { opacity: 1; }

.spread-caption {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 10px; letter-spacing: 0.12em;
  color: var(--text-mute);
}
.spread-caption .sc-id { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.di-code-row span { white-space: nowrap; }
.spread-state { color: var(--text-dim); }
.spread-state.is-open { color: var(--da); }

/* ── Detail info column ──────────────────────────────── */
.detail-info { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.di-head { display: flex; flex-direction: column; gap: 2px; }
.di-code-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--text-mute);
}
.di-status { display: inline-flex; align-items: center; gap: 6px; letter-spacing: 0.12em; }
.di-name {
  margin: 0;
  font-family: var(--terminal);
  font-size: 42px;
  line-height: 1;
  font-weight: 400;
  color: var(--da);
  letter-spacing: 0.02em;
  text-shadow: 0 0 10px var(--dg);
}
.di-price {
  font-family: var(--terminal);
  color: var(--da);
  font-size: 30px;
  line-height: 1;
}
.di-price i { font-style: normal; font-size: 14px; color: var(--text-dim); letter-spacing: 0.08em; }

.di-opt { display: flex; align-items: baseline; gap: 12px; }
.di-label { font-size: 9px; letter-spacing: 0.22em; color: var(--text-mute); width: 44px; flex-shrink: 0; }
.di-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.di-chip {
  border: 1px solid var(--dl);
  min-width: 32px;
  padding: 6px 9px;
  font-size: 10px; letter-spacing: 0.1em;
  color: var(--text-dim);
  text-align: center;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.di-chip.is-on { color: var(--da); border-color: var(--dl2); }
.di-chip.is-dis { opacity: 0.35; cursor: default; }
.di-sw-chip { width: 10px; height: 10px; display: inline-block; border: 1px solid rgba(255,255,255,0.25); }
.di-note { font-size: 9px; letter-spacing: 0.14em; color: var(--text-mute); }

/* ── Order / payment ─────────────────────────────────── */
.order-flow { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--dl); padding-top: 14px; }
.btn-order {
  position: relative;
  overflow: hidden;
  border: var(--bw) solid var(--da);
  color: var(--da);
  padding: 11px 16px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.16em;
  text-align: center;
  transition: background .15s, box-shadow .15s;
}
.btn-order:hover { background: rgba(255,255,255,0.06); box-shadow: 0 0 18px var(--dg); }
.btn-flies { position: absolute; inset: 0; pointer-events: none; display: block; }
.btn-fly {
  position: absolute; bottom: -4px;
  background: rgba(255,255,255,0.8);
  animation: btnFly linear infinite;
  display: block;
}
@keyframes btnFly {
  0%   { transform: translate(0, 0); opacity: 0; }
  15%  { opacity: 0.9; }
  40%  { transform: translate(3px, -18px); }
  70%  { transform: translate(-3px, -32px); opacity: 0.5; }
  100% { transform: translate(2px, -48px); opacity: 0; }
}
.ship-note {
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-mute);
}
.order-sold {
  border: var(--bw) solid var(--dl);
  color: var(--text-mute);
  padding: 11px 16px;
  letter-spacing: 0.14em;
  text-align: center;
}
.pay-block { display: flex; flex-direction: column; gap: 8px; }
.pay-row { display: flex; align-items: center; gap: 8px; }
.pay-nets { gap: 8px; }
.pay-net {
  border: 1px solid var(--dl);
  padding: 6px 12px;
  font-size: 10px; letter-spacing: 0.14em;
  color: var(--text-dim);
}
.pay-net.is-on { color: var(--da); border-color: var(--dl2); }
.pay-wallet {
  border: 1px solid var(--dl);
  background: rgba(255,255,255,0.025);
  padding: 9px 12px;
  justify-content: space-between;
}
.wallet-addr { font-size: 12px; color: var(--text); letter-spacing: 0.06em; word-break: break-all; }
.btn-copy {
  border: 1px solid var(--dl);
  padding: 4px 10px;
  font-size: 10px; letter-spacing: 0.14em;
  color: var(--da);
  flex-shrink: 0;
}
.btn-copy:hover { border-color: var(--dl2); box-shadow: 0 0 8px var(--dg); }
.pay-hint { font-size: 10px; color: var(--text-mute); letter-spacing: 0.1em; }
.pay-input {
  background: #000;
  border: 1px solid var(--dl);
  color: var(--text);
  padding: 9px 11px;
  font-size: 11px;
  letter-spacing: 0.05em;
  width: 100%;
}
.pay-input::placeholder { color: var(--text-mute); }
.pay-input:focus { outline: none; border-color: var(--dl2); box-shadow: 0 0 10px var(--dg); }
.pay-result { font-size: 10px; letter-spacing: 0.12em; padding-top: 2px; }
.pay-result.is-ok  { color: var(--c-green); }
.pay-result.is-err { color: var(--c-red); }

/* ── Responsive ──────────────────────────────────────── */
@media (max-width: 1000px) {
  .bnd-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .detail-cols { grid-template-columns: 1fr; gap: 22px; }
  .detail-panel { width: min(620px, 100%); }
  .di-name { font-size: 34px; }
  .bnd-page { padding: 22px 24px 44px; }
  .bh-title { font-size: 22px; }
}
@media (max-width: 600px) {
  .topbar .tb-row-1 { flex-wrap: wrap; height: auto; padding: 8px 14px; gap: 6px; }
  .topbar .tb-row-2 { padding: 0 14px; overflow-x: auto; }
  .tb-btc { width: 100%; justify-content: space-between; padding: 6px 10px; }
  .tb-btc .btc-px { min-width: 0; }
  .bnd-grid { grid-template-columns: 1fr; }
  .bnd-page { padding: 16px 14px 36px; gap: 20px; }
  .bh-title { font-size: 17px; }
  .detail-panel { padding: 20px 16px 22px; }
  .bnd-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
}
