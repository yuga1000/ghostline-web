<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLINE - Lost Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000000 !important;
            color: #00ff00;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .pixel-text {
            font-family: 'Press Start 2P', cursive;
        }

        .scanlines {
            background: linear-gradient(transparent 50%, rgba(0, 255, 0, 0.02) 50%);
            background-size: 100% 3px;
        }

        .terminal-border {
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .nav-link {
            color: #00ff00;
            text-decoration: none;
        }
        .nav-active { color: #ffffff; }

        /* Boot log */
        .boot-log {
            font-size: 11px;
            color: #004400;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px solid #002200;
            max-height: 100px;
            overflow: hidden;
        }
        .boot-line { opacity: 0; animation: bootFade 0.3s ease forwards; }
        @keyframes bootFade { to { opacity: 1; } }
        .boot-ok { color: #00ff00; }
        .boot-warn { color: #ffaa00; }

        /* Stats */
        .archive-stats {
            font-size: 10px;
            color: #004400;
            padding: 4px 20px;
            border-bottom: 1px solid #001a00;
            margin-bottom: 1rem;
        }
        .stat-green { color: #00ff00; }

        /* ========== CHAOTIC MOSAIC ========== */
        .mosaic {
            column-count: 4;
            column-gap: 16px;
            padding: 0 16px;
        }

        .mosaic-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #001a00;
            transition: border-color 0.3s ease;
            background: #050505;
        }

        /* Пустой слот - создаёт случайные дыры в мозаике */
        .mosaic-gap {
            break-inside: avoid;
            margin-bottom: 20px;
            background: transparent;
            border: none;
            pointer-events: none;
        }

        .mosaic-item:hover {
            border-color: #00ff00;
        }

        .mosaic-item img {
            width: 100%;
            display: block;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .mosaic-item img.loaded {
            opacity: 1;
        }

        /* Glitch on hover */
        .mosaic-item:hover img.loaded {
            animation: glitchImg 0.3s ease;
        }

        @keyframes glitchImg {
            0% { transform: translate(0); filter: none; }
            20% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
            40% { transform: translate(2px, -1px); filter: saturate(2); }
            60% { transform: translate(-1px, -1px); filter: hue-rotate(-90deg); }
            80% { transform: translate(1px, 2px); filter: none; }
            100% { transform: translate(0); filter: none; }
        }

        /* Fragment ID overlay */
        .mosaic-id {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 6px;
            font-size: 8px;
            color: #003300;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mosaic-item:hover .mosaic-id {
            opacity: 1;
            color: #00ff00;
        }

        /* Scan line effect on individual items */
        .mosaic-item::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 50, 0, 0.08) 2px,
                rgba(0, 50, 0, 0.08) 4px
            );
            pointer-events: none;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .lightbox.show { opacity: 1; }

        .lightbox-frame {
            width: 70vw;
            height: 80vh;
            max-width: 1200px;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #003300;
            box-shadow: 0 0 30px rgba(0, 100, 0, 0.3);
            margin: auto;
        }

        .lightbox-frame img {
            width: 100%; height: 100%;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px; right: 20px;
            color: #00ff00;
            font-size: 30px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 15px;
            border: 1px solid #003300;
        }

        /* Lightbox nav arrows */
        .lb-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #00ff00;
            font-size: 24px;
            cursor: pointer;
            padding: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #003300;
            z-index: 3001;
        }
        .lb-arrow:hover { background: rgba(0,50,0,0.4); }
        .lb-arrow.left { left: 10px; }
        .lb-arrow.right { right: 10px; }

        /* Empty state */
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Responsive */
        @media (max-width: 1200px) { .mosaic { column-count: 3; } }
        @media (max-width: 768px) {
            .mosaic { column-count: 2; column-gap: 10px; padding: 0 10px; }
            .mosaic-item { margin-bottom: 14px; }
            .mosaic-gap { margin-bottom: 14px; }
        }
        @media (max-width: 480px) { .mosaic { column-count: 2; } }
    </style>
</head>
<body class="scanlines">

<div class="terminal-border bg-black p-2 m-4 flex flex-col items-center">
    <div class="text-green-500 text-lg font-bold">GHOSTLINE</div>
    <nav class="flex gap-4 mt-2 text-xs flex-wrap justify-center">
        <a href="index.html" class="nav-link">[HOME]</a>
        <a href="gallery.html" class="nav-link">[GALLERY]</a>
        <span class="nav-link nav-active">[LOST ARCHIVE]</span>
        <a href="polaroids.html" class="nav-link">[POLAROIDS]</a>
    </nav>
</div>

<div class="container mx-auto pb-8">
    <!-- Title -->
    <div class="text-center mb-4">
        <h1 class="pixel-text text-xl mb-2" style="color: #005500;">LOST ARCHIVE</h1>
        <p class="text-xs" style="color: #003300;">// recovering deleted fragments from corrupted storage</p>
    </div>

    <!-- Boot log -->
    <div class="boot-log" id="bootLog"></div>

    <!-- Stats -->
    <div class="archive-stats" id="archiveStats"></div>

    <!-- Mosaic Grid -->
    <div class="mosaic" id="mosaicGrid"></div>

    <!-- Empty state -->
    <div id="emptyArchive" class="text-center py-16" style="display:none;">
        <p class="pixel-text text-xs" style="color: #003300;">NO FRAGMENTS RECOVERED</p>
        <p class="text-xs mt-4" style="color: #002200;">storage scan in progress<span class="cursor-blink">_</span></p>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-close" onclick="closeLightbox()">x</div>
    <div class="lb-arrow left" onclick="event.stopPropagation(); lbNav(-1)">&#9664;</div>
    <div class="lb-arrow right" onclick="event.stopPropagation(); lbNav(1)">&#9654;</div>
    <div class="lightbox-frame" onclick="event.stopPropagation()">
        <img id="lightboxImage" src="" alt="">
    </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-env.js"></script>

<script>
    let archiveItems = [];
    let currentLbIndex = 0;

    // =============================================
    // BOOT SEQUENCE
    // =============================================
    function runBootSequence(count) {
        const log = document.getElementById('bootLog');
        const msgs = [
            { text: '> mounting /dev/ghost/archive...', cls: '' },
            { text: '[OK] filesystem detected: GHOSTFS v2.1', cls: 'boot-ok' },
            { text: '[WARN] sectors marked as damaged', cls: 'boot-warn' },
            { text: '> deep scan: recovering fragments...', cls: '' },
            { text: `[OK] ${count} fragments recovered`, cls: 'boot-ok' },
        ];
        msgs.forEach((msg, i) => {
            setTimeout(() => {
                const line = document.createElement('div');
                line.className = 'boot-line ' + msg.cls;
                line.textContent = msg.text;
                log.appendChild(line);
                log.scrollTop = log.scrollHeight;
            }, i * 200);
        });
    }

    // =============================================
    // FETCH FROM SUPABASE
    // =============================================
    async function loadArchive() {
        if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
            try {
                const client = window.supabase.createClient(
                    window.SUPABASE_URL,
                    window.SUPABASE_ANON_KEY
                );
                const { data, error } = await client
                    .from('images')
                    .select('*')
                    .eq('category', 'lost-archive')
                    .order('created_at', { ascending: false });

                if (!error && data) {
                    archiveItems = data;
                }
            } catch (e) {
                console.error('Supabase error:', e);
            }
        }

        runBootSequence(archiveItems.length);

        // wait for boot to finish then render
        setTimeout(() => {
            renderMosaic();
            updateStats();
        }, 1200);
    }

    // =============================================
    // STATS
    // =============================================
    function updateStats() {
        const el = document.getElementById('archiveStats');
        el.innerHTML = '<span class="stat-green">FRAGMENTS RECOVERED: ' + archiveItems.length + '</span>' +
            ' // STORAGE: CORRUPTED // STATUS: PARTIAL RECOVERY';
    }

    // =============================================
    // RENDER MOSAIC
    // =============================================
    function renderMosaic() {
        const grid = document.getElementById('mosaicGrid');
        const empty = document.getElementById('emptyArchive');

        if (archiveItems.length === 0) {
            empty.style.display = 'block';
            return;
        }

        // shuffle for chaotic feel (seeded by day so consistent within a day)
        const shuffled = [...archiveItems];
        const daySeed = Math.floor(Date.now() / 86400000);
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(((daySeed * (i + 1) * 9301 + 49297) % 233280) / 233280 * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        // Build list of slots: real images + random empty gaps (~15% chance of gap after each image)
        const slots = [];
        shuffled.forEach((item, i) => {
            slots.push({ type: 'image', item, idx: i });
            // randomly insert a gap after some images (seeded so consistent per day)
            const gapChance = ((daySeed * (i + 3) * 2053 + 17) % 100) / 100;
            if (gapChance < 0.18 && i < shuffled.length - 1) {
                // gap height varies: small or medium
                const gapH = ((daySeed * (i + 7) * 1031) % 3) === 0 ? 80 : 40;
                slots.push({ type: 'gap', height: gapH });
            }
        });

        grid.innerHTML = slots.map((slot) => {
            if (slot.type === 'gap') {
                return `<div class="mosaic-gap" style="height:${slot.height}px;"></div>`;
            }
            const { item, idx } = slot;
            const fragId = 'FRG-' + String(idx + 1).padStart(4, '0');
            const sector = String(((daySeed * (idx+1) * 7919) % 9999)).padStart(4, '0');
            return `
                <div class="mosaic-item" onclick="openLightbox(${idx})">
                    <img
                        src="${item.url}"
                        alt="Fragment ${fragId}"
                        loading="lazy"
                        onload="this.classList.add('loaded')"
                        onerror="this.style.display='none'"
                    >
                    <div class="mosaic-id">
                        ${fragId} // sector:${sector}
                    </div>
                </div>
            `;
        }).join('');
    }

    // =============================================
    // LIGHTBOX
    // =============================================
    function openLightbox(idx) {
        currentLbIndex = idx;
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightboxImage');
        lb.style.display = 'flex';
        setTimeout(() => lb.classList.add('show'), 10);
        img.src = archiveItems[idx].url;
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lb = document.getElementById('lightbox');
        lb.classList.remove('show');
        setTimeout(() => {
            lb.style.display = 'none';
            document.body.style.overflow = '';
        }, 300);
    }

    function lbNav(dir) {
        currentLbIndex = (currentLbIndex + dir + archiveItems.length) % archiveItems.length;
        document.getElementById('lightboxImage').src = archiveItems[currentLbIndex].url;
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lbNav(-1);
        if (e.key === 'ArrowRight') lbNav(1);
    });

    // touch swipe in lightbox
    let lbTouchX = 0;
    document.getElementById('lightbox').addEventListener('touchstart', (e) => {
        lbTouchX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('lightbox').addEventListener('touchend', (e) => {
        const dx = lbTouchX - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) lbNav(dx > 0 ? 1 : -1);
    }, { passive: true });

    // Start
    document.addEventListener('DOMContentLoaded', loadArchive);
</script>

</body>
</html>
