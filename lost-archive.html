<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLINE - Lost Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000000 !important;
            color: #00ff00;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .terminal-border {
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .pixel-text {
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        .scanlines {
            background: linear-gradient(transparent 50%, rgba(0, 255, 0, 0.02) 50%);
            background-size: 100% 3px;
            animation: scanlines 0.1s linear infinite;
        }

        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 3px; }
        }

        .nav-link {
            color: #00ff00;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-active {
            color: #ffffff;
        }

        /* Archive grid item */
        .archive-item {
            background: #000000;
            border: 2px solid #003300;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            min-height: 220px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.5s ease;
        }

        .archive-item:hover {
            border-color: #00ff00;
        }

        .archive-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 50, 0, 0.1) 2px,
                rgba(0, 50, 0, 0.1) 4px
            );
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        .archive-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            margin-bottom: 0.75rem;
            min-height: 200px;
            max-height: 240px;
            position: relative;
            overflow: hidden;
        }

        .archive-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .archive-image img.loaded {
            opacity: 1;
        }

        /* Glitch effect on hover */
        .archive-item:hover .archive-image img.loaded {
            animation: glitchImg 0.3s ease;
        }

        @keyframes glitchImg {
            0% { transform: translate(0); filter: none; }
            20% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
            40% { transform: translate(2px, -1px); filter: saturate(2); }
            60% { transform: translate(-1px, -1px); filter: hue-rotate(-90deg); }
            80% { transform: translate(1px, 2px); filter: none; }
            100% { transform: translate(0); filter: none; }
        }

        /* Status badge */
        .archive-status {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            padding: 2px 6px;
            border: 1px solid;
            font-family: 'Share Tech Mono', monospace;
            z-index: 2;
        }

        .status-recovered {
            color: #00ff00;
            border-color: #003300;
            background: rgba(0, 0, 0, 0.8);
        }

        .status-corrupted {
            color: #ff3300;
            border-color: #330000;
            background: rgba(0, 0, 0, 0.8);
        }

        .status-partial {
            color: #ffaa00;
            border-color: #332200;
            background: rgba(0, 0, 0, 0.8);
        }

        /* Meta info under image */
        .archive-meta {
            border-top: 1px solid #002200;
            padding-top: 0.5rem;
            font-size: 11px;
            color: #005500;
            z-index: 2;
            position: relative;
        }

        .archive-meta .file-id {
            color: #00ff00;
            opacity: 0.7;
        }

        .archive-meta .file-date {
            color: #004400;
            font-size: 10px;
        }

        /* Terminal boot sequence */
        .boot-log {
            font-size: 11px;
            color: #004400;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px solid #002200;
            max-height: 120px;
            overflow: hidden;
        }

        .boot-line {
            opacity: 0;
            animation: bootFade 0.3s ease forwards;
        }

        @keyframes bootFade {
            to { opacity: 1; }
        }

        .boot-ok { color: #00ff00; }
        .boot-warn { color: #ffaa00; }
        .boot-err { color: #ff3300; }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .lightbox.show { opacity: 1; }

        .lightbox-frame {
            width: 70vw;
            height: 80vh;
            max-width: 1200px;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #003300;
            box-shadow: 0 0 30px rgba(0, 100, 0, 0.3);
            margin: auto;
        }

        .lightbox-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 30px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 15px;
            border: 1px solid #003300;
        }

        /* Blinking cursor */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Static noise placeholder */
        .static-noise {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 0, 0.03) 0px,
                    transparent 1px,
                    transparent 2px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(0, 255, 0, 0.02) 0px,
                    transparent 1px,
                    transparent 3px
                );
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .archive-item {
                min-height: 180px;
            }
            .archive-image {
                min-height: 160px;
                max-height: 200px;
            }
        }
    </style>
</head>
<body class="scanlines">

<div class="terminal-border bg-black p-2 m-4 flex flex-col items-center">
    <div class="text-green-500 text-lg font-bold">GHOSTLINE</div>
    <nav class="flex gap-4 mt-2 text-xs">
        <a href="index.html" class="nav-link">[HOME]</a>
        <a href="gallery.html" class="nav-link">[GALLERY]</a>
        <span class="nav-link nav-active">[LOST ARCHIVE]</span>
        <a href="polaroids.html" class="nav-link">[POLAROIDS]</a>
        <a href="stream.html" class="nav-link">[STREAM]</a>
        <a href="order.html" class="nav-link">[ORDER]</a>
    </nav>
</div>

<div class="container mx-auto px-4 pb-8">
    <!-- Title -->
    <div class="text-center mb-6">
        <h1 class="pixel-text text-2xl mb-2" style="color: #005500;">LOST ARCHIVE</h1>
        <p class="text-xs" style="color: #003300;">// recovering deleted fragments from corrupted storage</p>
    </div>

    <!-- Boot log -->
    <div class="boot-log" id="bootLog"></div>

    <!-- Archive Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="archiveGrid">
        <!-- Items injected by JS -->
    </div>

    <!-- Empty state -->
    <div id="emptyArchive" class="text-center py-16" style="display:none;">
        <p class="pixel-text text-xs" style="color: #003300;">NO FRAGMENTS RECOVERED</p>
        <p class="text-xs mt-4" style="color: #002200;">storage scan in progress<span class="cursor-blink">_</span></p>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-close" onclick="closeLightbox()">x</div>
    <div class="lightbox-frame" onclick="event.stopPropagation()">
        <img id="lightboxImage" src="" alt="">
    </div>
</div>

<script>
    // =============================================
    // LOST ARCHIVE DATA
    // Add your images here. Each item needs:
    //   src: path to image
    //   id: file identifier (shown under image)
    //   status: 'recovered' | 'corrupted' | 'partial'
    //   date: when it was "found"
    // =============================================
    const archiveItems = [
        // Example (uncomment and add your images):
        // { src: 'pages/2Large.jpeg', id: 'FRG-0001', status: 'recovered', date: '2024.03.15' },
        // { src: 'pages/3Large.jpeg', id: 'FRG-0002', status: 'partial', date: '2024.01.22' },
        // { src: 'pages/4 Large.jpeg', id: 'FRG-0003', status: 'corrupted', date: '2023.11.08' },
    ];

    // =============================================
    // BOOT SEQUENCE
    // =============================================
    const bootMessages = [
        { text: '> mounting /dev/ghost/archive...', cls: '' },
        { text: '[OK] filesystem detected: GHOSTFS v2.1', cls: 'boot-ok' },
        { text: '[WARN] 47 sectors marked as damaged', cls: 'boot-warn' },
        { text: '> scanning for recoverable fragments...', cls: '' },
        { text: '[OK] recovery engine initialized', cls: 'boot-ok' },
        { text: `[OK] ${archiveItems.length} fragments found`, cls: 'boot-ok' },
        { text: '> rendering recovered data...', cls: '' },
    ];

    function runBootSequence() {
        const log = document.getElementById('bootLog');
        bootMessages.forEach((msg, i) => {
            setTimeout(() => {
                const line = document.createElement('div');
                line.className = 'boot-line ' + msg.cls;
                line.style.animationDelay = '0s';
                line.textContent = msg.text;
                log.appendChild(line);
                log.scrollTop = log.scrollHeight;

                // After last message, render grid
                if (i === bootMessages.length - 1) {
                    setTimeout(renderArchive, 400);
                }
            }, i * 300);
        });
    }

    // =============================================
    // RENDER ARCHIVE GRID
    // =============================================
    function renderArchive() {
        const grid = document.getElementById('archiveGrid');
        const empty = document.getElementById('emptyArchive');

        if (archiveItems.length === 0) {
            empty.style.display = 'block';
            return;
        }

        grid.innerHTML = archiveItems.map((item, i) => `
            <div class="archive-item" onclick="openLightbox('${item.src}')" style="cursor:pointer;">
                <div class="archive-status status-${item.status}">${item.status.toUpperCase()}</div>
                <div class="archive-image">
                    <div class="static-noise"></div>
                    <img
                        src="${item.src}"
                        alt="Fragment ${item.id}"
                        loading="lazy"
                        onload="this.classList.add('loaded')"
                        onerror="this.parentElement.innerHTML='<div style=\\'color:#330000;font-size:10px;text-align:center;padding:2rem;\\'>// data unreadable //</div>'"
                    >
                </div>
                <div class="archive-meta">
                    <div class="file-id">fragment_${item.id}.dat</div>
                    <div class="file-date">recovered: ${item.date} | sector: ${Math.floor(Math.random() * 9999).toString().padStart(4, '0')}</div>
                </div>
            </div>
        `).join('');
    }

    // =============================================
    // LIGHTBOX
    // =============================================
    function openLightbox(src) {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightboxImage');
        lb.style.display = 'flex';
        setTimeout(() => lb.classList.add('show'), 10);
        img.src = src;
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lb = document.getElementById('lightbox');
        lb.classList.remove('show');
        setTimeout(() => {
            lb.style.display = 'none';
            document.body.style.overflow = '';
        }, 300);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    // Start
    document.addEventListener('DOMContentLoaded', runBootSequence);
</script>

</body>
</html>
