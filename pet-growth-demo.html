<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLINE PET | GROWTH SYSTEM 🌸</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .pet-display {
            width: 100%;
            height: 400px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
            padding-bottom: 30px;
        }

        .pet {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .pixel {
            width: 12px;
            height: 12px;
            background: #FFB6C1;
            image-rendering: pixelated;
        }

        /* Pet body structure */
        .pet-body-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Stem/vertical growth */
        .pet-stem {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Head structure (2x3 grid with ears) */
        .pet-head {
            display: grid;
            grid-template-columns: repeat(4, 12px);
            grid-template-rows: repeat(3, 12px);
            position: relative;
            margin-bottom: 4px;
        }

        .pet-head .pixel {
            background: #FFB6C1;
        }

        .pixel.eye {
            background: #000;
        }

        .pixel.eye-complex {
            background: #000;
            width: 8px;
            height: 8px;
        }

        /* Arms container */
        .pet-arms {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        /* Legs container */
        .pet-legs {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .leg-column {
            display: flex;
            flex-direction: column;
        }

        /* Fractal branches */
        .pet-branches {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .branch {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FFB6C1;
            opacity: 0.8;
        }

        /* Petals around head */
        .pet-petals {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FFB6C1;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        /* Stage info */
        .stage-info {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .stage-name {
            font-size: 18px;
            color: #FF69B4;
            font-weight: bold;
        }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFB6C1, #FF69B4);
            transition: width 0.3s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            background: #FFB6C1;
            border: 2px solid #FF69B4;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #FF69B4;
            color: white;
        }

        /* Animation classes */
        .growing {
            animation: grow-pulse 0.5s ease;
        }

        @keyframes grow-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .blooming {
            animation: bloom-glow 2s ease-in-out infinite;
        }

        @keyframes bloom-glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🌸 GHOSTLINE PET | GROWTH SYSTEM 🌸</div>

        <div class="stage-info">
            <div class="stage-name" id="stageName">Stage 1: Seed</div>
            <div id="stageDesc">A tiny pixel begins...</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="pet-display">
            <div class="pet" id="pet">
                <!-- Pet structure will be dynamically generated -->
            </div>
        </div>

        <div class="controls">
            <button onclick="startGrowth()">🌱 Start Growth</button>
            <button onclick="resetPet()">🔄 Reset</button>
            <button onclick="skipStage()">⏭️ Skip Stage</button>
        </div>
    </div>

    <script>
        const stages = [
            {
                name: "Seed",
                desc: "A tiny pixel begins...",
                duration: 1000,
                stemHeight: 1,
                bodyWidth: 0,
                legs: 0,
                arms: false,
                branches: [],
                petals: [],
                eyesComplex: false
            },
            {
                name: "Sprout",
                desc: "Growing upward!",
                duration: 1000,
                stemHeight: 2,
                bodyWidth: 0,
                legs: 2,
                arms: false,
                branches: [],
                petals: [],
                eyesComplex: false
            },
            {
                name: "Young",
                desc: "Legs appear!",
                duration: 1000,
                stemHeight: 3,
                bodyWidth: 4,
                legs: 4,
                arms: false,
                branches: [],
                petals: [],
                eyesComplex: false
            },
            {
                name: "Pre-Bloom",
                desc: "Body forms, arms reach out",
                duration: 1200,
                stemHeight: 3,
                bodyWidth: 4,
                legs: 4,
                arms: true,
                branches: [],
                petals: [],
                eyesComplex: false
            },
            {
                name: "Budding",
                desc: "Fractal branches emerge!",
                duration: 1500,
                stemHeight: 4,
                bodyWidth: 4,
                legs: 4,
                arms: true,
                branches: [
                    {x: -36, y: 40},
                    {x: -48, y: 30},
                    {x: 36, y: 40},
                    {x: 48, y: 30}
                ],
                petals: [],
                eyesComplex: true
            },
            {
                name: "Blooming",
                desc: "Petals unfold!",
                duration: 2000,
                stemHeight: 5,
                bodyWidth: 4,
                legs: 4,
                arms: true,
                branches: [
                    {x: -36, y: 40}, {x: -48, y: 30}, {x: -36, y: 55},
                    {x: 36, y: 40}, {x: 48, y: 30}, {x: 36, y: 55},
                    {x: -60, y: 40}, {x: 60, y: 40}
                ],
                petals: [
                    {x: -24, y: -12}, {x: -12, y: -24}, {x: 0, y: -24},
                    {x: 12, y: -24}, {x: 24, y: -12},
                    {x: -36, y: 0}, {x: 36, y: 0}
                ],
                eyesComplex: true
            },
            {
                name: "Full Bloom",
                desc: "Swaying in the wind... 🌸💨",
                duration: 300000, // 5 minutes
                stemHeight: 5,
                bodyWidth: 4,
                legs: 4,
                arms: true,
                // Base branches - will be modified in wind variants
                branches: [
                    {x: -36, y: 40}, {x: -48, y: 30}, {x: -36, y: 55}, {x: -24, y: 65},
                    {x: 36, y: 40}, {x: 48, y: 30}, {x: 36, y: 55}, {x: 24, y: 65},
                    {x: -60, y: 40}, {x: -72, y: 30}, {x: 60, y: 40}, {x: 72, y: 30},
                    {x: -48, y: 65}, {x: 48, y: 65}
                ],
                petals: [
                    {x: -36, y: -24}, {x: -24, y: -36}, {x: -12, y: -36},
                    {x: 0, y: -36}, {x: 12, y: -36}, {x: 24, y: -36}, {x: 36, y: -24},
                    {x: -48, y: -12}, {x: -36, y: 0}, {x: -48, y: 12},
                    {x: 48, y: -12}, {x: 36, y: 0}, {x: 48, y: 12},
                    {x: -24, y: -48}, {x: 0, y: -48}, {x: 24, y: -48}
                ],
                eyesComplex: true,
                hasWindVariants: true
            }
        ];

        let currentStage = 0;
        let growing = false;
        let windLoopInterval = null;
        let windVariantIndex = 0;

        // Generate 8 wind sway variants for Full Bloom
        function generateWindVariants(baseStage) {
            const variants = [];

            for (let i = 0; i < 8; i++) {
                const variant = JSON.parse(JSON.stringify(baseStage)); // Deep copy

                // Sway pattern: center -> right -> right more -> center -> left -> left more -> center -> subtle
                const swayOffsets = [0, 3, 6, 3, 0, -3, -6, -3];
                const offset = swayOffsets[i];

                // Apply offset to branches (simulate wind)
                variant.branches = variant.branches.map(b => ({
                    x: b.x + offset,
                    y: b.y + (Math.abs(offset) > 4 ? -2 : 0) // Slight droop on strong sway
                }));

                // Apply smaller offset to petals
                variant.petals = variant.petals.map(p => ({
                    x: p.x + Math.floor(offset / 2),
                    y: p.y + (Math.abs(offset) > 4 ? -1 : 0)
                }));

                // Add subtle body offset on strong sway
                variant.bodyOffset = Math.floor(offset / 3);

                variants.push(variant);
            }

            return variants;
        }

        function renderPet(stageIndex, stageVariant = null) {
            const stage = stageVariant || stages[stageIndex];
            const petDiv = document.getElementById('pet');
            petDiv.innerHTML = '';
            petDiv.classList.remove('growing', 'blooming');

            const container = document.createElement('div');
            container.className = 'pet-body-container';

            // Apply body offset if present (for wind sway)
            if (stage.bodyOffset) {
                container.style.transform = `translateX(${stage.bodyOffset}px)`;
            }

            // Add petals container
            if (stage.petals.length > 0) {
                const petalsDiv = document.createElement('div');
                petalsDiv.className = 'pet-petals';
                stage.petals.forEach(p => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.left = `${p.x}px`;
                    petal.style.top = `${p.y}px`;
                    petalsDiv.appendChild(petal);
                });
                container.appendChild(petalsDiv);
            }

            // Head (only if body exists)
            if (stage.bodyWidth > 0) {
                const head = document.createElement('div');
                head.className = 'pet-head';

                // Build head grid: 4 columns (ear, body, body, ear) x 3 rows
                const headPattern = [
                    [0, 1, 1, 0], // Row 1 - top
                    [1, 1, 1, 1], // Row 2 - with ears
                    [0, 1, 1, 0]  // Row 3 - bottom
                ];

                const eyeRow = 1;
                const eyeCols = [1, 2];

                headPattern.forEach((row, rowIdx) => {
                    row.forEach((cell, colIdx) => {
                        const pixel = document.createElement('div');

                        // Check if this should be an eye
                        if (rowIdx === eyeRow && eyeCols.includes(colIdx)) {
                            pixel.className = stage.eyesComplex ? 'pixel eye-complex' : 'pixel eye';
                        } else if (cell === 1) {
                            pixel.className = 'pixel';
                        } else {
                            pixel.className = 'pixel';
                            pixel.style.background = 'transparent';
                        }

                        head.appendChild(pixel);
                    });
                });

                container.appendChild(head);
            }

            // Arms
            if (stage.arms) {
                const arms = document.createElement('div');
                arms.className = 'pet-arms';

                const leftArm = document.createElement('div');
                leftArm.className = 'pixel';
                arms.appendChild(leftArm);

                const space = document.createElement('div');
                space.style.width = '48px';
                arms.appendChild(space);

                const rightArm = document.createElement('div');
                rightArm.className = 'pixel';
                arms.appendChild(rightArm);

                container.appendChild(arms);
            }

            // Stem
            const stem = document.createElement('div');
            stem.className = 'pet-stem';
            for (let i = 0; i < stage.stemHeight; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                stem.appendChild(pixel);
            }
            container.appendChild(stem);

            // Legs (4 legs in pairs)
            if (stage.legs > 0) {
                const legs = document.createElement('div');
                legs.className = 'pet-legs';

                // Left pair
                const leftLeg1 = document.createElement('div');
                leftLeg1.className = 'leg-column';
                for (let i = 0; i < 2; i++) {
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    leftLeg1.appendChild(pixel);
                }
                legs.appendChild(leftLeg1);

                const leftLeg2 = document.createElement('div');
                leftLeg2.className = 'leg-column';
                for (let i = 0; i < 2; i++) {
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    leftLeg2.appendChild(pixel);
                }
                legs.appendChild(leftLeg2);

                // Gap
                const gap = document.createElement('div');
                gap.style.width = '24px';
                legs.appendChild(gap);

                // Right pair
                const rightLeg1 = document.createElement('div');
                rightLeg1.className = 'leg-column';
                for (let i = 0; i < 2; i++) {
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    rightLeg1.appendChild(pixel);
                }
                legs.appendChild(rightLeg1);

                const rightLeg2 = document.createElement('div');
                rightLeg2.className = 'leg-column';
                for (let i = 0; i < 2; i++) {
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    rightLeg2.appendChild(pixel);
                }
                legs.appendChild(rightLeg2);

                container.appendChild(legs);
            }

            // Add branches
            if (stage.branches.length > 0) {
                const branchesDiv = document.createElement('div');
                branchesDiv.className = 'pet-branches';
                stage.branches.forEach(b => {
                    const branch = document.createElement('div');
                    branch.className = 'branch';
                    branch.style.left = `${b.x}px`;
                    branch.style.bottom = `${b.y}px`;
                    branchesDiv.appendChild(branch);
                });
                container.appendChild(branchesDiv);
            }

            petDiv.appendChild(container);

            // Update info
            document.getElementById('stageName').textContent = `Stage ${stageIndex + 1}/7: ${stage.name}`;
            document.getElementById('stageDesc').textContent = stage.desc;
            document.getElementById('progressFill').style.width = `${((stageIndex + 1) / stages.length) * 100}%`;

            // Add animation
            if (stageIndex === stages.length - 1) {
                petDiv.classList.add('blooming');
            } else {
                petDiv.classList.add('growing');
            }
        }

        function startGrowth() {
            if (growing) return;
            growing = true;
            currentStage = 0;
            growToNextStage();
        }

        function startWindLoop() {
            // Clear any existing wind loop
            if (windLoopInterval) {
                clearInterval(windLoopInterval);
            }

            const bloomStage = stages[stages.length - 1];
            const windVariants = generateWindVariants(bloomStage);

            windVariantIndex = 0;

            // Loop through wind variants every 500ms
            windLoopInterval = setInterval(() => {
                renderPet(stages.length - 1, windVariants[windVariantIndex]);
                windVariantIndex = (windVariantIndex + 1) % windVariants.length;
            }, 500);

            // Stop wind loop after 5 minutes
            setTimeout(() => {
                if (windLoopInterval) {
                    clearInterval(windLoopInterval);
                    windLoopInterval = null;
                }
            }, bloomStage.duration);
        }

        function growToNextStage() {
            if (currentStage >= stages.length) {
                growing = false;
                return;
            }

            renderPet(currentStage);

            if (currentStage < stages.length - 1) {
                setTimeout(() => {
                    currentStage++;
                    growToNextStage();
                }, stages[currentStage].duration);
            } else {
                // Reached Full Bloom - start wind loop
                growing = false;
                startWindLoop();
            }
        }

        function skipStage() {
            if (currentStage < stages.length - 1) {
                currentStage++;
                renderPet(currentStage);
            }
        }

        function resetPet() {
            growing = false;
            currentStage = 0;

            // Stop wind loop if active
            if (windLoopInterval) {
                clearInterval(windLoopInterval);
                windLoopInterval = null;
            }

            renderPet(0);
        }

        // Initialize with seed
        renderPet(0);
    </script>
</body>
</html>
