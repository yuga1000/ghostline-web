<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLINE Spider Pet Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .info h1 {
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .info p {
            margin: 5px 0;
            font-size: 12px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
        }

        .controls button {
            background: #000000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .controls button:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="info">
        <h1>🕷️ GHOSTLINE SPIDER PET</h1>
        <p>Созданно в Pixel Editor</p>
        <p>2 кадра анимации • Ползающий паук</p>
        <p id="fps">FPS: 0</p>
    </div>

    <div class="controls">
        <button id="pauseBtn">⏸️ Pause</button>
        <button id="speedUpBtn">⚡ Speed Up</button>
        <button id="slowDownBtn">🐌 Slow Down</button>
        <button id="resetBtn">🔄 Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Spider frames from pixel editor (all clean #00ff00)
        const SPIDER = {
            // Frame 1 - new pixel art spider
            frame1: [
                {x:5,y:13},{x:22,y:13},{x:5,y:14},{x:12,y:14},{x:15,y:14},{x:22,y:14},{x:5,y:15},{x:11,y:15},{x:16,y:15},{x:22,y:15},
                {x:5,y:16},{x:6,y:16},{x:7,y:16},{x:8,y:16},{x:9,y:16},{x:10,y:16},{x:11,y:16},{x:12,y:16},{x:13,y:16},{x:14,y:16},
                {x:15,y:16},{x:16,y:16},{x:17,y:16},{x:18,y:16},{x:19,y:16},{x:20,y:16},{x:21,y:16},{x:22,y:16},{x:8,y:17},{x:10,y:17},
                {x:13,y:17},{x:14,y:17},{x:17,y:17},{x:19,y:17},{x:4,y:18},{x:5,y:18},{x:6,y:18},{x:7,y:18},{x:8,y:18},{x:10,y:18},
                {x:11,y:18},{x:13,y:18},{x:14,y:18},{x:16,y:18},{x:17,y:18},{x:19,y:18},{x:20,y:18},{x:21,y:18},{x:22,y:18},{x:23,y:18},
                {x:4,y:19},{x:8,y:19},{x:9,y:19},{x:10,y:19},{x:11,y:19},{x:12,y:19},{x:13,y:19},{x:14,y:19},{x:15,y:19},{x:16,y:19},
                {x:17,y:19},{x:18,y:19},{x:19,y:19},{x:23,y:19},{x:4,y:20},{x:6,y:20},{x:7,y:20},{x:8,y:20},{x:9,y:20},{x:10,y:20},
                {x:11,y:20},{x:12,y:20},{x:13,y:20},{x:14,y:20},{x:15,y:20},{x:16,y:20},{x:17,y:20},{x:18,y:20},{x:19,y:20},{x:20,y:20},
                {x:21,y:20},{x:23,y:20},{x:4,y:21},{x:6,y:21},{x:8,y:21},{x:9,y:21},{x:10,y:21},{x:11,y:21},{x:12,y:21},{x:13,y:21},
                {x:14,y:21},{x:15,y:21},{x:16,y:21},{x:17,y:21},{x:18,y:21},{x:19,y:21},{x:21,y:21},{x:23,y:21},{x:4,y:22},{x:6,y:22},
                {x:21,y:22},{x:23,y:22},{x:4,y:23},{x:6,y:23},{x:21,y:23},{x:23,y:23},{x:4,y:24},{x:7,y:24},{x:20,y:24},{x:23,y:24},
                {x:5,y:25},{x:8,y:25},{x:19,y:25},{x:22,y:25},{x:6,y:26},{x:9,y:26},{x:18,y:26},{x:21,y:26},{x:10,y:27},{x:17,y:27}
            ].map(p => ({...p, color: '#00ff00'})),

            // Frame 2 - same for now (you can draw second frame later)
            frame2: [
                {x:5,y:13},{x:22,y:13},{x:5,y:14},{x:12,y:14},{x:15,y:14},{x:22,y:14},{x:5,y:15},{x:11,y:15},{x:16,y:15},{x:22,y:15},
                {x:5,y:16},{x:6,y:16},{x:7,y:16},{x:8,y:16},{x:9,y:16},{x:10,y:16},{x:11,y:16},{x:12,y:16},{x:13,y:16},{x:14,y:16},
                {x:15,y:16},{x:16,y:16},{x:17,y:16},{x:18,y:16},{x:19,y:16},{x:20,y:16},{x:21,y:16},{x:22,y:16},{x:8,y:17},{x:10,y:17},
                {x:13,y:17},{x:14,y:17},{x:17,y:17},{x:19,y:17},{x:4,y:18},{x:5,y:18},{x:6,y:18},{x:7,y:18},{x:8,y:18},{x:10,y:18},
                {x:11,y:18},{x:13,y:18},{x:14,y:18},{x:16,y:18},{x:17,y:18},{x:19,y:18},{x:20,y:18},{x:21,y:18},{x:22,y:18},{x:23,y:18},
                {x:4,y:19},{x:8,y:19},{x:9,y:19},{x:10,y:19},{x:11,y:19},{x:12,y:19},{x:13,y:19},{x:14,y:19},{x:15,y:19},{x:16,y:19},
                {x:17,y:19},{x:18,y:19},{x:19,y:19},{x:23,y:19},{x:4,y:20},{x:6,y:20},{x:7,y:20},{x:8,y:20},{x:9,y:20},{x:10,y:20},
                {x:11,y:20},{x:12,y:20},{x:13,y:20},{x:14,y:20},{x:15,y:20},{x:16,y:20},{x:17,y:20},{x:18,y:20},{x:19,y:20},{x:20,y:20},
                {x:21,y:20},{x:23,y:20},{x:4,y:21},{x:6,y:21},{x:8,y:21},{x:9,y:21},{x:10,y:21},{x:11,y:21},{x:12,y:21},{x:13,y:21},
                {x:14,y:21},{x:15,y:21},{x:16,y:21},{x:17,y:21},{x:18,y:21},{x:19,y:21},{x:21,y:21},{x:23,y:21},{x:4,y:22},{x:6,y:22},
                {x:21,y:22},{x:23,y:22},{x:4,y:23},{x:6,y:23},{x:21,y:23},{x:23,y:23},{x:4,y:24},{x:7,y:24},{x:20,y:24},{x:23,y:24},
                {x:5,y:25},{x:8,y:25},{x:19,y:25},{x:22,y:25},{x:6,y:26},{x:9,y:26},{x:18,y:26},{x:21,y:26},{x:10,y:27},{x:17,y:27}
            ].map(p => ({...p, color: '#00ff00'}))
        };

        // Spider Pet Class
        class SpiderPet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.pixelSize = 4;
                this.currentFrame = 0;
                this.frameTime = 0;
                this.frameDelay = 150; // ms
                this.speed = 1.5;
                this.paused = false;

                // Movement
                this.direction = 1; // 1 = right, -1 = left
            }

            update(deltaTime) {
                if (this.paused) return;

                // Update animation frame
                this.frameTime += deltaTime;
                if (this.frameTime >= this.frameDelay) {
                    this.currentFrame = 1 - this.currentFrame;
                    this.frameTime = 0;
                }

                // Move spider
                this.x += this.speed * this.direction;

                // Bounce off edges
                if (this.x > canvas.width - 120) {
                    this.direction = -1;
                } else if (this.x < 0) {
                    this.direction = 1;
                }
            }

            render() {
                const frame = this.currentFrame === 0 ? SPIDER.frame1 : SPIDER.frame2;

                ctx.save();

                // Flip horizontally if going left
                if (this.direction === -1) {
                    ctx.scale(-1, 1);
                    ctx.translate(-this.x - 32 * this.pixelSize, 0);
                }

                frame.forEach(pixel => {
                    ctx.fillStyle = pixel.color;
                    ctx.fillRect(
                        (this.direction === 1 ? this.x : 0) + pixel.x * this.pixelSize,
                        this.y + pixel.y * this.pixelSize,
                        this.pixelSize,
                        this.pixelSize
                    );
                });

                ctx.restore();
            }
        }

        // Create spider
        const spider = new SpiderPet(100, canvas.height / 2 - 50);

        // Animation loop
        let lastTime = 0;
        let frameCount = 0;
        let fpsTime = 0;

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // FPS counter
            frameCount++;
            fpsTime += deltaTime;
            if (fpsTime >= 1000) {
                document.getElementById('fps').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                fpsTime = 0;
            }

            // Clear canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and render spider
            spider.update(deltaTime);
            spider.render();

            requestAnimationFrame(animate);
        }

        // Controls
        document.getElementById('pauseBtn').addEventListener('click', () => {
            spider.paused = !spider.paused;
            document.getElementById('pauseBtn').textContent = spider.paused ? '▶️ Play' : '⏸️ Pause';
        });

        document.getElementById('speedUpBtn').addEventListener('click', () => {
            spider.speed = Math.min(5, spider.speed + 0.5);
            spider.frameDelay = Math.max(50, spider.frameDelay - 20);
        });

        document.getElementById('slowDownBtn').addEventListener('click', () => {
            spider.speed = Math.max(0.5, spider.speed - 0.5);
            spider.frameDelay = Math.min(300, spider.frameDelay + 20);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            spider.x = 100;
            spider.y = canvas.height / 2 - 50;
            spider.speed = 1.5;
            spider.frameDelay = 150;
            spider.direction = 1;
            spider.paused = false;
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';
        });

        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start animation
        requestAnimationFrame(animate);

        console.log('🕷️ Spider pet loaded!');
    </script>
</body>
</html>
