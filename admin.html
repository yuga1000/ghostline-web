<script>
    // Admin authentication
    let artworks = [];
    
    // Safely load artworks with fallback (Supabase or localStorage)
    async function loadArtworksFromStorage() {
        try {
            if (window.supabaseAdmin) {
                artworks = await window.supabaseAdmin.loadArtworks();
                const serialized = JSON.stringify(artworks);
                localStorage.setItem('ghostline_artworks', serialized);
                localStorage.setItem('ghostline_images', serialized);
            } else {
                const stored =
                    localStorage.getItem('ghostline_artworks') ||
                    localStorage.getItem('ghostline_images');
                if (stored) {
                    artworks = JSON.parse(stored);
                }
            }
        } catch (error) {
            console.warn('localStorage not available:', error.message);
            const stored =
                localStorage.getItem('ghostline_artworks') ||
                localStorage.getItem('ghostline_images');
            artworks = stored ? JSON.parse(stored) : [];
        }
    }

    // Safe save to localStorage
    function saveToLocalStorage() {
        try {
            const serialized = JSON.stringify(artworks);
            localStorage.setItem('ghostline_artworks', serialized);
            localStorage.setItem('ghostline_images', serialized);
        } catch (error) {
            console.warn('Cannot save to localStorage:', error.message);
            // Could implement alternative storage here
        }
    }

    // Initialize artworks
    loadArtworksFromStorage();
    
    let currentImageData = null;
    let currentImageFilename = '';

    // Auto-fill size for polaroid category
    function onCategoryChange(value) {
        if (value === 'polaroid') {
            document.getElementById('size').value = '8.8\u00d710.7 cm';
        }
    }

    async function checkPassword() {
        const password = document.getElementById('passwordInput').value;
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            if (res.ok) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                await loadArtworksFromStorage();
                loadArtworks();
            } else {
                alert('Incorrect password!');
                document.getElementById('passwordInput').value = '';
            }
        } catch (err) {
            console.error('Login error:', err);
            alert('Login failed.');
        }
    }

    function checkPasswordOnEnter(event) {
        if (event.key === 'Enter') {
            checkPassword();
        }
    }

    function logout() {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('passwordInput').value = '';
    }

    // Image handling
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            currentImageFilename = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageData = e.target.result;
                document.getElementById('imagePreview').src = currentImageData;
                document.getElementById('uploadText').classList.add('hidden');
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    }

    // Drag and drop
    function handleDragOver(event) {
        event.preventDefault();
        event.currentTarget.classList.add('dragover');
    }

    function handleDragLeave(event) {
        event.currentTarget.classList.remove('dragover');
    }

    function handleDrop(event) {
        event.preventDefault();
        event.currentTarget.classList.remove('dragover');
        
        const files = event.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            currentImageFilename = file.name;
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result;
                    document.getElementById('imagePreview').src = currentImageData;
                    document.getElementById('uploadText').classList.add('hidden');
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }
    }

    // Form handling
    async function saveArtwork(event) {
        event.preventDefault();

        const editingId = document.getElementById('editingId').value;

        const priceValue = document.getElementById('price').value.trim();
        let parsedPrice = null;
        if (priceValue !== '') {
            parsedPrice = parseFloat(priceValue);
            if (isNaN(parsedPrice)) {
                alert('Price must be a valid number');
                return;
            }
        }

        const artwork = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            status: document.getElementById('status').value,
            category: document.getElementById('category').value,
            price: parsedPrice,
            size: document.getElementById('size').value.trim() || null,
            url: currentImageData
        };
        if (editingId) {
            artwork.id = editingId;
        }

        try {
            if (currentImageData && currentImageData.startsWith('data:') && window.supabaseAdmin) {
                artwork.url = await window.supabaseAdmin.uploadImage(currentImageData, currentImageFilename);
            }
            let saved;
            if (window.supabaseAdmin) {
                saved = await window.supabaseAdmin.saveArtworkToDB(artwork);
            }
            if (!editingId && saved && saved.id) {
                artwork.id = saved.id;
            }
        } catch (err) {
            console.error('Save error:', err);
            alert(err.message || 'Error saving to Supabase');
        }

        if (editingId) {
            const index = artworks.findIndex(a => a.id === editingId);
            if (index !== -1) {
                artworks[index] = artwork;
            } else {
                artworks.push(artwork);
            }
        } else {
            artworks.push(artwork);
        }

        saveToLocalStorage();
        loadArtworks();
        resetForm();
        alert(editingId ? 'Artwork updated!' : 'Artwork saved!');

        // Regenerate portfolio PDF in background (non-blocking)
        setTimeout(() => generatePortfolioPDF(), 200);
    }

    function resetForm() {
        document.getElementById('artworkForm').reset();
        document.getElementById('editingId').value = '';
        document.getElementById('formTitle').textContent = 'ADD NEW ARTWORK';
        document.getElementById('saveButton').textContent = 'SAVE';
        currentImageData = null;
        currentImageFilename = '';
        document.getElementById('uploadText').classList.remove('hidden');
        document.getElementById('imagePreviewContainer').classList.add('hidden');
        document.getElementById('category').value = 'latest';
    }

    function editArtwork(index) {
        const artwork = artworks[index];
        if (artwork) {
            document.getElementById('editingId').value = artwork.id || '';
            document.getElementById('title').value = artwork.title || '';
            document.getElementById('description').value = artwork.description || '';
            document.getElementById('status').value = artwork.status || 'available';
            document.getElementById('price').value = artwork.price || '';
            document.getElementById('size').value = artwork.size || '';
            document.getElementById('category').value = artwork.category || 'latest';

            if (artwork.url) {
                currentImageData = artwork.url;
                currentImageFilename = artwork.url.split('/').pop();
                document.getElementById('imagePreview').src = artwork.url;
                document.getElementById('uploadText').classList.add('hidden');
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }

            document.getElementById('formTitle').textContent = 'EDIT ARTWORK';
            document.getElementById('saveButton').textContent = 'UPDATE';
        }
    }

    async function deleteArtwork(index) {
        const artwork = artworks[index];
        if (artwork && confirm('Delete selected artwork? This cannot be undone.')) {
            try {
                if (window.supabaseAdmin && artwork.id) {
                    await window.supabaseAdmin.deleteArtwork(artwork.id);
                }
                artworks.splice(index, 1);
                saveToLocalStorage();
                loadArtworks();
                alert('Artwork deleted!');
            } catch (error) {
                alert('Failed to delete artwork: ' + (error.message || error));
            }
        }
    }

    function loadArtworks() {
        try {
            const gridContainer = document.getElementById('artworkGrid');
            const countContainer = document.getElementById('artworkCount');
            
            if (!gridContainer) return;
            
            countContainer.textContent = `${artworks.length} ARTWORKS`;
            
            if (artworks.length === 0) {
                gridContainer.innerHTML = '<div class="col-span-full text-center py-8"><p class="text-green-600">No artworks yet. Add your first piece!</p></div>';
                return;
            }

            gridContainer.innerHTML = artworks.map((artwork, index) => `
                <div class="artwork-item">
                    <div class="artwork-image">
                        ${artwork.url ? `<img src="${artwork.url}" alt="${artwork.title || 'Artwork'}">` : '<div class="text-xs text-green-600">No Image</div>'}
                    </div>
                    
                    <div class="mb-2">
                        <div class="flex items-center mb-1">
                            <span class="status-indicator status-${artwork.status || 'available'}"></span>
                            <strong class="text-sm">${artwork.title || 'Untitled'}</strong>
                        </div>
                        <div class="text-xs text-green-400">
                            ${artwork.category || 'latest'} • ${artwork.price ? '$' + artwork.price : 'No price'}
                        </div>
                        ${artwork.size ? `<div class="text-xs text-green-500 mt-1">📐 ${artwork.size}</div>` : ''}
                        ${artwork.description ? `<div class="text-xs text-green-600 mt-1">${artwork.description.substring(0, 50)}${artwork.description.length > 50 ? '...' : ''}</div>` : ''}
                    </div>
                    
                    <div class="artwork-controls">
                        <button class="admin-button text-xs flex-1" onclick="editArtwork(${index})">EDIT</button>
                        <button class="admin-button danger text-xs" onclick="deleteArtwork(${index})">DEL</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            const gridContainer = document.getElementById('artworkGrid');
            if (gridContainer) {
                gridContainer.innerHTML = '<div class="col-span-full text-center py-8"><p class="text-red-500">Error loading artworks</p></div>';
            }
        }
    }

    function saveToLocalStorage() {
        try {
            const serialized = JSON.stringify(artworks);
            localStorage.setItem('ghostline_artworks', serialized);
            localStorage.setItem('ghostline_images', serialized);
        } catch (error) {
            console.warn('Cannot save to localStorage:', error.message);
            // Show user-friendly message instead of alert
            const statusMsg = document.createElement('div');
            statusMsg.textContent = 'Warning: Cannot save to local storage. Changes may not persist.';
            statusMsg.style.cssText = 'position:fixed;top:20px;right:20px;background:#ff6600;color:#000;padding:10px;z-index:9999;font-size:12px;';
            document.body.appendChild(statusMsg);
            setTimeout(() => statusMsg.remove(), 5000);
        }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', async function() {
        // Silent initialization - no console logs
        await loadArtworksFromStorage();
    });
</script>

<script>
// =============================================
// AUTO PORTFOLIO PDF GENERATOR
// Triggered after every artwork save.
// Builds PDF from all gallery images and
// uploads to Supabase Storage as portfolio/portfolio.pdf
// =============================================

const PDF_STORAGE_PATH = 'portfolio/portfolio.pdf';

function showPdfToast(msg, state) {
    // state: 'busy' | 'ok' | 'err'
    let el = document.getElementById('pdfToast');
    if (!el) {
        el = document.createElement('div');
        el.id = 'pdfToast';
        el.style.cssText = [
            'position:fixed', 'bottom:20px', 'right:20px', 'z-index:9999',
            'font-family:Share Tech Mono,monospace', 'font-size:11px',
            'padding:10px 18px', 'background:#000', 'border:1px solid #003300',
            'color:#00ff00', 'letter-spacing:1px', 'max-width:300px',
            'transition:opacity 0.3s', 'display:none'
        ].join(';');
        document.body.appendChild(el);
    }
    const colors = { busy: '#00ff00', ok: '#00ff88', err: '#ff4400' };
    const borders = { busy: '#003300', ok: '#003322', err: '#330000' };
    el.style.color       = colors[state]  || colors.busy;
    el.style.borderColor = borders[state] || borders.busy;
    el.textContent = '// PDF: ' + msg;
    el.style.display = 'block';
    el.style.opacity = '1';
    if (state === 'ok' || state === 'err') {
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none'; }, 300); }, 5000);
    }
}

async function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

// Fetch images in parallel (max `concurrency` at a time)
async function fetchAllImages(works, onProgress) {
    const results = new Array(works.length).fill(null);
    let done = 0;
    let idx  = 0;
    const CONCURRENCY = 6;

    async function worker() {
        while (idx < works.length) {
            const i = idx++;
            try {
                const resp = await fetch(works[i].url, { mode: 'cors' });
                if (!resp.ok) throw new Error('http ' + resp.status);
                const blob = await resp.blob();
                const dataUrl = await blobToDataUrl(blob);
                const fmt = blob.type.includes('png') ? 'PNG' : 'JPEG';
                // Get natural dimensions for aspect-ratio preserve
                const dims = await new Promise(res => {
                    const img = new Image();
                    img.onload  = () => res({ w: img.naturalWidth, h: img.naturalHeight });
                    img.onerror = () => res(null);
                    img.src = dataUrl;
                });
                results[i] = { dataUrl, fmt, dims };
            } catch(e) {
                results[i] = null; // broken image — will be skipped
            }
            done++;
            if (onProgress) onProgress(done, works.length);
        }
    }

    await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));
    return results;
}

async function generatePortfolioPDF() {
    if (!window.jspdf || !window.supabaseAdmin) return;

    showPdfToast('starting...', 'busy');

    try {
        const { jsPDF } = window.jspdf;

        // ── 1. Fetch all gallery works ──────────────────────
        const { data: works, error } = await window.supabaseAdmin.supabase
            .from('images')
            .select('*')
            .neq('category', 'lost-archive')
            .neq('category', 'polaroid')
            .order('created_at', { ascending: true });

        if (error) throw error;
        if (!works || works.length === 0) { showPdfToast('no works found', 'err'); return; }

        showPdfToast(`fetching ${works.length} images...`, 'busy');

        // ── 2. Download all images in parallel ───────────────
        const images = await fetchAllImages(works, (done, total) => {
            showPdfToast(`${done} / ${total} images`, 'busy');
        });

        showPdfToast('building pdf...', 'busy');

        // ── 3. Build PDF ─────────────────────────────────────
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const W = 210, H = 297;
        const margin  = 14;
        const slotH   = (H - 3 * margin) / 2; // 2 works per page
        const imgAreaW = W - 2 * margin;
        const imgAreaH = slotH - 16;           // leave 16mm for title/meta

        // ── Cover ────────────────────────────────────────────
        doc.setFillColor(0, 0, 0);
        doc.rect(0, 0, W, H, 'F');
        doc.setFont('courier', 'bold');
        doc.setFontSize(26); doc.setTextColor(0, 200, 0);
        doc.text('GHOSTLINE', W / 2, H / 2 - 14, { align: 'center' });
        doc.setFontSize(9);  doc.setTextColor(0, 80, 0);
        doc.text('VISUAL SYSTEM // DIGITAL ART', W / 2, H / 2 + 2, { align: 'center' });
        doc.setFontSize(8);
        doc.text(`${works.length} WORKS // ${new Date().getFullYear()}`, W / 2, H / 2 + 14, { align: 'center' });

        // ── Works (2 per page) ───────────────────────────────
        for (let i = 0; i < works.length; i++) {
            const item   = works[i];
            const slot   = i % 2;        // 0 = top half, 1 = bottom half
            const yTop   = margin + slot * (slotH + margin);

            if (slot === 0) {
                doc.addPage();
                doc.setFillColor(0, 0, 0);
                doc.rect(0, 0, W, H, 'F');
            }

            const imgData = images[i];
            if (imgData && imgData.dims) {
                // Preserve aspect ratio inside the slot
                const aspect = imgData.dims.w / imgData.dims.h;
                let dw = imgAreaW, dh = dw / aspect;
                if (dh > imgAreaH) { dh = imgAreaH; dw = dh * aspect; }
                const dx = margin + (imgAreaW - dw) / 2;
                doc.addImage(imgData.dataUrl, imgData.fmt, dx, yTop, dw, dh, '', 'FAST');
            } else {
                // Placeholder for broken image
                doc.setFillColor(10, 10, 10);
                doc.rect(margin, yTop, imgAreaW, imgAreaH, 'F');
                doc.setTextColor(40, 40, 40); doc.setFontSize(7);
                doc.text('[image unavailable]', W / 2, yTop + imgAreaH / 2, { align: 'center' });
            }

            // Title + meta
            const metaY = yTop + imgAreaH + 5;
            doc.setFont('courier', 'bold'); doc.setFontSize(8); doc.setTextColor(0, 180, 0);
            doc.text((item.title || 'UNTITLED').toUpperCase(), margin, metaY);

            const metaParts = [item.size, item.status, item.created_at ? new Date(item.created_at).getFullYear() : ''].filter(Boolean);
            if (metaParts.length) {
                doc.setFont('courier', 'normal'); doc.setFontSize(6); doc.setTextColor(0, 70, 0);
                doc.text(metaParts.join(' // '), margin, metaY + 5);
            }
        }

        // ── 4. Upload PDF to Supabase Storage ────────────────
        showPdfToast('uploading...', 'busy');
        const pdfBlob = doc.output('blob');

        const { error: upErr } = await window.supabaseAdmin.supabase.storage
            .from('images')
            .upload(PDF_STORAGE_PATH, pdfBlob, {
                contentType: 'application/pdf',
                upsert: true,
                cacheControl: '60'
            });

        if (upErr) throw upErr;

        showPdfToast(`done — ${works.length} works`, 'ok');
        console.log('[Portfolio PDF] Updated:', PDF_STORAGE_PATH);

    } catch(e) {
        console.error('[Portfolio PDF] Error:', e);
        showPdfToast('error: ' + e.message, 'err');
    }
}
