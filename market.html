<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLINE MARKET - App Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;700&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/market.css">

    <style>
        body {
            background: #0a0a0a;
            font-family: 'IBM Plex Mono', monospace;
            overflow-x: hidden;
            color: #aaa;
        }

        .desktop-pattern {
            background:
                linear-gradient(transparent 50%, rgba(0, 255, 0, 0.015) 50%),
                radial-gradient(ellipse at center, #111 0%, #000 80%);
            background-size: 100% 4px, 100% 100%;
            min-height: 100vh;
            position: relative;
        }

        /* vignette removed */
    </style>
</head>
<body>

<div class="desktop-pattern">
    <!-- Top Terminal Bar -->
    <div class="win95-titlebar">
        <div class="titlebar-text">
            <span class="blink-cursor">█</span> GHOSTLINE MARKET v1.0 - [SHOWCASE MODE]
        </div>
        <div class="titlebar-buttons">
            <a href="index.html" class="win95-btn-close">✕</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">

        <!-- App Grid -->
        <div class="app-grid">

            <!-- App Card - PixelTap -->
            <div class="win95-app-card">
                <div class="win95-card-header" style="padding: 6px 10px;">
                    <div class="win95-icon" style="font-size: 12px;">▦</div>
                    <div class="card-title" style="font-size: 11px;">PIXELTAP.EXE</div>
                    <span class="status-badge badge-beta" style="font-size: 8px; padding: 1px 6px;">BETA</span>
                </div>
                <div class="win95-card-body" style="padding: 8px;">
                    <div class="app-screenshot" style="padding: 0; margin-bottom: 8px;">
                        <img src="apps/pixeltap_cover.gif" alt="PixelTap" style="width: 100%; aspect-ratio: 1; object-fit: cover; image-rendering: pixelated; background: #000; display: block;">
                    </div>
                    <div class="app-description" style="font-size: 10px; line-height: 1.4;">
                        <strong>PixelTap</strong> — pixel art drawing app<br>
                        <span style="color: #888;">FREE</span> · <span style="color: #00ff00;">PRO $1</span>
                    </div>
                </div>
                <div class="win95-card-footer" style="padding: 6px 8px; gap: 4px; flex-wrap: wrap;">
                    <a href="https://yuga1000.github.io/pixeltap/" target="_blank" class="win95-button primary" style="text-decoration: none; text-align: center; font-size: 10px; padding: 4px 8px;">OPEN</a>
                    <a href="apps/PixelTap.apk" download class="win95-button" style="text-decoration: none; text-align: center; font-size: 10px; padding: 4px 8px;">APK</a>
                    <a href="https://t.me/Pixeltap_app_bot" target="_blank" class="win95-button" style="text-decoration: none; text-align: center; font-size: 10px; padding: 4px 8px;">PRO</a>
                </div>
            </div>

        </div>

        <!-- Bottom Status Bar -->
        <div class="win95-statusbar mt-8">
            <div class="status-section">
                <span class="status-icon">▪</span> 1 APP AVAILABLE
            </div>
            <div class="status-section">
                <span class="status-icon">■</span> SYSTEM: ONLINE
            </div>
            <div class="status-section">
                <span class="status-icon blink-green">●</span> <span id="clock">00:00:00</span>
            </div>
        </div>

    </div>

    <!-- Floating Pixels Effect -->
    <div id="pixel-rain"></div>
</div>

<script>
    // Clock
    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
        document.getElementById('clock').textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Pixel Rain Effect (multicolor)
    function createPixelRain() {
        const container = document.getElementById('pixel-rain');
        if (!container) return;

        const colorClasses = ['', 'fp-cyan', 'fp-magenta'];

        setInterval(() => {
            const pixel = document.createElement('div');
            pixel.className = 'falling-pixel';

            // Random color
            const colorClass = colorClasses[Math.floor(Math.random() * colorClasses.length)];
            if (colorClass) pixel.classList.add(colorClass);

            pixel.style.left = Math.random() * 100 + '%';
            pixel.style.animationDuration = (Math.random() * 3 + 2) + 's';
            pixel.style.opacity = (Math.random() * 0.4 + 0.3).toFixed(2);

            const chars = ['█', '▓', '▒', '░', '■', '□'];
            pixel.textContent = chars[Math.floor(Math.random() * chars.length)];

            container.appendChild(pixel);

            setTimeout(() => {
                if (pixel.parentNode) {
                    pixel.parentNode.removeChild(pixel);
                }
            }, 5000);
        }, 500);
    }

    // Filter bar interaction (visual only)
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Button hover effects
    document.querySelectorAll('.win95-button').forEach(btn => {
        if (!btn.classList.contains('disabled')) {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 100);
            });
        }
    });

    // Start effects
    document.addEventListener('DOMContentLoaded', function() {
        createPixelRain();
        console.log('🎮 GHOSTLINE MARKET INITIALIZED');
    });
</script>

</body>
</html>
