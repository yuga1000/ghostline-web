// ============================================================
// PREDICTION TRACKER — localStorage
// ============================================================
function getTracker() {
  try {
    return JSON.parse(localStorage.getItem('satoshi_tracker') || '{}');
  } catch { return {}; }
}

function savePrediction(timeframe, price, direction, probability) {
  const tracker = getTracker();
  const key = `${timeframe}`;
  if (!tracker[key]) tracker[key] = { predictions: [], correct: 0, total: 0 };

  // Minimum time before checking: tomorrow = 24h, week = 7 days
  const minMs = timeframe === 'tomorrow' ? 24 * 3600000 : 7 * 24 * 3600000;

  // Check unresolved predictions that are old enough
  for (const pred of tracker[key].predictions) {
    if (!pred.resolved && Date.now() - pred.time >= minMs) {
      const actualDir = price > pred.price ? 'UP' : price < pred.price ? 'DOWN' : null;
      if (actualDir) {
        pred.resolved = true;
        pred.actualDir = actualDir;
        pred.actualPrice = price;
        pred.correct = actualDir === pred.direction;
        tracker[key].total++;
        if (pred.correct) tracker[key].correct++;
      }
    }
  }

  // Only save one prediction per day (tomorrow) or per week (week)
  const last = tracker[key].predictions[tracker[key].predictions.length - 1];
  const dedupMs = timeframe === 'tomorrow' ? 12 * 3600000 : 3 * 24 * 3600000;
  if (!last || Date.now() - last.time >= dedupMs) {
    tracker[key].predictions.push({
      time: Date.now(),
      price,
      direction,
      probability,
      resolved: false,
    });
  }

  // Keep only last 100 predictions
  if (tracker[key].predictions.length > 100) {
    tracker[key].predictions = tracker[key].predictions.slice(-100);
  }

  localStorage.setItem('satoshi_tracker', JSON.stringify(tracker));
  return tracker[key];
}

function getAccuracy(timeframe) {
  const tracker = getTracker();
  const data = tracker[timeframe];
  if (!data || data.total === 0) return null;
  return { correct: data.correct, total: data.total, pct: (data.correct / data.total * 100) };
}

const CORS_PROXIES = ['', 'https://corsproxy.io/?', 'https://api.allorigins.win/raw?url='];

async function tryFetch(url, timeoutMs = 8000) {
  // Sites with proper CORS — skip proxies
  const directDomains = ['coingecko.com', 'alternative.me', 'mempool.space'];
  const isDirect = directDomains.some(d => url.includes(d));
  const proxies = isDirect ? [''] : CORS_PROXIES;

  for (const proxy of proxies) {
    try {
      const target = proxy ? proxy + encodeURIComponent(url) : url;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      const res = await fetch(target, { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.status === 429) throw new Error('Rate limited');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text.startsWith('Throttled') || text.startsWith('<!')) throw new Error('Throttled');
      return JSON.parse(text);
    } catch (e) { continue; }
  }
  throw new Error('All fetch attempts failed');
}

// ── CoinGecko (primary — works without CORS issues) ──
function buildCandlesFromMarketChart(prices, volumes, intervalMs) {
  // Group price points into candle intervals
  if (prices.length < 2) return [];
  const candles = [];
  let i = 0;
  while (i < prices.length) {
    const bucketStart = prices[i][0];
    const bucketEnd = bucketStart + intervalMs;
    let open = prices[i][1], high = prices[i][1], low = prices[i][1], close = prices[i][1];
    let vol = 0, volCount = 0;
    while (i < prices.length && prices[i][0] < bucketEnd) {
      const p = prices[i][1];
      high = Math.max(high, p);
      low = Math.min(low, p);
      close = p;
      // Find closest volume entry
      if (volumes.length > 0) {
        const vi = volumes.findIndex(v => Math.abs(v[0] - prices[i][0]) < intervalMs / 2);
        if (vi >= 0) { vol += volumes[vi][1]; volCount++; }
      }
      i++;
    }
    candles.push({
      timestamp: bucketStart, open, high, low, close,
      volume: volCount > 0 ? vol / volCount : 0, takerBuyVol: 0,
    });
  }
  return candles;
}

async function fetchCoinGecko(timeframe) {
  // CoinGecko free: days=1 → ~5min data, days=7-30 → hourly, days=90+ → daily
  const daysMap = { '60': 2, '240': 14, 'D': 90, 'W': 365 };
  const intervalMs = { '60': 3600000, '240': 14400000, 'D': 86400000, 'W': 604800000 };
  const days = daysMap[timeframe];

  const mcUrl = `https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=${days}`;
  const mc = await tryFetch(mcUrl);

  const candles = buildCandlesFromMarketChart(mc.prices, mc.total_volumes, intervalMs[timeframe]);
  const price = mc.prices[mc.prices.length - 1][1];
  const price24hAgo = mc.prices.find(p => p[0] >= Date.now() - 86400000);
  const change24h = price24hAgo ? ((price - price24hAgo[1]) / price24hAgo[1]) * 100 : 0;

  return { candles, price, change24h };
}

async function fetchCoinGeckoDaily() {

    })),
    price: parseFloat(tickerRes.lastPrice),
    change24h: parseFloat(tickerRes.priceChangePercent),

}

async function fetchBybit(timeframe) {
  const klineUrl = `https://api.bybit.com/v5/market/kline?category=spot&symbol=${CONFIG.symbol}&interval=${timeframe}&limit=${CONFIG.limit}`;

  const [klineRes, tickerRes] = await Promise.all([tryFetch(klineUrl), tryFetch(tickerUrl)]);
  if (klineRes.retCode !== 0) throw new Error(klineRes.retMsg);
  const ticker = tickerRes.result.list[0];
  return {
    candles: klineRes.result.list.map(c => ({
      timestamp: parseInt(c[0]), open: parseFloat(c[1]), high: parseFloat(c[2]),
      low: parseFloat(c[3]), close: parseFloat(c[4]), volume: parseFloat(c[5]),
      takerBuyVol: 0,
    })).reverse(),
    price: parseFloat(ticker.lastPrice),
    change24h: parseFloat(ticker.price24hPcnt) * 100,
  };
}

async function fetchHalvingCycle() {
  try {
    const d = await tryFetch('https://mempool.space/api/blocks/tip/height');
    const height = typeof d === 'number' ? d : parseInt(d);
    const halvingInterval = 210000;
    const lastHalving = Math.floor(height / halvingInterval) * halvingInterval;
    const nextHalving = lastHalving + halvingInterval;
    const progress = (height - lastHalving) / halvingInterval;
    return { height, progress, blocksToNext: nextHalving - height };
  } catch { return null; }
}

// Cache for TF-independent data (fetched once, reused across timeframe switches)

  ts: 0,
  fearGreed: null, fundingRate: null, longShortRatio: null,
  openInterest: null, ethBtcRatio: null, halvingCycle: null,
  btcDominance: null, dailyCandles: null,

const SIDE_TTL_MS = 2 * 60 * 1000; // 2 min — signals don't change fast

async function fetchSideSignals(force = false) {
  const fresh = !force && (Date.now() - sideCache.ts < SIDE_TTL_MS) && sideCache.fearGreed !== null;
  if (fresh) return;

  const [fg, fr, lsr, oi, ethbtc, halving] = await Promise.all([
    fetchFearGreed(),
    fetchFundingRate(),
    fetchLongShortRatio(),
    fetchOpenInterest(),
    fetchEthBtcRatio(),
    fetchHalvingCycle(),
  ]);
  sideCache.fearGreed = fg;
  sideCache.fundingRate = fr;
  sideCache.longShortRatio = lsr;
  sideCache.openInterest = oi;
  sideCache.ethBtcRatio = ethbtc;
  sideCache.halvingCycle = halving;

  // Daily candles + dominance — also TF-independent
  const dailyResult = await fetchCoinGeckoDaily().catch(() => null);
  if (dailyResult) sideCache.dailyCandles = dailyResult.candles;
  sideCache.btcDominance = await fetchBtcDominance().catch(() => sideCache.btcDominance);
  sideCache.ts = Date.now();
}

async function fetchData(timeframe) {
  // Candles for this TF — this is the only TF-dependent call
  const candlesPromise = fetchCoinGecko(timeframe).catch(() => fetchBinance(timeframe)).catch(() => fetchBybit(timeframe));

  // Kick off side-signal refresh in parallel (uses cache if fresh)
  const sidePromise = fetchSideSignals();

  const [marketData] = await Promise.all([candlesPromise, sidePromise]);

  // Apply cached side signals to state
  state.fearGreed = sideCache.fearGreed;
  state.fundingRate = sideCache.fundingRate;
  state.longShortRatio = sideCache.longShortRatio;
  state.openInterest = sideCache.openInterest;
  state.ethBtcRatio = sideCache.ethBtcRatio;
  state.halvingCycle = sideCache.halvingCycle;
  state.btcDominance = sideCache.btcDominance;

  marketData.dailyCandles = sideCache.dailyCandles;
  return marketData;
}

// ============================================================
// TECHNICAL INDICATORS
// ============================================================
function calcRSI(candles, period = 14) {
  if (candles.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const ch = candles[i].close - candles[i-1].close;
    if (ch >= 0) gains += ch; else losses -= ch;
  }
  let ag = gains / period, al = losses / period;
  for (let i = period + 1; i < candles.length; i++) {
    const ch = candles[i].close - candles[i-1].close;
    ag = (ag * (period-1) + Math.max(ch, 0)) / period;
    al = (al * (period-1) + Math.max(-ch, 0)) / period;
  }
  return al === 0 ? 100 : 100 - 100 / (1 + ag / al);
}

function calcMACD(candles) {
  if (candles.length < 26) return { histogram: 0 };
  let e12 = candles[0].close, e26 = candles[0].close, sig = 0, hist = 0;
  for (let i = 1; i < candles.length; i++) {
    e12 = candles[i].close * 2/13 + e12 * 11/13;
    e26 = candles[i].close * 2/27 + e26 * 25/27;
    const macd = e12 - e26;
    sig = macd * 2/10 + sig * 8/10;
    hist = macd - sig;
  }
  return { histogram: hist };
}

function calcBollinger(candles, period = 20) {
  if (candles.length < period) return { percentB: 0.5 };
  const cl = candles.slice(-period).map(c => c.close);
  const sma = cl.reduce((a,b) => a+b) / period;
  const sd = Math.sqrt(cl.reduce((s,c) => s + (c-sma)**2, 0) / period);
  const up = sma + 2*sd, lo = sma - 2*sd;
  return { percentB: (up-lo) === 0 ? 0.5 : (candles[candles.length-1].close - lo) / (up - lo) };
}

function calcATR(candles, period = 14) {
  if (candles.length < 2) return 0;
  let atr = 0;
  for (let i = 1; i < candles.length; i++) {
    const tr = Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-candles[i-1].close), Math.abs(candles[i].low-candles[i-1].close));
    if (i <= period) atr += tr / period;
    else atr = (atr * (period-1) + tr) / period;
  }
  return atr;
}

function detectPatterns(candles) {
  if (candles.length < 3) return [];
  const L = candles[candles.length-1], P = candles[candles.length-2];
  const body = Math.abs(L.close-L.open), range = L.high-L.low;
  const uW = L.high - Math.max(L.open,L.close), lW = Math.min(L.open,L.close) - L.low;
  const isG = L.close > L.open, pBody = Math.abs(P.close-P.open);
  const pats = [];
  if (range > 0 && body/range < 0.1) pats.push({ name: 'Doji', s: 0 });
  if (body > 0 && lW > body*2 && uW < body*0.5) pats.push({ name: 'Hammer', s: 50 });
  if (body > 0 && uW > body*2 && lW < body*0.5) pats.push({ name: 'Shoot.Star', s: -50 });
  if (P.close<P.open && isG && body>pBody*1.5 && L.open<=P.close && L.close>=P.open) pats.push({ name: 'Bull Engulf', s: 70 });
  if (P.close>P.open && !isG && body>pBody*1.5 && L.open>=P.close && L.close<=P.open) pats.push({ name: 'Bear Engulf', s: -70 });
  return pats;
}

// Weight profiles per horizon
// Notes on weight tuning after the audit:
// - bodyMass + momentum are ~80% correlated (both measure directional price energy).
//   We keep momentum as the primary, reduce bodyMass to half its original weight.
// - grRatio + volume are ~70% correlated (both count green vs red activity).
//   Volume is the richer signal (bigger green candle = stronger signal than 1 green bar).
// - bollinger + rsi measure deviation from mean at short TF — both kept but bollinger trimmed.
// - Freed weight is redistributed to high-signal historical factors: rainbow, runReversion, ddDuration.
const HORIZON_WEIGHTS = {
  SHORT: { // next candle — momentum & order flow heavy
    bodyMass: 0.04, volume: 0.08, momentum: 0.12, takerBuy: 0.12,
    rsi: 0.10, macd: 0.08, bollinger: 0.04, streak: 0.05, wicks: 0.05,
    patterns: 0.07, grRatio: 0.01, longShort: 0.05, openInterest: 0.05,
    rainbow: 0.04, painDD: 0.04,
    runReversion: 0.06, // mean reversion after N-day run — most relevant short-term
  },
  MEDIUM: { // next 24h — trend indicators + historical context
    bodyMass: 0.03, volume: 0.05, momentum: 0.07, takerBuy: 0.06,
    rsi: 0.12, macd: 0.10, bollinger: 0.06, streak: 0.03, wicks: 0.03,
    patterns: 0.05, grRatio: 0.01, longShort: 0.06, openInterest: 0.05,
    btcDom: 0.03, ethBtc: 0.02,
    rainbow: 0.08, seasonality: 0.04, painDD: 0.05,
    runReversion: 0.03, ddDuration: 0.03,
  },
  LONG: { // next 7 days — macro + historical data heavy
    bodyMass: 0.02, volume: 0.03, momentum: 0.04, takerBuy: 0.04,
    rsi: 0.08, macd: 0.07, bollinger: 0.04, streak: 0.02, wicks: 0.02,
    patterns: 0.03, grRatio: 0.01, longShort: 0.06, openInterest: 0.05,
    btcDom: 0.04, ethBtc: 0.03, halving: 0.04, fearGreed: 0.05, funding: 0.03,
    rainbow: 0.10, seasonality: 0.05, painDD: 0.06,
    ddDuration: 0.07, // drawdown duration matters most on longer horizons
    runReversion: 0.02,
  },
};

function computeFactors(candles) {
  const N = candles.length;
  const factors = {};

  // 1. Body Mass
  let gm = 0, rm = 0;
  for (const c of candles) { const b = c.close-c.open; if (b>=0) gm+=b; else rm-=b; }
  factors.bodyMass = { name: 'Body Mass', score: (gm+rm)===0?0:((gm-rm)/(gm+rm))*100 };

  // 2. Volume Sentiment
  let vNet = 0, vTot = 0;
  for (const c of candles) { const d = c.close>=c.open?1:-1; vNet+=d*c.volume; vTot+=c.volume; }
  factors.volume = { name: 'Volume', score: vTot===0?0:(vNet/vTot)*100 };

  // 3. Momentum
  const rev = [...candles].reverse();
  const hl = N/3, dk = Math.pow(0.5, 1/hl);
  let mW = 0, mMax = 0;
  for (let i = 0; i < N; i++) {
    const w = Math.pow(dk, i), bp = rev[i].open===0?0:(rev[i].close-rev[i].open)/rev[i].open;
    mW += bp*w; mMax += Math.abs(bp)*w;
  }
  factors.momentum = { name: 'Momentum', score: mMax===0?0:(mW/mMax)*100 };

  // 4. Taker Buy
  let tBuy = 0, tVol2 = 0;
  for (const c of candles) { tBuy += c.takerBuyVol||0; tVol2 += c.volume; }
  factors.takerBuy = { name: 'Taker Buy', score: (tVol2===0||tBuy===0)?0:(tBuy/tVol2-0.5)*200 };

  // 5. RSI — contrarian at extremes, neutral in the mid-range.
  // Previous mid-range formula gave false bullish bias whenever RSI<50, which is
  // actually neutral territory. Now: oversold (<=30) bullish, overbought (>=70) bearish,
  // soft transitions 30-40 and 60-70, and 40-60 is a genuine dead zone.
  const rsi = calcRSI(candles);
  let rsiScore;
  if (rsi <= 30)      rsiScore = (30 - rsi) / 30 * 100;        // deep oversold → strong bull
  else if (rsi <= 40) rsiScore = (40 - rsi) / 10 * 20;          // mild oversold → weak bull
  else if (rsi >= 70) rsiScore = (70 - rsi) / 30 * 100;         // deep overbought → strong bear
  else if (rsi >= 60) rsiScore = (60 - rsi) / 10 * 20;          // mild overbought → weak bear
  else                rsiScore = 0;                              // dead zone 40-60
  factors.rsi = { name: 'RSI', score: rsiScore, detail: rsi.toFixed(0) };

  // 6. MACD
  const { histogram } = calcMACD(candles);
  const price = candles[N-1].close;
  factors.macd = { name: 'MACD', score: Math.max(-100,Math.min(100,price===0?0:(histogram/price)*10000)) };

  // 7. Bollinger
  const { percentB } = calcBollinger(candles);
  factors.bollinger = { name: 'Bollinger', score: Math.max(-100,Math.min(100,(0.5-percentB)*200)) };

  // 8. Streak — intraday only (short-term momentum).
  // For longer horizons, runReversion (factor #20) provides the mean-reversion counterweight,
  // computed from daily candles. Keep streak score mild so it doesn't fight runReversion.
  const lastDir = candles[N-1].close>=candles[N-1].open?1:-1;
  let streak = 1;
  for (let i = N-2; i>=0; i--) { if ((candles[i].close>=candles[i].open?1:-1)===lastDir) streak++; else break; }
  // Score capped at ±40 (was ±100). Only a gentle confirmation signal.
  factors.streak = { name: 'Streak', score: lastDir*Math.min(streak,8)*5, detail: `${streak} ${lastDir>0?'green':'red'}` };

  // 9. Wicks
  let wBias = 0, wCnt = 0;
  for (const c of candles.slice(-5)) {
    const r = c.high-c.low; if (r===0) continue;
    wBias += (Math.min(c.open,c.close)-c.low-(c.high-Math.max(c.open,c.close)))/r; wCnt++;
  }
  factors.wicks = { name: 'Wicks', score: wCnt===0?0:(wBias/wCnt)*100 };

  // 10. Patterns
  const pats = detectPatterns(candles);
  const patScore = pats.reduce((s,p) => s+p.s, 0);
  factors.patterns = { name: 'Patterns', score: Math.max(-100,Math.min(100,patScore)), detail: pats.map(p=>p.name).join(',')||'none' };

  // 11. G/R Ratio
  let gC = 0, rC = 0;
  for (const c of candles) { if (c.close>=c.open) gC++; else rC++; }
  factors.grRatio = { name: 'G/R Ratio', score: N===0?0:((gC-rC)/N)*100, detail: `${gC}/${rC}` };

  // 12. Long/Short Ratio (contrarian — high longs = bearish)
  if (state.longShortRatio !== null) {
    const lsr = state.longShortRatio;
    const lsScore = Math.max(-100, Math.min(100, (1 - lsr) * 100));
    factors.longShort = { name: 'L/S Ratio', score: lsScore, detail: lsr.toFixed(2) };
  } else {
    factors.longShort = { name: 'L/S Ratio', score: 0, detail: 'N/A' };
  }

  // 13. Open Interest — independent signal (no coupling to momentum).
  // Rising OI = new capital entering the market. Interpretation depends on context,
  // but as a standalone factor: OI growth is mildly bullish (fresh money, conviction),
  // OI contraction is bearish (deleveraging, position unwind).
  if (state.openInterest) {
    const oiChange = state.openInterest.change;
    const oiScore = Math.max(-100, Math.min(100, oiChange * 5));
    factors.openInterest = { name: 'Open Int.', score: oiScore, detail: `${oiChange>=0?'+':''}${oiChange.toFixed(1)}%` };
  } else {
    factors.openInterest = { name: 'Open Int.', score: 0, detail: 'N/A' };
  }

  // 14. BTC Dominance (rising dom = risk-off, bullish for BTC; low dom = alt season).
  // Baseline shifted to 57% — that's the historical mean over the last 3 years.
  // Using 50% gave a permanent false-bull bias since dominance never approached 50%.
  if (state.btcDominance !== null) {
    const dom = state.btcDominance;
    const domScore = Math.max(-100, Math.min(100, (dom - 57) * 4));
    factors.btcDom = { name: 'BTC Dom.', score: domScore, detail: `${dom.toFixed(1)}%` };
  } else {
    factors.btcDom = { name: 'BTC Dom.', score: 0, detail: 'N/A' };
  }

  // 15. ETH/BTC Ratio (falling = risk-off, BTC strength)
  if (state.ethBtcRatio && isFinite(state.ethBtcRatio.change)) {
    const ethScore = Math.max(-100, Math.min(100, -state.ethBtcRatio.change * 5));
    factors.ethBtc = { name: 'ETH/BTC', score: ethScore, detail: `${state.ethBtcRatio.change>=0?'+':''}${state.ethBtcRatio.change.toFixed(2)}%` };
  } else {
    factors.ethBtc = { name: 'ETH/BTC', score: 0, detail: 'N/A' };
  }

  // 16. Halving Cycle (0-25% post-halving = accumulation/bullish, 50-75% = euphoria, 75-100% = exhaustion)
  if (state.halvingCycle) {
    const p = state.halvingCycle.progress;
    let hScore;
    if (p < 0.25) hScore = 60;       // accumulation phase
    else if (p < 0.5) hScore = 40;   // early bull
    else if (p < 0.75) hScore = 10;  // late bull
    else hScore = -30;               // pre-halving cooldown
    factors.halving = { name: 'Halving', score: hScore, detail: `${(p*100).toFixed(0)}%` };
  } else {
    factors.halving = { name: 'Halving', score: 0, detail: 'N/A' };
  }

  // Fear & Greed — contrarian, but strongly non-linear.
  // Historically: F&G < 20 (extreme fear) → strong bull setup. F&G > 80 (extreme greed) → strong bear.
  // Mid-range is noise — previous linear formula overweighted normal readings.
  if (state.fearGreed) {
    const v = state.fearGreed.value;
    let fgScore;
    if (v < 20)      fgScore = 80;               // extreme fear → strong bullish
    else if (v < 35) fgScore = (35 - v) / 15 * 40; // 30→13, 20→40
    else if (v > 80) fgScore = -80;              // extreme greed → strong bearish
    else if (v > 65) fgScore = (65 - v) / 15 * 40; // 70→-13, 80→-40
    else             fgScore = 0;                // mid-range: noise
    factors.fearGreed = { name: 'Fear&Greed', score: fgScore, detail: `${v} ${state.fearGreed.label}` };
  } else {
    factors.fearGreed = { name: 'Fear&Greed', score: 0, detail: 'N/A' };
  }

  // Funding Rate — contrarian, non-linear by threshold.
  // Previous coef 50000 was too weak: normal funding (0.01%) gave score=-5, barely detectable.
  // Now step-based: anything beyond ±0.05% is significant extreme.
  if (state.fundingRate !== null) {
    const fr = state.fundingRate;         // e.g. 0.0001 = 0.01%
    const bps = fr * 10000;               // to basis points: 0.01% → 1bp
    let frScore;
    if (bps > 5)       frScore = -80;     // extreme longs paying (>0.05% per 8h) → bearish
    else if (bps > 2)  frScore = -(bps - 2) / 3 * 60;  // 2bp → 0, 5bp → -60
    else if (bps < -3) frScore = 80;      // shorts paying (extreme negative) → bullish
    else if (bps < -1) frScore = (-1 - bps) / 2 * 60;  // -1bp → 0, -3bp → +60
    else               frScore = -bps * 10;  // mild: linear around zero
    frScore = Math.max(-100, Math.min(100, frScore));
    factors.funding = { name: 'Funding', score: frScore, detail: `${(fr*100).toFixed(4)}%` };
  } else {
    factors.funding = { name: 'Funding', score: 0, detail: 'N/A' };
  }

  // 17. Rainbow Z-Score (from historical pattern analysis — strongest macro signal)
  if (state.patternData && state.patternData.growth && state.patternData.growth.rainbow) {
    const z = state.patternData.growth.rainbow.zScore;
    // z < -1.5 = very cheap (bullish), z > 1.5 = very expensive (bearish)
    // Scale: z=-2 → +100, z=0 → 0, z=+2 → -100
    const rbScore = Math.max(-100, Math.min(100, -z * 50));
    factors.rainbow = { name: 'Rainbow', score: rbScore, detail: `z=${z.toFixed(2)}` };
  } else {
    factors.rainbow = { name: 'Rainbow', score: 0, detail: 'N/A' };
  }

  // 18. Seasonality (current month historical performance)
  if (state.patternData && state.patternData.growth && state.patternData.growth.months) {
    const curMonth = new Date().getMonth();
    const mData = state.patternData.growth.months[curMonth];
    if (mData) {
      // Above 55% up = bullish, below 45% = bearish
      const seaScore = Math.max(-100, Math.min(100, (mData.upPct - 50) * 4));
      factors.seasonality = { name: 'Season', score: seaScore, detail: `${mData.name} ${mData.upPct.toFixed(0)}%` };
    } else {
      factors.seasonality = { name: 'Season', score: 0, detail: 'N/A' };
    }
  } else {
    factors.seasonality = { name: 'Season', score: 0, detail: 'N/A' };
  }

  // 19. Pain/Drawdown contrarian (deep drawdown from ATH = historically bullish).
  // dd = currentDD is always >= 0, so score bottom-clamp of -20 was unreachable dead code.
  // -50% DD → strong buy (+80), -20% → mild (+32), 0% (at ATH) → neutral (0).
  if (state.patternData && state.patternData.growth && state.patternData.growth.pain) {
    const dd = state.patternData.growth.pain.currentDD;
    const painScore = Math.max(0, Math.min(100, dd * 1.6));
    factors.painDD = { name: 'Drawdown', score: painScore, detail: `-${dd.toFixed(0)}% ATH` };
  } else {
    factors.painDD = { name: 'Drawdown', score: 0, detail: 'N/A' };
  }

  // 20. Run reversion — after N consecutive days, probability of next green day
  // Data-backed: >=4 red in a row → 62.3% next green (base 52.3%). >=8 green in row → 23% next green.
  if (state.patternData && state.patternData.growth && state.patternData.growth.runs) {
    const r = state.patternData.growth.runs;
    if (r.nextGreenPct !== null) {
      // deviation from 52.3% baseline → score -100..+100
      const delta = r.nextGreenPct - r.baseline;
      const score = Math.max(-100, Math.min(100, delta * 6));
      const sign = r.currentRun > 0 ? '+' : '';
      factors.runReversion = { name: 'Run', score, detail: `${sign}${r.currentRun}d → ${r.nextGreenPct.toFixed(0)}%` };
    } else {
      factors.runReversion = { name: 'Run', score: 0, detail: 'small sample' };
    }
  } else {
    factors.runReversion = { name: 'Run', score: 0, detail: 'N/A' };
  }

  // 21. Drawdown duration — current days below ATH vs median of past drawdowns
  // Data-backed: past bears 1184/1080/847d. If curDays >> median → recovery closer.
  if (state.patternData && state.patternData.growth && state.patternData.growth.ddDuration) {
    const d = state.patternData.growth.ddDuration;
    if (d.inDrawdown && d.medianDays > 0) {
      // ratio=1 → right at median (neutral). ratio=2 → very overdue (+80 bull).
      // ratio=0.1 → just started (-30 bear, still early).
      const ratio = d.ratio;
      let score = 0;
      if (ratio >= 1)      score = Math.min(100, 40 + (ratio - 1) * 60);
      else if (ratio >= 0.5) score = (ratio - 0.5) * 80; // 0.5→0, 1→40
      else                 score = -30 + ratio * 60; // 0→-30, 0.5→0
      factors.ddDuration = { name: 'DD days', score, detail: `${d.curDays}d / ${d.medianDays}d med` };
    } else {
      factors.ddDuration = { name: 'DD days', score: 0, detail: 'at ATH' };
    }
  } else {
    factors.ddDuration = { name: 'DD days', score: 0, detail: 'N/A' };
  }

  // Meta
  factors._meta = { price, rsi, pats, gC, rC, N };
  return factors;
}

// Realized annualised volatility over the last `window` candles (log returns).
// Returns null if we don't have enough data or the candle interval is unknown.
function realizedVol(candles, window) {
  window = window || 20;
  const n = candles.length;
  if (n < window + 1) return null;
  const slice = candles.slice(n - window - 1);
  const rets = [];
  for (let i = 1; i < slice.length; i++) {
    const a = slice[i - 1].close, b = slice[i].close;
    if (a > 0 && b > 0) rets.push(Math.log(b / a));
  }
  if (rets.length < 2) return null;
  const m = rets.reduce((a, b) => a + b, 0) / rets.length;
  const v = rets.reduce((s, x) => s + (x - m) * (x - m), 0) / rets.length;
  // Infer periods-per-year from candle spacing (daily ≈ 365, 4h ≈ 2190, 1h ≈ 8760).
  const dt = slice[slice.length - 1].timestamp - slice[0].timestamp;
  const periodMs = dt / (slice.length - 1);
  const periodsPerYear = periodMs > 0 ? (365 * 86400000) / periodMs : 365;
  return Math.sqrt(v) * Math.sqrt(periodsPerYear);
}

function scoreHorizon(factors, weights, candles) {
  // Normalise by active weights: if a factor is missing (e.g. patternData not yet loaded,
  // or an external API returned null), its weight is excluded rather than contributing 0.
  // Previously a factor with weight=0.09 and score=0 silently dragged the total down by
  // up to 25% on the LONG horizon when pattern data wasn't loaded yet.
  let raw = 0, activeW = 0;
  for (const [key, w] of Object.entries(weights)) {
    const f = factors[key];
    if (!f || !isFinite(f.score)) continue;
    // Treat factors explicitly flagged as N/A as missing too.
    if (f.detail === 'N/A') continue;
    raw += f.score * w;
    activeW += w;
  }
  const norm = activeW > 0 ? raw / activeW : 0;
  let score = Math.max(-100, Math.min(100, isFinite(norm) ? norm : 0));

  // Volatility scaling: amplify signals in quiet regimes, dampen in turbulent ones.
  // Harvey et al. 2018 / Moskowitz 2012 — ~30% Sharpe improvement for vol-targeted strategies.
  // BTC median 20-period realised vol ≈ 0.58 (annualised). Multiplier clamped to [0.5, 2.0]
  // so an extreme-vol day can't silence the engine, and a calm day can't over-amplify.
  if (candles && candles.length >= 21) {
    const sigma = realizedVol(candles, 20);
    if (sigma && sigma > 0) {
      const mult = Math.max(0.5, Math.min(2.0, 0.58 / sigma));
      score = Math.max(-100, Math.min(100, score * mult));
    }
  }

  const direction = score >= 0 ? 'UP' : 'DOWN';
  const probability = Math.round(50 + (Math.abs(score) / 100) * 35);
  return { score, direction, probability };
}

function computePrediction(candles, dailyCandles) {
  const factors = computeFactors(candles);

  // If we have daily candles, blend daily RSI/MACD/Bollinger for LONG horizon
  let dailyFactors = null;
  if (dailyCandles && dailyCandles.length >= 30) {
    dailyFactors = computeFactors(dailyCandles);
  }

  // Compute 3 horizons — pass candles so scoreHorizon can apply volatility scaling.
  const short = scoreHorizon(factors, HORIZON_WEIGHTS.SHORT, candles);
  const medium = scoreHorizon(factors, HORIZON_WEIGHTS.MEDIUM, candles);

  // For LONG: blend current + daily factors if available
  let longFactors = factors;
  if (dailyFactors) {
    longFactors = { ...factors };
    // Override trend indicators with daily timeframe data
    for (const k of ['rsi', 'macd', 'bollinger', 'momentum', 'bodyMass']) {
      if (dailyFactors[k]) longFactors[k] = dailyFactors[k];
    }
  }
  // LONG uses daily candles for vol scaling when available (longer-horizon vol regime).
  const long = scoreHorizon(longFactors, HORIZON_WEIGHTS.LONG, dailyCandles || candles);

  // Horizon disagreement shrink: if SHORT and LONG point opposite ways, the model
  // isn't coherent — shrink all confidences toward 50% so we don't over-sell a signal
  // the multi-timeframe view doesn't actually agree on. Coefficient 0.6 matches the
  // multi-horizon calibration bump documented for technical-analysis ensembles.
  if (short.direction !== long.direction) {
    for (const h of [short, medium, long]) {
      h.probability = Math.round(50 + (h.probability - 50) * 0.6);
      h.score = h.score * 0.6;
      h.horizonConflict = true;
    }
  }

  // ATR
  const price = factors._meta.price;
  const atr = calcATR(candles);
  const atrPct = price===0?0:(atr/price)*100;

  // Stats
  const { gC, rC, N, rsi, pats } = factors._meta;
  let largestBody = 0, lbTime = '', totalVol = 0;
  for (const c of candles) {
    const b = Math.abs(c.close-c.open);
    if (b > largestBody) { largestBody = b; lbTime = new Date(c.timestamp).toISOString().slice(11,16); }
    totalVol += c.volume;
  }

  // Build factor list for display (using SHORT weights for the detail view)
  const displayFactors = [];
  for (const [key, w] of Object.entries(HORIZON_WEIGHTS.SHORT)) {
    if (factors[key]) displayFactors.push({ ...factors[key], w });
  }

  return {
    short, medium, long,
    factors: displayFactors,
    allFactors: factors,
    atrPct, rsi, patterns: pats,
    stats: { greenCount: gC, redCount: rC, largestBody, largestTime: lbTime, avgVolume: totalVol/N },
  };
}

// ============================================================
// PATTERN ANALYSIS — Historical data
// ============================================================
async function fetchAllHistory(onProgress) {
  onProgress && onProgress(10, 'Loading history.json...');
  // Load daily candles from local pre-downloaded file
  const resp = await fetch('history.json');
  if (!resp.ok) throw new Error('history.json not found — run data download script first');
  const candles = await resp.json();
  if (!candles || candles.length < 100) throw new Error('history.json has too few candles (' + (candles ? candles.length : 0) + ')');
  onProgress && onProgress(100, candles.length + ' daily candles loaded');
  return candles;
}

function analyzePatterns(candles) {
  const L = LANG[state.lang];
  const N = candles.length;
  const results = [];

  // Helpers
  const bodies = candles.map(c => Math.abs(c.c - c.o));
  const avgBody = bodies.reduce((a, b) => a + b, 0) / N;
  const stdBody = Math.sqrt(bodies.reduce((s, b) => s + (b - avgBody) ** 2, 0) / N);
  const avgVol = candles.reduce((s, c) => s + c.v, 0) / N;
  const dir = c => c.c >= c.o ? 1 : -1;

  // 1. Streak reversal: after 3/5/7 same-color daily candles
  for (const streakLen of [3, 5, 7]) {
    let total = 0, reversed = 0;
    for (let i = streakLen; i < N; i++) {
      const d = dir(candles[i - 1]);
      let ok = true;
      for (let j = i - streakLen; j < i; j++) { if (dir(candles[j]) !== d) { ok = false; break; } }
      if (ok) { total++; if (dir(candles[i]) !== d) reversed++; }
    }
    if (total > 20) {
      const pct = reversed / total * 100;
      results.push({
        name: state.lang === 'ru' ? `${streakLen} дней подряд один цвет` : `${streakLen} days in a row same color`,
        question: state.lang === 'ru' ? 'Следующий день будет противоположным?' : 'Will the next day be opposite?',
        yes: reversed, total, pct,
        verdict: pct > 55 ? (state.lang === 'ru' ? 'Да — тренд склонен разворачиваться' : 'Yes — trend tends to reverse')
               : pct < 45 ? (state.lang === 'ru' ? 'Нет — тренд продолжается' : 'No — trend tends to continue')
               : (state.lang === 'ru' ? 'Монетка — нет чёткого паттерна' : 'Coin flip — no clear pattern'),
      });
    }
  }

  // 2. Big candle (body > 2σ) → mean reversion within 3 days
  {
    let total = 0, reverted = 0;
    for (let i = 0; i < N - 3; i++) {
      if (bodies[i] > avgBody + 2 * stdBody) {
        total++;
        const d = dir(candles[i]);
        for (let j = 1; j <= 3; j++) { if (dir(candles[i + j]) !== d) { reverted++; break; } }
      }
    }
    if (total > 20) {
      results.push({
        name: state.lang === 'ru' ? 'Огромная свеча (аномально большая)' : 'Huge candle (abnormally large)',
        question: state.lang === 'ru' ? 'Цена откатится в течение 3 дней?' : 'Will price bounce back within 3 days?',
        yes: reverted, total, pct: reverted / total * 100,
        verdict: reverted / total > 0.55
          ? (state.lang === 'ru' ? 'Да — большие движения обычно частично откатываются' : 'Yes — big moves tend to partially reverse')
          : (state.lang === 'ru' ? 'Ненадёжно' : 'Not reliably'),
      });
    }
  }

  // 3. Volume spike + red → bounce?
  {
    let total = 0, bounced = 0;
    for (let i = 0; i < N - 1; i++) {
      if (candles[i].v > avgVol * 2 && candles[i].c < candles[i].o) {
        total++;
        if (candles[i + 1].c > candles[i + 1].o) bounced++;
      }
    }
    if (total > 20) {
      results.push({
        name: state.lang === 'ru' ? 'Распродажа на объёме (паника)' : 'High-volume sell-off (panic)',
        question: state.lang === 'ru' ? 'Следующий день будет зелёным?' : 'Will the next day be green (recovery)?',
        yes: bounced, total, pct: bounced / total * 100,
        verdict: bounced / total > 0.53
          ? (state.lang === 'ru' ? 'Да — паника часто ведёт к отскоку' : 'Yes — panic selling often leads to a bounce')
          : (state.lang === 'ru' ? 'Ненадёжно' : 'Not reliably'),
      });
    }
  }

  // 4. Doji → reversal?
  {
    let total = 0, reversed = 0;
    for (let i = 1; i < N - 1; i++) {
      const range = candles[i].h - candles[i].l;
      const body = Math.abs(candles[i].c - candles[i].o);
      if (range > 0 && body / range < 0.1) {
        total++;
        if (dir(candles[i + 1]) !== dir(candles[i - 1])) reversed++;
      }
    }
    if (total > 20) {
      results.push({
        name: state.lang === 'ru' ? 'Свеча неопределённости (Doji)' : 'Indecision candle (Doji)',
        question: state.lang === 'ru' ? 'Направление меняется после Doji?' : 'Does direction reverse after indecision?',
        yes: reversed, total, pct: reversed / total * 100,
        verdict: reversed / total > 0.53
          ? (state.lang === 'ru' ? 'Небольшая склонность к развороту' : 'Slight tendency to reverse')
          : (state.lang === 'ru' ? 'Нет чёткого паттерна' : 'No clear pattern'),
      });
    }
  }

  // 5. Hammer → bullish?
  {
    let total = 0, bullish = 0;
    for (let i = 0; i < N - 1; i++) {
      const body = Math.abs(candles[i].c - candles[i].o);
      const lw = Math.min(candles[i].o, candles[i].c) - candles[i].l;
      const uw = candles[i].h - Math.max(candles[i].o, candles[i].c);
      if (body > 0 && lw > body * 2 && uw < body * 0.5) {
        total++;
        if (candles[i + 1].c > candles[i + 1].o) bullish++;
      }
    }
    if (total > 20) {
      results.push({
        name: state.lang === 'ru' ? 'Молот (длинная тень вниз)' : 'Hammer (long lower shadow)',
        question: state.lang === 'ru' ? 'Следующий день зелёный?' : 'Is the next day green (bullish)?',
        yes: bullish, total, pct: bullish / total * 100,
        verdict: bullish / total > 0.53
          ? (state.lang === 'ru' ? 'Да — покупатели вошли на дне' : 'Yes — buyers stepped in at the bottom')
          : (state.lang === 'ru' ? 'Ненадёжно' : 'Not reliably'),
      });
    }
  }

  // 6. Shooting Star → bearish?
  {
    let total = 0, bearish = 0;
    for (let i = 0; i < N - 1; i++) {
      const body = Math.abs(candles[i].c - candles[i].o);
      const uw = candles[i].h - Math.max(candles[i].o, candles[i].c);
      const lw = Math.min(candles[i].o, candles[i].c) - candles[i].l;
      if (body > 0 && uw > body * 2 && lw < body * 0.5) {
        total++;
        if (candles[i + 1].c < candles[i + 1].o) bearish++;
      }
    }
    if (total > 20) {
      results.push({
        name: state.lang === 'ru' ? 'Падающая звезда (длинная тень вверх)' : 'Shooting star (long upper shadow)',
        question: state.lang === 'ru' ? 'Следующий день красный?' : 'Is the next day red (bearish)?',
        yes: bearish, total, pct: bearish / total * 100,
        verdict: bearish / total > 0.53
          ? (state.lang === 'ru' ? 'Да — продавцы отвергли вершину' : 'Yes — sellers rejected the top')
          : (state.lang === 'ru' ? 'Ненадёжно' : 'Not reliably'),
      });
    }
  }

  // 7. Bull Engulfing → continuation?
  {
    let total = 0, contUp = 0;
    for (let i = 1; i < N - 1; i++) {
      const prev = candles[i - 1], curr = candles[i];
      if (prev.c < prev.o && curr.c > curr.o && Math.abs(curr.c - curr.o) > Math.abs(prev.c - prev.o) * 1.5) {
        total++;
        if (candles[i + 1].c > candles[i + 1].o) contUp++;
      }
    }
    if (total > 20) {
      results.push({
        name: state.lang === 'ru' ? 'Бычье поглощение (зелёная > красной)' : 'Bull Engulfing (green swallows red)',
        question: state.lang === 'ru' ? 'Рост продолжится?' : 'Does the upward move continue?',
        yes: contUp, total, pct: contUp / total * 100,
        verdict: contUp / total > 0.53
          ? (state.lang === 'ru' ? 'Да — сильный сигнал покупки подтверждён историей' : 'Yes — strong buy signal confirmed by history')
          : (state.lang === 'ru' ? 'Ненадёжно' : 'Not reliably'),
      });
    }
  }

  // =============================================
  // GROWTH & PULLBACK ANALYSIS
  // User's hypothesis: "BTC always grows long-term but after growth peaks there's always a pullback"
  // =============================================
  const growth = {};

  // A) Long-term growth: compare price at yearly intervals
  {
    const yearlyReturns = [];
    for (let i = 0; i < N - 365; i += 30) {
      const ret = ((candles[i + 365].c - candles[i].c) / candles[i].c) * 100;
      yearlyReturns.push(ret);
    }
    if (yearlyReturns.length > 5) {
      const positive = yearlyReturns.filter(r => r > 0).length;
      growth.yearlyUp = positive;
      growth.yearlyTotal = yearlyReturns.length;
      growth.yearlyPct = positive / yearlyReturns.length * 100;
      growth.avgReturn = yearlyReturns.reduce((a, b) => a + b, 0) / yearlyReturns.length;
    }
  }

  // B) After strong weekly growth → pullback within next week?
  growth.pullbacks = [];
  for (const threshold of [10, 15, 20]) {
    let total = 0, pulled = 0;
    for (let i = 7; i < N - 7; i += 1) {
      const weekReturn = ((candles[i].c - candles[i - 7].c) / candles[i - 7].c) * 100;
      if (weekReturn >= threshold) {
        total++;
        // Check if next week has any day closing lower than current close
        const nextWeekMin = Math.min(...candles.slice(i + 1, i + 8).map(c => c.l));
        if (nextWeekMin < candles[i].c * 0.98) pulled++; // >2% pullback
      }
    }
    if (total > 5) {
      growth.pullbacks.push({ threshold, total, pulled, pct: pulled / total * 100 });
    }
  }

  // C) Drawdown from ATH analysis
  {
    let ath = 0;
    const drawdowns = [];
    for (const c of candles) {
      if (c.h > ath) ath = c.h;
      const dd = ((ath - c.l) / ath) * 100;
      drawdowns.push(dd);
    }
    const maxDD = Math.max(...drawdowns);
    const avgDD = drawdowns.reduce((a, b) => a + b, 0) / drawdowns.length;
    const bigDDs = drawdowns.filter(d => d > 20).length;
    growth.maxDrawdown = maxDD;
    growth.avgDrawdown = avgDD;
    growth.daysBelow20pct = bigDDs;
    growth.totalDays = N;
  }

  // D) First price vs last price (skip early $0 candles)
  const firstReal = candles.find(c => c.c > 1) || candles[0];
  growth.firstPrice = firstReal.c;
  growth.firstDate = new Date(firstReal.t).toISOString().slice(0, 10);
  growth.lastPrice = candles[N - 1].c;
  growth.totalReturn = ((candles[N - 1].c - firstReal.c) / firstReal.c) * 100;

  // =============================================
  // E) Monthly seasonality — which months are best?
  // =============================================
  const months = {};
  for (let i = 0; i < N - 30; i++) {
    const m = new Date(candles[i].t).getMonth(); // 0-11
    const ret = ((candles[Math.min(i + 30, N - 1)].c - candles[i].c) / candles[i].c) * 100;
    if (!months[m]) months[m] = { up: 0, total: 0, returns: [] };
    months[m].total++;
    months[m].returns.push(ret);
    if (ret > 0) months[m].up++;
  }
  growth.months = [];
  const mNames = state.lang === 'ru'
    ? ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for (let m = 0; m < 12; m++) {
    if (months[m] && months[m].total > 20) {
      const d = months[m];
      const avgRet = d.returns.reduce((a, b) => a + b, 0) / d.returns.length;
      growth.months.push({ name: mNames[m], upPct: d.up / d.total * 100, avgRet, total: d.total });
    }
  }

  // =============================================
  // F) Recovery after big drops: after -30% from ATH, how long to recover?
  // =============================================
  {
    let ath = 0;
    const recoveries = [];
    let inDrop = false, dropStart = -1;
    for (let i = 0; i < N; i++) {
      if (candles[i].h > ath) ath = candles[i].h;
      const dd = ((ath - candles[i].c) / ath) * 100;
      if (!inDrop && dd >= 30) {
        inDrop = true;
        dropStart = i;
      } else if (inDrop && candles[i].c >= ath * 0.95) {
        // recovered to within 5% of ATH
        recoveries.push(i - dropStart);
        inDrop = false;
      }
    }
    if (recoveries.length > 0) {
      growth.recoveries = {
        count: recoveries.length,
        avgDays: Math.round(recoveries.reduce((a, b) => a + b, 0) / recoveries.length),
        minDays: Math.min(...recoveries),
        maxDays: Math.max(...recoveries),
        stillDown: inDrop,
      };
    }
  }

  // =============================================
  // G) HODL TABLE — profit probability by holding period
  // =============================================
  {
    const periods = [
      { days: 1, label: state.lang === 'ru' ? '1 день' : '1 day' },
      { days: 7, label: state.lang === 'ru' ? '1 неделя' : '1 week' },
      { days: 30, label: state.lang === 'ru' ? '1 месяц' : '1 month' },
      { days: 90, label: state.lang === 'ru' ? '3 месяца' : '3 months' },
      { days: 180, label: state.lang === 'ru' ? '6 месяцев' : '6 months' },
      { days: 365, label: state.lang === 'ru' ? '1 год' : '1 year' },
      { days: 730, label: state.lang === 'ru' ? '2 года' : '2 years' },
      { days: 1095, label: state.lang === 'ru' ? '3 года' : '3 years' },
      { days: 1460, label: state.lang === 'ru' ? '4 года' : '4 years' },
    ];
    growth.hodl = [];
    // Skip early candles with price < $1 to avoid distortion
    const startIdx = candles.findIndex(c => c.c > 1);
    for (const p of periods) {
      const returns = [];
      for (let i = Math.max(0, startIdx); i < N - p.days; i++) {
        if (candles[i].c <= 0) continue;
        returns.push(((candles[i + p.days].c - candles[i].c) / candles[i].c) * 100);
      }
      if (returns.length < 10) continue;
      returns.sort((a, b) => a - b);
      const profitable = returns.filter(r => r > 0).length;
      const median = returns[Math.floor(returns.length / 2)];
      const p5 = returns[Math.floor(returns.length * 0.05)];
      const p95 = returns[Math.floor(returns.length * 0.95)];
      growth.hodl.push({
        label: p.label, days: p.days, n: returns.length,
        profitPct: profitable / returns.length * 100,
        median, p5, p95,
      });
    }
  }

  // =============================================
  // H) HALVING CYCLE — position and historical returns by phase
  // =============================================
  {
    const halvings = [
      new Date('2012-11-28').getTime(),
      new Date('2016-07-09').getTime(),
      new Date('2020-05-11').getTime(),
      new Date('2024-04-20').getTime(),
    ];
    const cycleLen = 1461 * 86400000; // ~4 years in ms
    const nextHalving = halvings[halvings.length - 1] + cycleLen;
    const lastT = candles[N - 1].t;
    const daysSinceLast = (lastT - halvings[halvings.length - 1]) / 86400000;
    const currentPct = Math.min(100, daysSinceLast / 1461 * 100);

    // Bucket returns by cycle position (10 buckets)
    const buckets = Array.from({ length: 10 }, () => ({ returns: [], n: 0 }));
    for (let i = 0; i < N - 30; i++) {
      const t = candles[i].t;
      // Find which cycle
      let cycleStart = null;
      for (let h = halvings.length - 1; h >= 0; h--) {
        if (t >= halvings[h]) { cycleStart = halvings[h]; break; }
      }
      if (!cycleStart) continue;
      const pos = (t - cycleStart) / cycleLen;
      if (pos >= 1) continue;
      const bucket = Math.min(9, Math.floor(pos * 10));
      if (candles[i].c <= 0) continue;
      const ret = ((candles[i + 30].c - candles[i].c) / candles[i].c) * 100;
      buckets[bucket].returns.push(ret);
      buckets[bucket].n++;
    }

    growth.halving = {
      currentPct: Math.round(currentPct),
      daysSinceLast: Math.round(daysSinceLast),
      nextHalvingEst: new Date(nextHalving).toISOString().slice(0, 7),
      buckets: buckets.map((b, i) => ({
        from: i * 10, to: (i + 1) * 10,
        avgRet: b.returns.length > 0 ? b.returns.reduce((a, v) => a + v, 0) / b.returns.length : 0,
        n: b.n,
      })),
    };
  }

  // =============================================
  // I) RAINBOW PRICE — log regression + z-score zones
  // =============================================
  {
    // Skip zero/tiny prices for regression
    const valid = candles.filter(c => c.c > 1);
    const n = valid.length;
    if (n > 100) {
      const xs = valid.map((_, i) => i);
      const ys = valid.map(c => Math.log(c.c));
      const xMean = xs.reduce((a, b) => a + b, 0) / n;
      const yMean = ys.reduce((a, b) => a + b, 0) / n;
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) {
        num += (xs[i] - xMean) * (ys[i] - yMean);
        den += (xs[i] - xMean) ** 2;
      }
      const slope = num / den;
      const intercept = yMean - slope * xMean;
      const residuals = ys.map((y, i) => y - (slope * xs[i] + intercept));
      const stdRes = Math.sqrt(residuals.reduce((s, r) => s + r * r, 0) / n);

      const lastIdx = n - 1;
      const expected = Math.exp(slope * lastIdx + intercept);
      const zScore = residuals[lastIdx] / stdRes;

      // Backtest zones
      const zones = [
        { name: state.lang === 'ru' ? 'ОЧЕНЬ ДЁШЕВО' : 'VERY CHEAP', min: -Infinity, max: -1.5 },
        { name: state.lang === 'ru' ? 'Ниже тренда' : 'Below trend', min: -1.5, max: -0.5 },
        { name: state.lang === 'ru' ? 'Справедливая цена' : 'Fair value', min: -0.5, max: 0.5 },
        { name: state.lang === 'ru' ? 'Выше тренда' : 'Above trend', min: 0.5, max: 1.5 },
        { name: state.lang === 'ru' ? 'ОЧЕНЬ ДОРОГО' : 'VERY EXPENSIVE', min: 1.5, max: Infinity },
      ];
      for (const z of zones) {
        z.total = 0; z.profitable = 0; z.returns = [];
      }
      for (let i = 0; i < n - 90; i++) {
        const zs = residuals[i] / stdRes;
        const ret = ((valid[i + 90].c - valid[i].c) / valid[i].c) * 100;
        for (const z of zones) {
          if (zs > z.min && zs <= z.max) {
            z.total++;
            z.returns.push(ret);
            if (ret > 0) z.profitable++;
            break;
          }
        }
      }
      for (const z of zones) {
        z.profitPct = z.total > 0 ? z.profitable / z.total * 100 : 0;
        z.avgRet = z.returns.length > 0 ? z.returns.reduce((a, b) => a + b, 0) / z.returns.length : 0;
      }

      growth.rainbow = { expected, zScore, zones, currentPrice: candles[N - 1].c };
    }
  }

  // =============================================
  // J) PAIN DURATION — time spent below ATH at various levels
  // =============================================
  {
    let ath = 0;
    const thresholds = [5, 10, 20, 30, 40, 50, 60, 70, 80];
    const counts = {};
    thresholds.forEach(t => counts[t] = 0);
    let daysAtAth = 0;

    for (const c of candles) {
      if (c.h >= ath) {
        if (c.h > ath) ath = c.h;
        daysAtAth++;
      }
      const dd = ((ath - c.c) / ath) * 100;
      for (const t of thresholds) {
        if (dd >= t) counts[t]++;
      }
    }

    const currentDD = ((ath - candles[N - 1].c) / ath) * 100;
    // What % of time BTC was at same or worse drawdown
    let worseOrEqual = 0;
    let tempAth = 0;
    for (const c of candles) {
      if (c.h > tempAth) tempAth = c.h;
      if (((tempAth - c.c) / tempAth) * 100 >= currentDD) worseOrEqual++;
    }

    growth.pain = {
      thresholds: thresholds.map(t => ({ level: t, days: counts[t], pct: counts[t] / N * 100 })),
      currentDD, ath, daysAtAth, pctAtAth: daysAtAth / N * 100,
      normalPct: worseOrEqual / N * 100,
    };
  }

  // =============================================
  // J2) RUN REVERSION — after N consecutive up/down days, what's next?
  // =============================================
  {
    const bucket = {}; // key: signed run length, value: { total, nextGreen, nextSumRet }
    let run = 0;
    for (let i = 0; i < N - 1; i++) {
      const c = candles[i];
      const up = c.c > c.o, dn = c.c < c.o;
      if (up)      run = run > 0 ? run + 1 : 1;
      else if (dn) run = run < 0 ? run - 1 : -1;
      else         run = 0;
      const nx = candles[i + 1];
      const nxUp = nx.c > nx.o;
      const nxRet = (nx.c - c.c) / c.c;
      if (!bucket[run]) bucket[run] = { total: 0, nextGreen: 0, nextSumRet: 0 };
      bucket[run].total++;
      if (nxUp) bucket[run].nextGreen++;
      bucket[run].nextSumRet += nxRet;
    }
    // current run of the latest candle
    let curRun = 0;
    for (let i = 0; i < N; i++) {
      const c = candles[i];
      const up = c.c > c.o, dn = c.c < c.o;
      if (up)      curRun = curRun > 0 ? curRun + 1 : 1;
      else if (dn) curRun = curRun < 0 ? curRun - 1 : -1;
      else         curRun = 0;
    }
    const b = bucket[curRun];
    let nextGreenPct = null, nextAvgRetPct = null, sample = 0;
    if (b && b.total >= 10) {
      nextGreenPct = b.nextGreen / b.total * 100;
      nextAvgRetPct = b.nextSumRet / b.total * 100;
      sample = b.total;
    }
    growth.runs = {
      currentRun: curRun,   // +N = green run, -N = red run
      nextGreenPct,         // null if sample too small
      nextAvgRetPct,
      sample,
      baseline: 52.31,      // historical % of green days
    };
  }

  // =============================================
  // J3) DRAWDOWN DURATION — current days below ATH vs history
  // =============================================
  {
    let ath = 0, peakIdx = 0;
    let inDD = false, ddStart = null;
    const recoveries = []; // days below ATH for completed drawdowns
    for (let i = 0; i < N; i++) {
      const c = candles[i];
      if (c.c >= ath) {
        if (inDD) {
          recoveries.push(i - ddStart);
          inDD = false;
        }
        ath = c.c;
        peakIdx = i;
      } else {
        if (!inDD) { inDD = true; ddStart = peakIdx; }
      }
    }
    // current drawdown days
    const curDays = inDD ? (N - 1 - peakIdx) : 0;
    // median of past recoveries (only significant ones — >30 days — to ignore noise)
    const significant = recoveries.filter(d => d >= 30).sort((a, b) => a - b);
    const medianDays = significant.length
      ? significant[Math.floor(significant.length / 2)]
      : 0;
    growth.ddDuration = {
      curDays,
      medianDays,
      ratio: medianDays > 0 ? curDays / medianDays : 0, // >1 means longer than typical
      inDrawdown: inDD,
    };
  }

  // =============================================
  // K) ROUND NUMBERS — approach/break/reject analysis
  // =============================================
  {
    const levels = [1000, 5000, 10000, 20000, 30000, 40000, 50000, 60000, 70000, 100000];
    const lastPrice = candles[N - 1].c;
    growth.roundNumbers = [];
    for (const level of levels) {
      if (lastPrice < level * 0.3) continue; // too far above current price
      if (candles.filter(c => c.h > level * 0.8).length < 5) continue; // not enough data near this level
      let approaches = 0, breakthroughs = 0;
      let i = 0;
      while (i < N - 7) {
        // Price within 5% below the round number
        if (candles[i].c >= level * 0.95 && candles[i].c < level) {
          approaches++;
          // Check if breaks above within 7 days
          let broke = false;
          for (let j = 1; j <= 7 && i + j < N; j++) {
            if (candles[i + j].c > level * 1.02) { broke = true; break; }
          }
          if (broke) breakthroughs++;
          i += 8; // skip ahead to avoid double-counting
        } else {
          i++;
        }
      }
      if (approaches >= 3) {
        growth.roundNumbers.push({
          level, approaches, breakthroughs,
          breakPct: breakthroughs / approaches * 100,
          rejectPct: (1 - breakthroughs / approaches) * 100,
        });
      }
    }
  }

  // =============================================
  // L) MOMENTUM TRAP — acceleration predicts pullback
  // =============================================
  {
    let accelEvents = 0, pullbacks = 0;
    const window = 30;
    for (let i = window * 2; i < N - window; i++) {
      if (candles[i].c <= 0 || candles[i - window].c <= 0 || candles[i - window * 2].c <= 0) continue;
      const recentRet = ((candles[i].c - candles[i - window].c) / candles[i - window].c) * 100;
      const priorRet = ((candles[i - window].c - candles[i - window * 2].c) / candles[i - window * 2].c) * 100;
      if (recentRet > 0 && priorRet > 0 && recentRet > priorRet * 3 && recentRet > 10) {
        accelEvents++;
        // Check if >10% drop within next 30 days
        const peakAfter = Math.max(...candles.slice(i, i + window + 1).map(c => c.h));
        const lowAfter = Math.min(...candles.slice(i, i + window + 1).map(c => c.l));
        if ((peakAfter - lowAfter) / peakAfter * 100 > 10) pullbacks++;
      }
    }

    // Current status
    let currentAccel = null;
    if (N >= window * 2) {
      const recent = ((candles[N - 1].c - candles[N - 1 - window].c) / candles[N - 1 - window].c) * 100;
      const prior = ((candles[N - 1 - window].c - candles[N - 1 - window * 2].c) / candles[N - 1 - window * 2].c) * 100;
      if (prior > 0) currentAccel = { recent, prior, ratio: recent / prior };
    }

    growth.momentum = {
      accelEvents, pullbacks,
      pullbackPct: accelEvents > 0 ? pullbacks / accelEvents * 100 : 0,
      current: currentAccel,
    };
  }

  return {
    results, growth, totalCandles: N,
    fromDate: new Date(candles[0].t).toISOString().slice(0, 10),
    toDate: new Date(candles[N - 1].t).toISOString().slice(0, 10),
  };
}

async function loadPatterns() {
  if (state.patternData) { state.showPatterns = !state.showPatterns; renderPatternBlock(); return; }
  if (state.patternLoading) return;
  state.patternLoading = true;
  state.showPatterns = true;

  const L = LANG[state.lang];
  const out = document.getElementById('patterns-output');
  out.innerHTML = `<span class="loading">  ${L.patternLoading}</span>\n  <span class="dim">${L.patternProgress} </span><span id="pattern-progress" class="yellow">...</span><span class="blink">_</span>`;

  try {
    const candles = await fetchAllHistory((pct, msg) => {
      const el = document.getElementById('pattern-progress');
      if (el) el.textContent = `${pct}% — ${msg}`;
    });
    state.patternRawCandles = candles;
    state.patternData = analyzePatterns(candles);
    state.patternLoading = false;
    renderPatternBlock();
  } catch (err) {
    state.patternLoading = false;
    out.innerHTML = `<span class="error">  Failed to load history: ${err.message}</span>`;
  }
}

function renderPatternBlock() {
  const out = document.getElementById('patterns-output');
  if (!state.showPatterns || !state.patternData) { out.innerHTML = ''; return; }

  const L = LANG[state.lang];
  const { results, growth, totalCandles, fromDate, toDate } = state.patternData;

  function makeBar(pct, w) {
    w = w || 20;
    const filled = Math.round((pct / 100) * w);
    const cls = pct >= 55 ? 'bar-green' : pct <= 45 ? 'bar-red' : 'yellow';
    let b = '';
    for (let i = 0; i < w; i++) b += i < filled ? `<span class="${cls}">█</span>` : '<span class="dim">░</span>';
    return { bar: b, cls };
  }

  let h = '';
  h += `\n<span class="cyan">╔══════════════════════════════════════════════════════════╗</span>\n`;
  h += `<span class="cyan">║</span> <span class="white bold"> ${L.patternLab}</span>\n`;
  h += `<span class="cyan">║</span> <span class="dim"> ${totalCandles.toLocaleString()} ${L.patternCandles} │ ${fromDate} → ${toDate}</span>\n`;
  h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;

  // Candle patterns
  for (const p of results) {
    const { bar, cls } = makeBar(p.pct);
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="white bold">${p.name}</span>\n`;
    h += `<span class="cyan">║</span>  <span class="cyan">Q:</span> ${p.question}\n`;
    h += `<span class="cyan">║</span>  [${bar}] <span class="${cls} bold">${p.pct.toFixed(1)}%</span> <span class="dim">(${p.yes}/${p.total})</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">→</span> ${p.verdict}\n`;
  }

  // Growth & Pullback section
  if (growth) {
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${L.patternGrowth}</span>\n`;
    h += `<span class="cyan">║</span>\n`;

    // Total return
    if (growth.totalReturn !== undefined) {
      const retCls = growth.totalReturn > 0 ? 'bar-green' : 'bar-red';
      const sign = growth.totalReturn > 0 ? '+' : '';
      h += `<span class="cyan">║</span>  <span class="white bold">${L.patternAlwaysGrows}</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${growth.firstDate || '?'}: $${growth.firstPrice.toFixed(0)} → $${growth.lastPrice.toFixed(0)}</span>  <span class="${retCls} bold">${sign}${growth.totalReturn.toFixed(0)}%</span>\n`;
    }

    // Yearly returns
    if (growth.yearlyTotal) {
      const { bar, cls } = makeBar(growth.yearlyPct);
      const avgSign = growth.avgReturn > 0 ? '+' : '';
      h += `<span class="cyan">║</span>  [${bar}] <span class="${cls} bold">${growth.yearlyPct.toFixed(0)}%</span> <span class="dim">${state.lang === 'ru' ? 'лет с ростом' : 'of years profitable'} (${growth.yearlyUp}/${growth.yearlyTotal})</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${state.lang === 'ru' ? 'Средний годовой рост' : 'Avg yearly return'}:</span> <span class="${growth.avgReturn > 0 ? 'bar-green' : 'bar-red'}">${avgSign}${growth.avgReturn.toFixed(0)}%</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">→</span> ${growth.yearlyPct > 60
        ? (state.lang === 'ru' ? 'Да — BTC растёт в большинстве годовых периодов' : 'Yes — BTC grows in most yearly periods')
        : (state.lang === 'ru' ? 'Не всегда — зависит от точки входа' : 'Not always — depends on entry point')}\n`;
    }

    // Drawdown stats
    if (growth.maxDrawdown) {
      h += `<span class="cyan">║</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${state.lang === 'ru' ? 'Макс. просадка от максимума' : 'Max drawdown from ATH'}:</span> <span class="bar-red">-${growth.maxDrawdown.toFixed(0)}%</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${state.lang === 'ru' ? 'Дней с просадкой >20%' : 'Days with >20% drawdown'}:</span> <span class="yellow">${growth.daysBelow20pct}</span><span class="dim">/${growth.totalDays} (${(growth.daysBelow20pct/growth.totalDays*100).toFixed(0)}%)</span>\n`;
    }

    // Pullback after growth
    if (growth.pullbacks && growth.pullbacks.length > 0) {
      h += `<span class="cyan">║</span>\n`;
      for (const pb of growth.pullbacks) {
        const q = L.patternAfterPeak.replace('{pct}', pb.threshold);
        const { bar, cls } = makeBar(pb.pct);
        h += `<span class="cyan">║</span>  <span class="white bold">${q}</span>\n`;
        h += `<span class="cyan">║</span>  [${bar}] <span class="${cls} bold">${pb.pct.toFixed(0)}%</span> <span class="dim">(${pb.pulled}/${pb.total})</span>\n`;
        h += `<span class="cyan">║</span>  <span class="dim">→</span> ${pb.pct > 60
          ? (state.lang === 'ru' ? 'Да — после сильного роста обычно следует коррекция' : 'Yes — strong growth usually leads to a pullback')
          : pb.pct > 45
            ? (state.lang === 'ru' ? 'Часто, но не всегда' : 'Often, but not always')
            : (state.lang === 'ru' ? 'Нет — рост чаще продолжается' : 'No — growth tends to continue')}\n`;
      }
    }

    // Monthly seasonality
    if (growth.months && growth.months.length > 0) {
      h += `<span class="cyan">║</span>\n`;
      h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
      h += `<span class="cyan">║</span> <span class="yellow bold"> ${state.lang === 'ru' ? 'СЕЗОННОСТЬ ПО МЕСЯЦАМ' : 'MONTHLY SEASONALITY'}</span>\n`;
      h += `<span class="cyan">║</span>\n`;
      for (const m of growth.months) {
        const { bar, cls } = makeBar(m.upPct, 12);
        const retSign = m.avgRet > 0 ? '+' : '';
        const retCls = m.avgRet > 0 ? 'bar-green' : 'bar-red';
        h += `<span class="cyan">║</span>  <span class="white bold">${m.name}</span>  [${bar}] <span class="${cls}">${m.upPct.toFixed(0)}%</span> ${state.lang === 'ru' ? 'рост' : 'up'}  <span class="${retCls}">${retSign}${m.avgRet.toFixed(1)}%</span> ${state.lang === 'ru' ? 'средн.' : 'avg'}\n`;
      }
      // Highlight best/worst
      const best = growth.months.reduce((a, b) => a.avgRet > b.avgRet ? a : b);
      const worst = growth.months.reduce((a, b) => a.avgRet < b.avgRet ? a : b);
      h += `<span class="cyan">║</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">→</span> ${state.lang === 'ru' ? 'Лучший месяц' : 'Best month'}: <span class="bar-green bold">${best.name}</span> <span class="dim">(+${best.avgRet.toFixed(1)}%)</span>  ${state.lang === 'ru' ? 'Худший' : 'Worst'}: <span class="bar-red bold">${worst.name}</span> <span class="dim">(${worst.avgRet.toFixed(1)}%)</span>\n`;
    }

    // Recovery after crashes
    if (growth.recoveries) {
      const r = growth.recoveries;
      h += `<span class="cyan">║</span>\n`;
      h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
      h += `<span class="cyan">║</span> <span class="yellow bold"> ${state.lang === 'ru' ? 'ВОССТАНОВЛЕНИЕ ПОСЛЕ ПАДЕНИЙ' : 'RECOVERY AFTER CRASHES'}</span>\n`;
      h += `<span class="cyan">║</span>\n`;
      h += `<span class="cyan">║</span>  <span class="white">${state.lang === 'ru' ? 'После падения >30% от максимума' : 'After >30% drop from ATH'}:</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${state.lang === 'ru' ? 'Случаев' : 'Occurrences'}:</span> <span class="white bold">${r.count}</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${state.lang === 'ru' ? 'Среднее восстановление' : 'Avg recovery'}:</span> <span class="yellow bold">${r.avgDays}</span> <span class="dim">${state.lang === 'ru' ? 'дней' : 'days'}</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">${state.lang === 'ru' ? 'Быстрее всего' : 'Fastest'}:</span> <span class="bar-green">${r.minDays}</span> <span class="dim">${state.lang === 'ru' ? 'дней' : 'days'}</span>  <span class="dim">${state.lang === 'ru' ? 'Дольше всего' : 'Slowest'}:</span> <span class="bar-red">${r.maxDays}</span> <span class="dim">${state.lang === 'ru' ? 'дней' : 'days'}</span>\n`;
      if (r.stillDown) {
        h += `<span class="cyan">║</span>  <span class="yellow">⚠ ${state.lang === 'ru' ? 'Сейчас в фазе восстановления' : 'Currently in recovery phase'}</span>\n`;
      }
      h += `<span class="cyan">║</span>  <span class="dim">→ ${state.lang === 'ru' ? 'BTC всегда восстанавливался после падений' : 'BTC has always recovered from every crash'}</span>\n`;
    }
  }

  // HODL Table
  if (growth.hodl && growth.hodl.length > 0) {
    const ru = state.lang === 'ru';
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${ru ? 'ТАБЛИЦА ХОДЛЕРА — А если просто держать?' : 'HODL TABLE — What If You Just Hold?'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${(ru ? 'Срок       Прибыль  Медиана  Худш.5%  Лучш.5%' : 'Hold       Profit   Median   Worst5%  Best5%').padEnd(56)}</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${'─'.repeat(54)}</span>\n`;
    for (const p of growth.hodl) {
      const { bar, cls } = makeBar(p.profitPct, 8);
      const medSign = p.median >= 0 ? '+' : '';
      const p5Sign = p.p5 >= 0 ? '+' : '';
      const p95Sign = p.p95 >= 0 ? '+' : '';
      const medCls = p.median >= 0 ? 'bar-green' : 'bar-red';
      const p5Cls = p.p5 >= 0 ? 'bar-green' : 'bar-red';
      h += `<span class="cyan">║</span>  <span class="white bold">${p.label.padEnd(10)}</span> [${bar}] <span class="${cls}">${p.profitPct.toFixed(0).padStart(3)}%</span>  <span class="${medCls}">${(medSign + p.median.toFixed(0) + '%').padStart(7)}</span>  <span class="${p5Cls}">${(p5Sign + p.p5.toFixed(0) + '%').padStart(7)}</span>  <span class="bar-green">${(p95Sign + p.p95.toFixed(0) + '%').padStart(7)}</span>\n`;
    }
    // Find the first period with 100% profit
    const perfect = growth.hodl.find(p => p.profitPct >= 99.5);
    if (perfect) {
      h += `<span class="cyan">║</span>\n`;
      h += `<span class="cyan">║</span>  <span class="bar-green bold">→ ${ru ? `BTC НИКОГДА не был убыточным за ${perfect.label}` : `BTC has NEVER lost money over any ${perfect.label} period`}</span>\n`;
      h += `<span class="cyan">║</span>  <span class="dim">  ${ru ? 'Чем дольше держите — тем выше шансы' : 'The longer you hold, the more the odds favor you'}</span>\n`;
    }
  }

  // Halving Cycle
  if (growth.halving) {
    const ru = state.lang === 'ru';
    const hv = growth.halving;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${ru ? 'ЦИКЛ ХАЛВИНГА — Где мы сейчас?' : 'HALVING CYCLE — Where Are We Now?'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Халвинги' : 'Halvings'}: 2012 │ 2016 │ 2020 │ 2024 │ ~${hv.nextHalvingEst}</span>\n`;
    h += `<span class="cyan">║</span>  <span class="white">${ru ? 'Сейчас' : 'Current'}: <span class="yellow bold">${hv.currentPct}%</span> ${ru ? 'цикла' : 'into cycle'} (${hv.daysSinceLast} ${ru ? 'дней от халвинга' : 'days since halving'})</span>\n`;
    // Timeline bar
    const pos = Math.round(hv.currentPct / 100 * 30);
    let timeline = '';
    for (let i = 0; i < 30; i++) {
      if (i === pos) timeline += '<span class="white bold">▼</span>';
      else if (i < pos) timeline += '<span class="bar-green">█</span>';
      else timeline += '<span class="dim">░</span>';
    }
    h += `<span class="cyan">║</span>  [${timeline}]\n`;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Средн. доходность за 30 дней по фазе цикла:' : 'Avg 30-day return by cycle phase:'}</span>\n`;
    for (const b of hv.buckets) {
      const isCurrent = hv.currentPct >= b.from && hv.currentPct < b.to;
      const retCls = b.avgRet > 5 ? 'bar-green' : b.avgRet < -3 ? 'bar-red' : 'yellow';
      const sign = b.avgRet >= 0 ? '+' : '';
      const marker = isCurrent ? ' <span class="white bold">← ' + (ru ? 'ВЫ ЗДЕСЬ' : 'YOU ARE HERE') + '</span>' : '';
      const { bar } = makeBar(Math.max(0, Math.min(100, (b.avgRet + 20) / 60 * 100)), 10);
      h += `<span class="cyan">║</span>  <span class="dim">${String(b.from).padStart(2)}-${String(b.to).padEnd(3)}%</span> [${bar}] <span class="${retCls}">${(sign + b.avgRet.toFixed(0) + '%').padStart(5)}</span>${marker}\n`;
    }
    // Verdict
    const phase = hv.currentPct < 30 ? (ru ? 'Начало цикла — исторически ЛУЧШЕЕ время для накопления' : 'Early cycle — historically the BEST time to accumulate')
                : hv.currentPct < 60 ? (ru ? 'Середина цикла — доходность исторически слабеет' : 'Mid-cycle — returns historically weaken here')
                : (ru ? 'Поздняя фаза — приближается следующий халвинг' : 'Late cycle — approaching next halving');
    h += `<span class="cyan">║</span>  <span class="dim">→</span> ${phase}\n`;
  }

  // Rainbow Price
  if (growth.rainbow) {
    const ru = state.lang === 'ru';
    const rb = growth.rainbow;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${ru ? 'РАДУГА ЦЕНЫ — Дёшево или дорого сейчас?' : 'RAINBOW PRICE — Cheap or Expensive Right Now?'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Тренд (лог-регрессия 16 лет)' : 'Trend (16-year log regression)'}:</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Ожидаемая цена' : 'Expected price'}:</span> <span class="white">$${Math.round(rb.expected).toLocaleString()}</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Текущая цена' : 'Current price'}:</span> <span class="white bold">$${Math.round(rb.currentPrice).toLocaleString()}</span>\n`;
    const zCls = rb.zScore < -0.5 ? 'bar-green' : rb.zScore > 0.5 ? 'bar-red' : 'yellow';
    h += `<span class="cyan">║</span>  <span class="dim">Z-score:</span> <span class="${zCls} bold">${rb.zScore.toFixed(2)}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    // Zone table
    for (const z of rb.zones) {
      const isCurrent = rb.zScore > z.min && rb.zScore <= z.max;
      const cls = z.profitPct > 65 ? 'bar-green' : z.profitPct < 40 ? 'bar-red' : 'yellow';
      const retSign = z.avgRet >= 0 ? '+' : '';
      const marker = isCurrent ? '<span class="white bold"> ←</span>' : '';
      const { bar } = makeBar(z.profitPct, 8);
      h += `<span class="cyan">║</span>  ${isCurrent ? '<span class="white bold">→</span>' : ' '} <span class="${isCurrent ? 'white bold' : 'dim'}">${z.name.padEnd(18)}</span> [${bar}] <span class="${cls}">${z.profitPct.toFixed(0)}%</span> ${ru ? 'прибыль' : 'win'}  <span class="${z.avgRet >= 0 ? 'bar-green' : 'bar-red'}">${retSign}${z.avgRet.toFixed(0)}%</span> ${ru ? 'средн.' : 'avg'}${marker}\n`;
    }
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Примечание: ранние данные (2010-2013) завышают тренд' : 'Note: early data (2010-2013) inflates trend estimates'}</span>\n`;
  }

  // Pain Duration
  if (growth.pain) {
    const ru = state.lang === 'ru';
    const p = growth.pain;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${ru ? 'ДЛИТЕЛЬНОСТЬ БОЛИ — Как долго длится просадка?' : 'PAIN DURATION — How Long Does the Dip Last?'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'BTC проводит большую часть времени НИЖЕ своего максимума.' : 'BTC spends most of its life BELOW its all-time high.'}</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">${ru ? 'Это нормально.' : 'This is normal.'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    for (const t of p.thresholds) {
      const { bar } = makeBar(t.pct, 14);
      h += `<span class="cyan">║</span>  <span class="dim">>${String(t.level).padStart(2)}% ${ru ? 'ниже ATH' : 'below ATH'}:</span> [${bar}] <span class="yellow">${t.pct.toFixed(0)}%</span> <span class="dim">${ru ? 'времени' : 'of time'}</span>\n`;
    }
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">║</span>  <span class="white">${ru ? 'Сейчас' : 'Now'}: <span class="${p.currentDD > 30 ? 'bar-red' : p.currentDD > 10 ? 'yellow' : 'bar-green'} bold">-${p.currentDD.toFixed(0)}%</span> ${ru ? 'от ATH' : 'from ATH'} ($${Math.round(p.ath).toLocaleString()})</span>\n`;
    h += `<span class="cyan">║</span>  <span class="dim">→ ${ru ? 'Это НОРМАЛЬНО. BTC был здесь или хуже' : 'This is NORMAL. BTC has been here or worse'} <span class="white">${p.normalPct.toFixed(0)}%</span> ${ru ? 'всего времени' : 'of all time'}</span>\n`;
  }

  // Round Numbers
  if (growth.roundNumbers && growth.roundNumbers.length > 0) {
    const ru = state.lang === 'ru';
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${ru ? 'КРУГЛЫЕ ЧИСЛА — Психологические барьеры' : 'ROUND NUMBERS — The Psychological Barrier Effect'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
    const lastPrice = growth.lastPrice || 0;
    for (const r of growth.roundNumbers) {
      const isCurrent = lastPrice >= r.level * 0.85 && lastPrice <= r.level * 1.15;
      const { bar, cls } = makeBar(r.rejectPct, 10);
      const marker = isCurrent ? ' <span class="white bold">← ' + (ru ? 'ЗОНА' : 'ZONE') + '</span>' : '';
      h += `<span class="cyan">║</span>  <span class="white bold">$${(r.level / 1000).toFixed(0)}k</span>  <span class="dim">${r.approaches} ${ru ? 'подходов' : 'approaches'} →</span> <span class="bar-red">${r.rejectPct.toFixed(0)}%</span> <span class="dim">${ru ? 'отскок' : 'rejected'}</span> <span class="bar-green">${r.breakPct.toFixed(0)}%</span> <span class="dim">${ru ? 'пробил' : 'broke'}${marker}</span>\n`;
    }
    // Find next resistance
    const nextRes = growth.roundNumbers.find(r => r.level > lastPrice);
    if (nextRes) {
      h += `<span class="cyan">║</span>  <span class="dim">→ ${ru ? 'Следующий барьер' : 'Next barrier'}: <span class="yellow bold">$${(nextRes.level / 1000).toFixed(0)}k</span> (${nextRes.rejectPct.toFixed(0)}% ${ru ? 'исторических отскоков' : 'historical rejections'})</span>\n`;
    }
  }

  // Momentum Trap
  if (growth.momentum && growth.momentum.accelEvents > 0) {
    const ru = state.lang === 'ru';
    const m = growth.momentum;
    h += `<span class="cyan">║</span>\n`;
    h += `<span class="cyan">╠══════════════════════════════════════════════════════════╣</span>\n`;
    h += `<span class="cyan">║</span> <span class="yellow bold"> ${ru ? 'ЛОВУШКА МОМЕНТУМА — Когда рост слишком быстрый' : 'MOMENTUM TRAP — When Growth Gets Too Fast'}</span>\n`;
    h += `<span class="cyan">║</span>\n`;
