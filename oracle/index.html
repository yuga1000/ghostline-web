function detectLiveAlerts(candles) {
  const N = candles.length;
  if (N < 10) return [];
  const alerts = [];
  const dir = c => c.close >= c.open ? 1 : -1;
  const isRu = state.lang === 'ru';

  // 1. Streak detection (7, 5, 3 days same color)
  for (const len of [7, 5, 3]) {
    if (N < len) continue;
    const recent = candles.slice(-len);
    const d = dir(recent[0]);
    if (recent.every(c => dir(c) === d)) {
      const color = d === 1 ? (isRu ? 'зелёных' : 'green') : (isRu ? 'красных' : 'red');
      const pcts = { 7: 61, 5: 51, 3: 50 };
      if (pcts[len] > 55) {
        alerts.push({
          icon: '⚡',
          text: isRu
            ? `${len} дней подряд ${color} — исторически ${pcts[len]}% что завтра разворот`
            : `${len} days in a row ${color} — historically ${pcts[len]}% chance of reversal tomorrow`,
          cls: 'yellow',
        });
      }
      break; // only show longest streak
    }
  }

  // 2. Huge candle (today's body > 2x average of last 30)
  if (N >= 30) {
    const bodies30 = candles.slice(-30).map(c => Math.abs(c.close - c.open));
    const avg = bodies30.reduce((a, b) => a + b, 0) / 30;
    const std = Math.sqrt(bodies30.reduce((s, b) => s + (b - avg) ** 2, 0) / 30);
    const lastBody = Math.abs(candles[N - 1].close - candles[N - 1].open);
    if (lastBody > avg + 2 * std) {
      alerts.push({
        icon: '💥',
        text: isRu
          ? `Аномально большая свеча — исторически 92% откат в течение 3 дней`
          : `Abnormally large candle — historically 92% bounce within 3 days`,
        cls: 'yellow',
      });
    }
  }

  // 3. Hammer pattern (last candle)
  {
    const c = candles[N - 1];
    const body = Math.abs(c.close - c.open);
    const lw = Math.min(c.open, c.close) - c.low;
    const uw = c.high - Math.max(c.open, c.close);
    if (body > 0 && lw > body * 2 && uw < body * 0.5) {
      alerts.push({
        icon: '🔨',
        text: isRu
          ? `Молот — исторически 57% что завтра рост`
          : `Hammer pattern — historically 57% chance of green tomorrow`,
        cls: 'bar-green',
      });
    }
  }

  // 4. Volume spike + red candle (panic)
  if (N >= 20) {
    const avgVol = candles.slice(-20).reduce((s, c) => s + c.volume, 0) / 20;
    const last = candles[N - 1];
    if (last.volume > avgVol * 2 && last.close < last.open) {
      alerts.push({
        icon: '📉',
        text: isRu
          ? `Распродажа на объёме — исторически 55% отскок на след. день`
          : `High-volume sell-off — historically 55% bounce next day`,
        cls: 'yellow',
      });
    }
  }

  // 5. Weekly growth check (last 7 candles)
  if (N >= 8) {
    const weekAgo = candles[N - 8].close;
    const now = candles[N - 1].close;
    const weekReturn = ((now - weekAgo) / weekAgo) * 100;
    if (weekReturn >= 20) {
      alerts.push({
        icon: '⚠',
        text: isRu
          ? `Рост ${weekReturn.toFixed(0)}% за неделю — исторически 89% коррекция`
          : `${weekReturn.toFixed(0)}% weekly growth — historically 89% pullback follows`,
        cls: 'bar-red',
      });
    } else if (weekReturn >= 10) {
      alerts.push({
        icon: '⚠',
        text: isRu
          ? `Рост ${weekReturn.toFixed(0)}% за неделю — исторически 80% коррекция`
          : `${weekReturn.toFixed(0)}% weekly growth — historically 80% pullback follows`,
        cls: 'yellow',
      });
    }
  }

  // 6. Halving cycle alert (uses pattern data if available)
  if (state.patternData && state.patternData.growth && state.patternData.growth.halving) {
    const hv = state.patternData.growth.halving;
    if (hv.currentPct < 30) {
      alerts.push({
        icon: '🔄',
        text: isRu
          ? `Ранняя фаза халвинг-цикла (${hv.currentPct}%) — исторически лучшее время`
          : `Early halving cycle phase (${hv.currentPct}%) — historically the best time`,
        cls: 'bar-green',
      });
    }
  }

  // 7. Rainbow z-score alert (uses pattern data if available)
  if (state.patternData && state.patternData.growth && state.patternData.growth.rainbow) {
    const z = state.patternData.growth.rainbow.zScore;
    if (z < -1.5) {
      alerts.push({
        icon: '🟢',
        text: isRu
          ? `BTC очень дёшев по тренду (z=${z.toFixed(1)}) — исторически 100% прибыль за 90 дней`
          : `BTC very cheap vs trend (z=${z.toFixed(1)}) — historically 100% profit within 90 days`,
        cls: 'bar-green',
      });
    } else if (z > 1.5) {
      alerts.push({
        icon: '🔴',
        text: isRu
          ? `BTC очень дорог по тренду (z=${z.toFixed(1)}) — исторически только 18% прибыль`
          : `BTC very expensive vs trend (z=${z.toFixed(1)}) — historically only 18% win rate`,
        cls: 'bar-red',
      });
    }
  }

  // 8. Momentum acceleration alert
  if (state.patternData && state.patternData.growth && state.patternData.growth.momentum) {
    const m = state.patternData.growth.momentum;
    if (m.current && m.current.ratio > 3 && m.current.recent > 10) {
      alerts.push({
        icon: '⚠',
        text: isRu
          ? `Моментум ускоряется ${m.current.ratio.toFixed(1)}x — повышенный риск коррекции`
          : `Momentum accelerating ${m.current.ratio.toFixed(1)}x — elevated pullback risk`,
        cls: 'bar-red',
      });
    }
  }

  return alerts;
}

// ============================================================
// RENDER
// ============================================================
function renderGauge(score) {
  const w = 40, norm = (score+100)/200, filled = Math.round(norm*w);
  let bar = '';
  for (let i = 0; i < w; i++) {
    if (i < filled) {
      if (i < w*0.35) bar += '<span class="red">█</span>';
      else if (i < w*0.65) bar += '<span class="yellow">█</span>';
      else bar += '<span class="bar-green">█</span>';
    } else bar += '<span class="dim">░</span>';
  }
  return `  <span class="bar-red">BEAR</span> [${bar}] <span class="bar-green">BULL</span>`;
}

function renderFactorBar(f) {
  const bw = 20, norm = (f.score+100)/200, filled = Math.round(norm*bw);
  const cls = f.score>=10?'bar-green':f.score<=-10?'bar-red':'bar-neutral';
  let bar = '';
  for (let i = 0; i < bw; i++) bar += i<filled?`<span class="${cls}">█</span>`:'<span class="dim">░</span>';
  const sign = f.score>=0?'+':'';
  return `  ${f.name.padEnd(12)} [${bar}] ${(sign+f.score.toFixed(0)).padStart(5)}  ${f.detail||''}`;
}

function renderMiniCandles(candles) {
  const rec = candles.slice(-30), h = 8;
  const mn = Math.min(...rec.map(c=>c.low)), mx = Math.max(...rec.map(c=>c.high)), rng = mx-mn||1;
  const rows = [];
  for (let r = h-1; r >= 0; r--) {
    const th = mn + rng*(r+0.5)/h;
    let line = '  ';
    for (const c of rec) {
      const g = c.close>=c.open, bt = Math.max(c.open,c.close), bb = Math.min(c.open,c.close);
      if (bb<=th && th<=bt) line += g?'<span class="bar-green">█</span>':'<span class="bar-red">█</span>';
      else if (c.low<=th && th<=c.high) line += g?'<span class="bar-green">│</span>':'<span class="bar-red">│</span>';
      else line += ' ';
    }
    rows.push(line);
  }
  rows[0] += `  $${mx.toFixed(0)}`;
  rows[h-1] += `  $${mn.toFixed(0)}`;
  return rows.join('\n');
}

  const dayEnd = dayStart + 86400000;
  const dayProg = Math.max(0, Math.min(1, (nowForBar - dayStart) / (dayEnd - dayStart)));
  const barLen = 14;
  const barFill = Math.round(dayProg * barLen);
  const barStr = '█'.repeat(barFill) + '░'.repeat(barLen - barFill);
  const barPct = Math.round(dayProg * 100);

  // Mini chart
  const cc = Math.min(candles.length, 30);

  // Footer

  h += `\n<span class="dim">  ${L.disclaimer}</span>`;

  document.getElementById('output').innerHTML = h;

// ORCHESTRATION
// ============================================================
async function refresh() {
  if (state.isLoading) return;
  state.isLoading = true;
  const out = document.getElementById('output');
  out.innerHTML = `<span class="loading">  Fetching ${CONFIG.symbol} data...</span><span class="blink">_</span>`;

  try {
    const data = await fetchData(state.timeframe);
    const pred = computePrediction(data.candles, data.dailyCandles);
    state.countdown = CONFIG.refreshIntervals[state.timeframe];
    state.retryCount = 0;
    render(data, pred);
    startCountdown();
  } catch (err) {
    state.retryCount++;
    if (state.retryCount <= 3) {
      const d = state.retryCount * 10;
      out.innerHTML = `<span class="error">  ERROR: ${err.message}\n  Retry ${state.retryCount}/3 in ${d}s...</span>`;
      setTimeout(refresh, d * 1000);
    } else {
      out.innerHTML = `<span class="error">  ERROR: ${err.message}\n  All retries failed. Press [R] to try again.</span>`;
      state.retryCount = 0;
    }
  } finally {
    state.isLoading = false;
  }
}

function startCountdown() {
  clearInterval(state.countdownTimer);
  if (!state.autoRefresh) return;
  state.countdownTimer = setInterval(() => {
    state.countdown--;
    if (state.countdown <= 0) { clearInterval(state.countdownTimer); refresh(); }
  }, 1000);
}

function toggleAutoRefresh() {
  state.autoRefresh = !state.autoRefresh;
  document.getElementById('auto-toggle').textContent = `[A] AUTO: ${state.autoRefresh ? 'ON' : 'OFF'}`;
  if (state.autoRefresh) { state.countdown = CONFIG.refreshIntervals[state.timeframe]; startCountdown(); }
  else clearInterval(state.countdownTimer);
}

// Events
document.getElementById('auto-toggle').addEventListener('click', toggleAutoRefresh);

function setTimeframe(tf) {
  if (state.timeframe === tf || state.isLoading) return;
  state.timeframe = tf;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tf') === tf));
  refresh();
}
document.querySelectorAll('.tf-btn').forEach(b => {
  b.addEventListener('click', () => setTimeframe(b.getAttribute('data-tf')));
});

function doToggleDetails() { state.showDetails = !state.showDetails; refresh(); }
function doTogglePatterns() { loadPatterns(); }
function doToggleLang() { state.lang = state.lang==='en'?'ru':'en'; localStorage.setItem('signal_lang', state.lang); document.getElementById('header').innerHTML = `<span class="dim">  ${LANG[state.lang].header}</span>\n`; if (state.patternRawCandles) { state.patternData = analyzePatterns(state.patternRawCandles); renderPatternBlock(); } refresh(); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.getAttribute('data-act');
  if (act === 'toggleDetails') doToggleDetails();
  else if (act === 'togglePatterns') doTogglePatterns();
  else if (act === 'toggleLang') doToggleLang();
});

document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase()==='a') toggleAutoRefresh();
  if (e.key.toLowerCase()==='r') refresh();
  if (e.key.toLowerCase()==='d') doToggleDetails();
  if (e.key.toLowerCase()==='p') doTogglePatterns();
  if (e.key.toLowerCase()==='l') doToggleLang();
});

document.getElementById('header').innerHTML = `<span class="dim">  ${LANG[state.lang].header}</span>\n`;
refresh();
