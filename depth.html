<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MYSTRA — Depth Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #000000;
  --line: rgba(255,180,80,0.45);
  --line-2: rgba(255,180,80,0.65);
  --text: #d8d2c4;
  --text-dim: #7c7466;
  --text-mute: #4a4538;
  --accent: #ffb142;
  --accent-dim: #a8731d;
  --glow: rgba(255,180,80,.22);
  --c-green: #6cd97e;
  --c-red: #ff5e5e;
  --bw: 2px;
  --mono: "JetBrains Mono", "IBM Plex Mono", Menlo, monospace;
  --terminal: "VT323", monospace;
  --pixel: "Press Start 2P", monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; font-family: var(--mono); color: var(--text); font-size: 12px; line-height: 1.4; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; padding: 0; }
.shell { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; border-bottom: var(--bw) solid var(--line); background: rgba(0,0,0,0.92); font-family: var(--mono); flex-shrink: 0; }
.tb-row { display: flex; align-items: center; padding: 0 24px; height: 44px; gap: 14px; font-size: 11px; letter-spacing: 0.1em; }
.tb-brand { color: var(--accent); font-weight: 700; letter-spacing: 0.16em; font-size: 12px; }
.tb-link { color: var(--text-dim); padding: 0 14px; letter-spacing: 0.14em; border-right: 1px solid var(--line); height: 100%; display: inline-flex; align-items: center; }
.tb-link:last-of-type { border-right: 0; }
.tb-link:hover, .tb-link.is-current { color: var(--accent); }
.tb-btc { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; padding: 4px 12px; border: 1px solid var(--line); background: #000; font-size: 11px; letter-spacing: 0.1em; }
.tb-btc .btc-lbl { color: var(--accent); font-weight: 700; letter-spacing: 0.18em; }
.tb-btc .btc-px { color: var(--text); font-weight: 600; min-width: 92px; text-align: right; }
.btc-chg.is-up { color: var(--c-green); }
.btc-chg.is-dn { color: var(--c-red); }
/* ── page head ── */
.dw-head { display: flex; align-items: center; gap: 18px; padding: 10px 24px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.dw-title { font-family: var(--terminal); font-size: 26px; color: var(--accent); letter-spacing: 0.06em; }
.dw-sub { font-size: 10px; letter-spacing: 0.2em; color: var(--text-mute); }
.dw-ints { display: flex; gap: 6px; margin-left: auto; }
.dw-int { border: 1px solid var(--line); padding: 4px 10px; font-size: 10px; letter-spacing: 0.12em; color: var(--text-dim); }
.dw-int:hover { color: var(--accent); }
.dw-int.is-on { color: var(--accent); border-color: var(--line-2); }
.dw-ws { font-size: 10px; letter-spacing: 0.18em; padding: 4px 10px; border: 1px solid var(--line); }
.dw-ws.is-ok { color: var(--c-green); }
.dw-ws.is-bad { color: var(--c-red); }
/* ── tank: height set by JS to fit all lanes, page scrolls ── */
.dw-tank { position: relative; }
.dw-tank::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at top left, rgba(255,200,100,0.4) 1.3px, transparent 2.4px),
    linear-gradient(0deg,  rgba(255,140,30,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,140,30,0.07) 1px, transparent 1px);
  background-size: 88px 88px;
}
#tank { display: block; image-rendering: pixelated; position: relative; z-index: 1; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.dw-label {
  position: absolute;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: 0.08em;
  padding: 2px 8px;
  background: rgba(0,0,0,0.82);
}
.dw-label .l-name { font-family: var(--terminal); font-size: 16px; font-weight: 400; letter-spacing: 0.08em; }
.dw-label.is-alt .l-name { font-size: 14px; }
.dw-label .l-px { color: var(--text); }
.dw-label .l-chg.is-up { color: var(--c-green); }
.dw-label .l-chg.is-dn { color: var(--c-red); }
.dw-label .l-rng { color: var(--text-dim); letter-spacing: 0.06em; }
.dw-label .l-off { color: var(--text-mute); letter-spacing: 0.2em; }
/* ── ALT_FIELD section header ── */
.alt-sec {
  position: absolute; z-index: 2;
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--accent);
}
.alt-sec .as-title { font-family: var(--terminal); font-size: 18px; letter-spacing: 0.08em; }
.alt-sec .as-note { font-size: 9px; letter-spacing: 0.18em; color: var(--text-mute); }
.l-dot { width: 6px; height: 6px; background: var(--text-mute); align-self: center; }
.l-dot.is-live { background: currentColor; animation: dwblink 1.6s steps(2) infinite; }
@keyframes dwblink { 50% { opacity: 0.25; } }
/* ── foot ── */
@media (max-width: 720px) {
  .dw-head { flex-wrap: wrap; gap: 10px; }
  .dw-ints { margin-left: 0; }
  .tb-link { padding: 0 8px; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="tb-row">
      <span class="tb-brand">MYSTRA</span>
      <a class="tb-link" href="/">LAB</a>
      <a class="tb-link" href="bandanas.html">BANDANAS</a>
      <a class="tb-link is-current" href="#">DEPTH</a>
      <span class="tb-btc">
        <span class="btc-lbl">BTC</span>
        <span class="btc-px" id="btc-px">—</span>
        <span class="btc-chg" id="btc-chg"></span>
      </span>
    </div>
  </header>
  <div class="dw-head">
    <span class="dw-title">DEPTH_WATCH</span>
    <span class="dw-sub">CINEMA LANES · TRUE WAVE SHAPE PER ASSET</span>
    <div class="dw-ints">
      <button class="dw-int" data-iv="1s">1S</button>
      <button class="dw-int" data-iv="1m">1M</button>
      <button class="dw-int" data-iv="5m">5M</button>
      <button class="dw-int" data-iv="15m">15M</button>
      <button class="dw-int" data-iv="1h">1H</button>
    </div>
    <span class="dw-ws is-bad" id="ws-status">CONNECTING</span>
  </div>
  <div class="dw-tank">
    <canvas id="tank"></canvas>
    <div id="labels"></div>
    <div class="alt-sec" id="alt-sec">
      <span class="as-title">▾ ALT_FIELD</span>
      <span class="as-note">[8] · EACH LANE AUTO-SCALED · Δ = WINDOW RANGE</span>
    </div>
  </div>
</div>
<script src="depth-app.js"></script>
</body>
</html>
