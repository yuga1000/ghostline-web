name: Update Sun Timelapse

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  update-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sun frames from NASA SDO
        run: bash scripts/update-sun-frames.sh

      - name: Check if JSON changed
        id: check
        run: |
          if git diff --quiet data/sun-frames.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sun-frames.json
          git commit -m "Auto-update sun timelapse frames ($(date -u +%Y-%m-%d))"
          git push
