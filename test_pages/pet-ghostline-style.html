<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLINE PET | TAMAGOTCHI</title>

    <!-- Press Start 2P Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Pet Styles -->
    <link rel="stylesheet" href="styles.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: #000000;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: crosshair;
        }

        /* Floating pixels (fireflies) - from order.html */
        .pixel {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            pointer-events: none;
            z-index: 0;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
                opacity: 0.3;
            }
            25% {
                transform: translate(100px, -200px);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50px, -300px);
                opacity: 0.5;
            }
            75% {
                transform: translate(150px, -100px);
                opacity: 0.9;
            }
        }

        .container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid #00ff00;
            padding: 20px;
            background: #000000;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .header p {
            font-size: 8px;
            opacity: 0.7;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 8px;
            color: #00ff00;
            opacity: 0.5;
            padding: 15px;
            border-top: 1px solid #00ff00;
        }

        /* Override arcade screen for ghostline style */
        .tamagotchi-arcade-screen {
            background: #000000;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        /* Green glow on hover for buttons */
        .arcade-button:hover {
            box-shadow:
                0 0 10px rgba(0, 255, 0, 0.5),
                inset 0 0 5px rgba(0, 255, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- Floating pixels background -->
    <div id="pixels-container"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>[ GHOSTLINE PET ]</h1>
            <p>PIXEL TAMAGOTCHI SYSTEM v1.0</p>
        </div>

        <!-- Main Arcade Screen -->
        <div class="tamagotchi-arcade-screen">
            <!-- Title -->
            <div class="arcade-title">
                ★ AGENT COMPANION ★
            </div>

            <!-- Pet Display -->
            <div class="arcade-pet-screen" id="pet-display">
                <!-- Your pixel pet -->
                <div class="pixel-pet idle" id="pixel-pet" style="transform: scale(3);">
                    <!-- Row 1: Top of head -->
                    <div class="pet-row">
                        <div class="pet-pixel"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel"></div>
                    </div>
                    <!-- Row 2: Eyes row -->
                    <div class="pet-row">
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel eye" id="pet-eye-left"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel eye" id="pet-eye-right"></div>
                        <div class="pet-pixel pink"></div>
                    </div>
                    <!-- Row 3: Body -->
                    <div class="pet-row">
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel pink"></div>
                    </div>
                    <!-- Row 4: Legs -->
                    <div class="pet-row">
                        <div class="pet-pixel"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel"></div>
                        <div class="pet-pixel pink"></div>
                        <div class="pet-pixel"></div>
                    </div>
                </div>
            </div>

            <!-- Mood Display -->
            <div class="arcade-mood-sign" style="margin-top: 15px;">
                <div class="arcade-mood-text" id="mood-display">VERY HAPPY</div>
            </div>

            <!-- Age Counter -->
            <div class="arcade-age-display">
                AGE: <span id="age-counter">000</span> MIN
            </div>

            <!-- Progress Bars -->
            <div style="margin-top: 20px;">
                <!-- Hunger Bar -->
                <div class="arcade-stat-bar">
                    <div class="arcade-stat-label">HUNGER</div>
                    <div class="arcade-stat-value" id="hunger-value">100%</div>
                    <div class="arcade-stat-fill" id="hunger-fill" style="width: 100%;"></div>
                </div>

                <!-- Happiness Bar -->
                <div class="arcade-stat-bar">
                    <div class="arcade-stat-label">HAPPY</div>
                    <div class="arcade-stat-value" id="happy-value">100%</div>
                    <div class="arcade-stat-fill" id="happy-fill" style="width: 100%;"></div>
                </div>

                <!-- Energy Bar -->
                <div class="arcade-stat-bar">
                    <div class="arcade-stat-label">ENERGY</div>
                    <div class="arcade-stat-value" id="energy-value">100%</div>
                    <div class="arcade-stat-fill" id="energy-fill" style="width: 100%;"></div>
                </div>

                <!-- Health Bar -->
                <div class="arcade-stat-bar">
                    <div class="arcade-stat-label">HEALTH</div>
                    <div class="arcade-stat-value" id="health-value">100%</div>
                    <div class="arcade-stat-fill full" id="health-fill" style="width: 100%;"></div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="button-grid">
                <button class="arcade-button feed" onclick="feedPet()">
                    > FEED
                </button>
                <button class="arcade-button play" onclick="playWithPet()">
                    > PLAY
                </button>
                <button class="arcade-button sleep" onclick="petSleep()">
                    > SLEEP
                </button>
                <button class="arcade-button heal" onclick="healPet()">
                    > HEAL
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            [ GHOSTLINE SYSTEMS ] | [ TAMAGOTCHI MODULE v1.0 ]<br>
            STATS AUTO-SAVE | PERSISTENT ACROSS SESSIONS
        </div>
    </div>

    <!-- Include pet.js functionality -->
    <script src="pet.js"></script>

    <script>
        // Generate floating pixels
        function generatePixels() {
            const container = document.createElement('div');
            container.id = 'pixels-container';
            container.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;';
            document.body.appendChild(container);

            for (let i = 0; i < 30; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.style.left = Math.random() * 100 + '%';
                pixel.style.top = Math.random() * 100 + '%';
                pixel.style.animationDelay = Math.random() * 20 + 's';
                pixel.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(pixel);
            }
        }
        generatePixels();

        // Update progress bars in real-time
        setInterval(() => {
            if (window.petModule) {
                const stats = window.petModule.getStats();

                // Update values
                document.getElementById('hunger-value').textContent = Math.round(stats.hunger) + '%';
                document.getElementById('happy-value').textContent = Math.round(stats.happiness) + '%';
                document.getElementById('energy-value').textContent = Math.round(stats.energy) + '%';
                document.getElementById('health-value').textContent = Math.round(stats.health) + '%';

                // Update bar widths
                const hungerBar = document.getElementById('hunger-fill');
                const happyBar = document.getElementById('happy-fill');
                const energyBar = document.getElementById('energy-fill');
                const healthBar = document.getElementById('health-fill');

                hungerBar.style.width = stats.hunger + '%';
                happyBar.style.width = stats.happiness + '%';
                energyBar.style.width = stats.energy + '%';
                healthBar.style.width = stats.health + '%';

                // Add critical class if low
                hungerBar.classList.toggle('critical', stats.hunger < 30);
                happyBar.classList.toggle('critical', stats.happiness < 30);
                energyBar.classList.toggle('critical', stats.energy < 30);
                healthBar.classList.toggle('critical', stats.health < 30);

                // Add full class if maxed
                hungerBar.classList.toggle('full', stats.hunger >= 100);
                happyBar.classList.toggle('full', stats.happiness >= 100);
                energyBar.classList.toggle('full', stats.energy >= 100);
                healthBar.classList.toggle('full', stats.health >= 100);

                // Update mood
                const mood = document.getElementById('mood-display');
                if (!stats.alive) {
                    mood.textContent = '[ SYSTEM OFFLINE ]';
                } else if (stats.happiness > 80) {
                    mood.textContent = '[ VERY HAPPY ]';
                } else if (stats.happiness > 60) {
                    mood.textContent = '[ HAPPY ]';
                } else if (stats.happiness > 40) {
                    mood.textContent = '[ OK ]';
                } else if (stats.happiness > 20) {
                    mood.textContent = '[ SAD ]';
                } else {
                    mood.textContent = '[ DEPRESSED ]';
                }

                // Update age
                const age = Math.floor(stats.age / 60);
                document.getElementById('age-counter').textContent = String(age).padStart(3, '0');
            }
        }, 100); // Update 10 times per second

        // Wrapper functions for buttons
        function feedPet() {
            if (window.petModule) window.petModule.feed();
        }

        function playWithPet() {
            if (window.petModule) window.petModule.play();
        }

        function petSleep() {
            if (window.petModule) window.petModule.sleep();
        }

        function healPet() {
            if (window.petModule) window.petModule.heal();
        }

        console.log('[GHOSTLINE] Pet Tamagotchi System Loaded');
        console.log('[GHOSTLINE] Use buttons to interact with your companion');
    </script>
</body>
</html>
