<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYSTRA 01 — Layout Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#0f0;font-family:'Courier New',monospace;overflow:hidden;height:100vh}

/* TOOLBAR */
.toolbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:#1a1a1a;border-bottom:1px solid #333;
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;font-size:12px;
  flex-wrap:wrap;
}
.toolbar button{
  background:#222;color:#0f0;border:1px solid #444;
  padding:3px 8px;font-family:inherit;font-size:10px;
  cursor:pointer;white-space:nowrap;
}
.toolbar button:hover{background:#333;border-color:#0f0}
.toolbar button.active{background:#0f0;color:#000}
.toolbar .sep{width:1px;height:18px;background:#333;margin:0 2px}
.toolbar label{font-size:10px;opacity:0.6;margin-left:2px}
.toolbar input[type="number"]{
  width:40px;background:#222;color:#0f0;border:1px solid #444;
  padding:2px 3px;font-family:inherit;font-size:10px;text-align:center;
}
.toolbar select{
  background:#222;color:#0f0;border:1px solid #444;
  padding:2px 3px;font-family:inherit;font-size:10px;
}

/* COLOR SWATCHES in toolbar */
.swatches{display:flex;gap:3px;align-items:center}
.swatch{
  width:16px;height:16px;border:1px solid #555;cursor:pointer;
  transition:transform 0.1s,border-color 0.1s;
}
.swatch:hover{transform:scale(1.3);border-color:#fff}

/* CANVAS AREA */
.canvas-wrap{
  position:fixed;top:34px;left:0;right:220px;bottom:28px;
  overflow:hidden;
}
.canvas{
  position:absolute;
  background:#000;
  border:1px solid #222;
  transform-origin:0 0;
}
.canvas .grid-lines{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,0,0.04) 1px, transparent 1px);
  background-size:50px 50px;
}

/* BLOCKS */
.block{
  position:absolute;
  cursor:move;
  user-select:none;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:1px;
  transition:box-shadow 0.15s;
}
.block:hover{filter:brightness(1.2)}
.block.selected{
  box-shadow:0 0 0 2px #fff;
}
.block .block-label{
  pointer-events:none;
  font-size:9px;opacity:0.7;
  text-transform:uppercase;letter-spacing:1px;
  text-align:center;line-height:1.3;
  white-space:pre-line;
}

/* RESIZE HANDLES */
.block .handle{
  position:absolute;width:8px;height:8px;
  background:#fff;opacity:0;
  transition:opacity 0.15s;
  z-index:10;
}
.block:hover .handle,.block.selected .handle{opacity:0.5}
.block .handle:hover{opacity:1}
.handle.tl{top:-4px;left:-4px;cursor:nw-resize}
.handle.tr{top:-4px;right:-4px;cursor:ne-resize}
.handle.bl{bottom:-4px;left:-4px;cursor:sw-resize}
.handle.br{bottom:-4px;right:-4px;cursor:se-resize}
.handle.tm{top:-4px;left:50%;transform:translateX(-50%);cursor:n-resize}
.handle.bm{bottom:-4px;left:50%;transform:translateX(-50%);cursor:s-resize}
.handle.ml{left:-4px;top:50%;transform:translateY(-50%);cursor:w-resize}
.handle.mr{right:-4px;top:50%;transform:translateY(-50%);cursor:e-resize}

/* Z-INDEX layer badges */
.block .z-badge{
  position:absolute;top:2px;right:3px;
  font-size:7px;opacity:0.3;pointer-events:none;
}

/* STATUSBAR */
.statusbar{
  position:fixed;bottom:0;left:0;right:0;
  background:#1a1a1a;border-top:1px solid #333;
  padding:3px 12px;font-size:9px;opacity:0.5;
  display:flex;justify-content:space-between;
}

/* EXPORT PANEL */
.export-panel{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#111;border:1px solid #0f0;
  padding:16px;z-index:200;
  max-width:90vw;max-height:80vh;overflow:auto;
  display:none;
  box-shadow:0 0 40px rgba(0,255,65,0.15);
}
.export-panel.open{display:block}
.export-panel pre{
  color:#0f0;font-size:11px;line-height:1.5;
  white-space:pre-wrap;word-break:break-all;
  max-height:60vh;overflow:auto;
}
.export-panel .close-exp{
  position:absolute;top:6px;right:8px;
  cursor:pointer;font-size:14px;color:#0f0;
}

/* PROPERTIES PANEL — always visible on the right */
.props{
  position:fixed;top:34px;right:0;width:220px;bottom:28px;
  background:#1a1a1a;border-left:1px solid #333;
  padding:8px;font-size:11px;overflow-y:auto;
  z-index:50;
  display:flex;flex-direction:column;
}
.props .empty-msg{
  opacity:0.2;font-size:10px;text-align:center;margin-top:40px;letter-spacing:1px;
}
.props .props-content{display:none}
.props.has-selection .props-content{display:block}
.props.has-selection .empty-msg{display:none}
.props h3{font-size:10px;opacity:0.4;margin-bottom:6px;font-weight:normal;letter-spacing:1px;border-bottom:1px solid #333;padding-bottom:4px}
.props .prop-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.props .prop-row label{opacity:0.5;font-size:9px;min-width:48px}
.props .prop-row input{
  width:56px;background:#222;color:#0f0;border:1px solid #444;
  padding:2px 3px;font-family:inherit;font-size:10px;text-align:center;
}
.props .prop-row input[type="checkbox"]{width:auto}
.props .prop-row input[type="color"]{
  width:32px;height:20px;padding:0;border:1px solid #444;
  background:#222;cursor:pointer;
}
.props .prop-row input[type="range"]{
  width:70px;accent-color:#0f0;
}
.props .prop-row select{
  width:76px;background:#222;color:#0f0;border:1px solid #444;
  padding:2px;font-family:inherit;font-size:9px;
}
.props .prop-row .val-display{
  font-size:9px;opacity:0.5;width:24px;text-align:right;
}
.props .section-label{font-size:8px;opacity:0.3;letter-spacing:1px;margin:8px 0 4px;text-transform:uppercase}
.props .color-presets{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.props .color-presets .cp{
  width:14px;height:14px;border:1px solid #444;cursor:pointer;
}
.props .color-presets .cp:hover{border-color:#fff;transform:scale(1.2)}
.props button.del{
  width:100%;background:#300;color:#f33;border:1px solid #633;
  padding:3px;font-family:inherit;font-size:9px;cursor:pointer;
  margin-top:6px;
}
.props button.del:hover{background:#500}
.props button.action{
  width:100%;background:#222;color:#0f0;border:1px solid #444;
  padding:3px;font-family:inherit;font-size:9px;cursor:pointer;
  margin-top:4px;
}
.props button.action:hover{background:#333;border-color:#0f0}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="addBlock()">+ BLOCK</button>
  <button onclick="addBlock('open')">+ OPEN</button>
  <button onclick="addBlock('text')">+ TEXT</button>
  <div class="sep"></div>
  <button onclick="snapToggle(this)" class="active" id="snapBtn">SNAP</button>
  <label>Grid:</label>
  <input type="number" value="10" min="1" max="100" id="snapSize" onchange="snapVal=+this.value">
  <div class="sep"></div>
  <label>Canvas:</label>
  <select id="canvasPreset" onchange="setCanvasSize(this.value)">
    <option value="1440x900">1440x900</option>
    <option value="1280x800">1280x800</option>
    <option value="1920x1080">1920x1080</option>
    <option value="375x812">375x812</option>
  </select>
  <div class="sep"></div>
  <button onclick="duplicateSelected()">DUPE</button>
  <button onclick="bringForward()">FWD</button>
  <button onclick="sendBackward()">BWD</button>
  <div class="sep"></div>
  <label>Quick:</label>
  <div class="swatches">
    <div class="swatch" style="background:#00FF41" onclick="quickColor('#00FF41')" title="Green"></div>
    <div class="swatch" style="background:#00FFFF" onclick="quickColor('#00FFFF')" title="Cyan"></div>
    <div class="swatch" style="background:#FF00FF" onclick="quickColor('#FF00FF')" title="Magenta"></div>
    <div class="swatch" style="background:#FF6600" onclick="quickColor('#FF6600')" title="Amber"></div>
    <div class="swatch" style="background:#FF003C" onclick="quickColor('#FF003C')" title="Red"></div>
    <div class="swatch" style="background:#0066FF" onclick="quickColor('#0066FF')" title="Blue"></div>
    <div class="swatch" style="background:#FFFFFF" onclick="quickColor('#FFFFFF')" title="White"></div>
    <div class="swatch" style="background:#666666" onclick="quickColor('#666666')" title="Gray"></div>
  </div>
  <div class="sep"></div>
  <button onclick="exportLayout()">EXPORT</button>
  <button onclick="exportJSON()">SAVE</button>
  <button onclick="importJSON()">LOAD</button>
  <div class="sep"></div>
  <button onclick="loadPreset()">PRESET</button>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas">
    <div class="grid-lines"></div>
  </div>
</div>

<div class="props" id="props">
  <h3>PROPERTIES</h3>
  <div class="empty-msg">SELECT A BLOCK</div>
  <div class="props-content">
  <div class="prop-row"><label>NAME</label><input type="text" id="propName" onchange="setProp('name',this.value)" style="width:90px"></div>
  <div class="prop-row"><label>LABEL</label><input type="text" id="propLabel" onchange="setProp('label',this.value)" style="width:90px"></div>
  <div class="prop-row"><label>TYPE</label>
    <select id="propType" onchange="setProp('type',this.value)">
      <option value="image">IMAGE</option>
      <option value="text">TEXT</option>
      <option value="open">OPEN</option>
      <option value="icons">ICONS</option>
      <option value="info">INFO</option>
    </select>
  </div>

  <div class="section-label">POSITION & SIZE</div>
  <div class="prop-row"><label>X</label><input type="number" id="propX" onchange="setProp('x',+this.value)"></div>
  <div class="prop-row"><label>Y</label><input type="number" id="propY" onchange="setProp('y',+this.value)"></div>
  <div class="prop-row"><label>W</label><input type="number" id="propW" onchange="setProp('w',+this.value)"></div>
  <div class="prop-row"><label>H</label><input type="number" id="propH" onchange="setProp('h',+this.value)"></div>

  <div class="section-label">BORDER</div>
  <div class="prop-row"><label>SHOW</label><input type="checkbox" id="propBorder" onchange="setProp('border',this.checked)"></div>
  <div class="prop-row"><label>COLOR</label><input type="color" id="propBorderColor" value="#00FF41" onchange="setProp('borderColor',this.value)"></div>
  <div class="prop-row"><label>WIDTH</label><input type="range" min="1" max="6" value="1" id="propBorderWidth" oninput="setProp('borderWidth',+this.value);document.getElementById('bwVal').textContent=this.value+'px'"><span class="val-display" id="bwVal">1px</span></div>
  <div class="prop-row"><label>OPACITY</label><input type="range" min="0" max="100" value="40" id="propBorderOpacity" oninput="setProp('borderOpacity',+this.value);document.getElementById('boVal').textContent=this.value+'%'"><span class="val-display" id="boVal">40%</span></div>
  <div class="prop-row"><label>STYLE</label>
    <select id="propBorderStyle" onchange="setProp('borderStyle',this.value)">
      <option value="solid">SOLID</option>
      <option value="dashed">DASHED</option>
      <option value="dotted">DOTTED</option>
      <option value="double">DOUBLE</option>
    </select>
  </div>

  <div class="section-label">FILL</div>
  <div class="prop-row"><label>COLOR</label><input type="color" id="propFillColor" value="#00FF41" onchange="setProp('fillColor',this.value)"></div>
  <div class="prop-row"><label>OPACITY</label><input type="range" min="0" max="100" value="3" id="propFillOpacity" oninput="setProp('fillOpacity',+this.value);document.getElementById('foVal').textContent=this.value+'%'"><span class="val-display" id="foVal">3%</span></div>

  <div class="section-label">TEXT</div>
  <div class="prop-row"><label>COLOR</label><input type="color" id="propTextColor" value="#00FF41" onchange="setProp('textColor',this.value)"></div>
  <div class="prop-row"><label>SIZE</label><input type="range" min="6" max="48" value="9" id="propTextSize" oninput="setProp('textSize',+this.value);document.getElementById('tsVal').textContent=this.value+'px'"><span class="val-display" id="tsVal">9px</span></div>

  <div class="section-label">GLOW</div>
  <div class="prop-row"><label>SHOW</label><input type="checkbox" id="propGlow" onchange="setProp('glow',this.checked)"></div>
  <div class="prop-row"><label>SIZE</label><input type="range" min="0" max="40" value="10" id="propGlowSize" oninput="setProp('glowSize',+this.value);document.getElementById('gsVal').textContent=this.value+'px'"><span class="val-display" id="gsVal">10px</span></div>

  <div class="section-label">PRESETS</div>
  <div class="color-presets">
    <div class="cp" style="background:#00FF41" onclick="applyColorPreset('#00FF41')" title="Matrix Green"></div>
    <div class="cp" style="background:#00FFFF" onclick="applyColorPreset('#00FFFF')" title="Cyan"></div>
    <div class="cp" style="background:#FF00FF" onclick="applyColorPreset('#FF00FF')" title="Magenta"></div>
    <div class="cp" style="background:#FF6600" onclick="applyColorPreset('#FF6600')" title="Amber"></div>
    <div class="cp" style="background:#FF003C" onclick="applyColorPreset('#FF003C')" title="Red"></div>
    <div class="cp" style="background:#0066FF" onclick="applyColorPreset('#0066FF')" title="Blue"></div>
    <div class="cp" style="background:#FFFF00" onclick="applyColorPreset('#FFFF00')" title="Yellow"></div>
    <div class="cp" style="background:#FFFFFF" onclick="applyColorPreset('#FFFFFF')" title="White"></div>
    <div class="cp" style="background:#000080" onclick="applyColorPreset('#000080')" title="Navy"></div>
    <div class="cp" style="background:#800080" onclick="applyColorPreset('#800080')" title="Purple"></div>
  </div>

  <button class="action" onclick="copyStyleToAll()">APPLY STYLE TO ALL</button>
  <button class="del" onclick="deleteSelected()">DELETE BLOCK</button>
  </div><!-- /props-content -->
</div>

<div class="statusbar">
  <span id="statusPos">X: 0 Y: 0</span>
  <span id="statusInfo">Blocks: 0 | Arrows=nudge | Shift+Arrow=50px | Del=remove</span>
</div>

<div class="export-panel" id="exportPanel">
  <span class="close-exp" onclick="document.getElementById('exportPanel').classList.remove('open')">&times;</span>
  <pre id="exportCode"></pre>
</div>

<script>
// ═══════════════════════════════
// STATE
// ═══════════════════════════════
let blocks = [];
let selectedId = null;
let snapEnabled = true;
let snapVal = 10;
let canvasW = 1440, canvasH = 900;
let scale = 1;
let dragState = null;
let idCounter = 0;

const canvas = document.getElementById('canvas');
const canvasWrap = document.getElementById('canvasWrap');

// Default style for new blocks
const defaultStyle = {
  borderColor: '#00FF41',
  borderWidth: 1,
  borderOpacity: 40,
  borderStyle: 'solid',
  fillColor: '#00FF41',
  fillOpacity: 3,
  textColor: '#00FF41',
  textSize: 9,
  glow: false,
  glowSize: 10,
};

// ═══════════════════════════════
// HELPERS
// ═══════════════════════════════
function hexToRgb(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function rgbaStr(hex, opacity){
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${opacity/100})`;
}

// ═══════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════
function fitCanvas(){
  const ww = canvasWrap.clientWidth - 20;
  const wh = canvasWrap.clientHeight - 20;
  scale = Math.min(ww / canvasW, wh / canvasH, 1);
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  canvas.style.transform = `scale(${scale})`;
  canvas.style.left = ((canvasWrap.clientWidth - canvasW * scale) / 2) + 'px';
  canvas.style.top = ((canvasWrap.clientHeight - canvasH * scale) / 2) + 'px';
}

function setCanvasSize(v){
  const [w,h] = v.split('x').map(Number);
  canvasW = w; canvasH = h;
  fitCanvas();
}

// ═══════════════════════════════
// SNAP
// ═══════════════════════════════
function snap(v){ return snapEnabled ? Math.round(v / snapVal) * snapVal : v; }
function snapToggle(btn){ snapEnabled = !snapEnabled; btn.classList.toggle('active'); }

// ═══════════════════════════════
// BLOCK CRUD
// ═══════════════════════════════
function addBlock(type='image'){
  const id = ++idCounter;
  const b = {
    id,
    name: type === 'text' ? 'LABEL' : type === 'open' ? 'OPEN' : 'IMG' + id,
    x: 40 + (blocks.length % 5) * 30,
    y: 40 + (blocks.length % 5) * 30,
    w: type === 'text' ? 200 : 300,
    h: type === 'text' ? 60 : 200,
    border: type !== 'open',
    type,
    label: type === 'text' ? 'LABEL TEXT' : type === 'open' ? '' : 'block ' + id,
    ...JSON.parse(JSON.stringify(defaultStyle)),
  };
  if(type === 'open'){ b.borderOpacity = 12; b.borderStyle = 'dashed'; }
  blocks.push(b);
  renderBlock(b);
  selectBlock(id);
  updateStatus();
  autoSave();
}

function renderBlock(b){
  let el = document.getElementById('blk-' + b.id);
  if(!el){
    el = document.createElement('div');
    el.className = 'block';
    el.id = 'blk-' + b.id;
    el.innerHTML = `
      <div class="block-label"></div>
      <div class="z-badge"></div>
      <div class="handle tl" data-h="tl"></div>
      <div class="handle tr" data-h="tr"></div>
      <div class="handle bl" data-h="bl"></div>
      <div class="handle br" data-h="br"></div>
      <div class="handle tm" data-h="tm"></div>
      <div class="handle bm" data-h="bm"></div>
      <div class="handle ml" data-h="ml"></div>
      <div class="handle mr" data-h="mr"></div>
    `;
    canvas.appendChild(el);

    el.addEventListener('mousedown', (e) => {
      if(e.target.classList.contains('handle')){
        startResize(e, b.id, e.target.dataset.h);
      } else {
        startMove(e, b.id);
      }
      e.stopPropagation();
    });
  }

  // Position & size
  el.style.left = b.x + 'px';
  el.style.top = b.y + 'px';
  el.style.width = b.w + 'px';
  el.style.height = b.h + 'px';

  // Border
  if(b.border){
    el.style.border = `${b.borderWidth||1}px ${b.borderStyle||'solid'} ${rgbaStr(b.borderColor||'#00FF41', b.borderOpacity||40)}`;
  } else {
    el.style.border = `1px dashed ${rgbaStr(b.borderColor||'#00FF41', 8)}`;
  }

  // Fill
  el.style.background = rgbaStr(b.fillColor||'#00FF41', b.fillOpacity||3);

  // Glow
  if(b.glow && b.border){
    el.style.boxShadow = `0 0 ${b.glowSize||10}px ${rgbaStr(b.borderColor||'#00FF41', 25)}, inset 0 0 ${(b.glowSize||10)/2}px ${rgbaStr(b.borderColor||'#00FF41', 8)}`;
  } else {
    el.style.boxShadow = b.id === selectedId ? '0 0 0 2px #fff' : 'none';
  }

  // Selected outline (on top of glow)
  el.classList.toggle('selected', b.id === selectedId);

  // Label
  const labelEl = el.querySelector('.block-label');
  labelEl.textContent = b.name + (b.label ? '\n' + b.label : '');
  labelEl.style.color = b.textColor || '#00FF41';
  labelEl.style.fontSize = (b.textSize||9) + 'px';

  // Z-index badge
  const zi = blocks.indexOf(b);
  el.querySelector('.z-badge').textContent = 'z' + zi;
  el.style.zIndex = zi + 1;
}

function renderAll(){
  blocks.forEach(b => renderBlock(b));
}

function selectBlock(id){
  const prevId = selectedId;
  selectedId = id;

  // Re-render prev to remove selection styling
  if(prevId){
    const pb = blocks.find(b => b.id === prevId);
    if(pb) renderBlock(pb);
  }

  const el = document.getElementById('blk-' + id);
  if(el){
    const b = blocks.find(b => b.id === id);
    if(b) renderBlock(b);
  }

  const panel = document.getElementById('props');
  if(id){
    panel.classList.add('has-selection');
    const b = blocks.find(b => b.id === id);
    if(b) updatePropsPanel(b);
  } else {
    panel.classList.remove('has-selection');
  }
}

function updatePropsPanel(b){
  document.getElementById('propName').value = b.name;
  document.getElementById('propLabel').value = b.label;
  document.getElementById('propType').value = b.type;
  document.getElementById('propX').value = Math.round(b.x);
  document.getElementById('propY').value = Math.round(b.y);
  document.getElementById('propW').value = Math.round(b.w);
  document.getElementById('propH').value = Math.round(b.h);
  document.getElementById('propBorder').checked = b.border;
  document.getElementById('propBorderColor').value = b.borderColor || '#00FF41';
  document.getElementById('propBorderWidth').value = b.borderWidth || 1;
  document.getElementById('bwVal').textContent = (b.borderWidth||1) + 'px';
  document.getElementById('propBorderOpacity').value = b.borderOpacity || 40;
  document.getElementById('boVal').textContent = (b.borderOpacity||40) + '%';
  document.getElementById('propBorderStyle').value = b.borderStyle || 'solid';
  document.getElementById('propFillColor').value = b.fillColor || '#00FF41';
  document.getElementById('propFillOpacity').value = b.fillOpacity || 3;
  document.getElementById('foVal').textContent = (b.fillOpacity||3) + '%';
  document.getElementById('propTextColor').value = b.textColor || '#00FF41';
  document.getElementById('propTextSize').value = b.textSize || 9;
  document.getElementById('tsVal').textContent = (b.textSize||9) + 'px';
  document.getElementById('propGlow').checked = b.glow || false;
  document.getElementById('propGlowSize').value = b.glowSize || 10;
  document.getElementById('gsVal').textContent = (b.glowSize||10) + 'px';
}

function setProp(key, val){
  const b = blocks.find(b => b.id === selectedId);
  if(!b) return;
  b[key] = val;
  renderBlock(b);
  // Update display values
  if(key === 'borderWidth') document.getElementById('bwVal').textContent = val + 'px';
  if(key === 'borderOpacity') document.getElementById('boVal').textContent = val + '%';
  if(key === 'fillOpacity') document.getElementById('foVal').textContent = val + '%';
  if(key === 'textSize') document.getElementById('tsVal').textContent = val + 'px';
  if(key === 'glowSize') document.getElementById('gsVal').textContent = val + 'px';
}

function deleteSelected(){
  if(!selectedId) return;
  const el = document.getElementById('blk-' + selectedId);
  if(el) el.remove();
  blocks = blocks.filter(b => b.id !== selectedId);
  selectBlock(null);
  updateStatus();
  autoSave();
}

function duplicateSelected(){
  if(!selectedId) return;
  const src = blocks.find(b => b.id === selectedId);
  if(!src) return;
  const id = ++idCounter;
  const b = {...JSON.parse(JSON.stringify(src)), id, name: src.name + '_copy', x: src.x + 20, y: src.y + 20};
  blocks.push(b);
  renderBlock(b);
  selectBlock(id);
  updateStatus();
  autoSave();
}

// Quick color from toolbar swatches
function quickColor(hex){
  const b = blocks.find(b => b.id === selectedId);
  if(!b) return;
  b.borderColor = hex;
  b.fillColor = hex;
  b.textColor = hex;
  renderBlock(b);
  updatePropsPanel(b);
}

// Color preset in props panel
function applyColorPreset(hex){
  quickColor(hex);
}

// Apply selected block's style to all blocks
function copyStyleToAll(){
  const src = blocks.find(b => b.id === selectedId);
  if(!src) return;
  const styleKeys = ['borderColor','borderWidth','borderOpacity','borderStyle','fillColor','fillOpacity','textColor','textSize','glow','glowSize'];
  blocks.forEach(b => {
    if(b.id === src.id) return;
    styleKeys.forEach(k => { b[k] = src[k]; });
    renderBlock(b);
  });
}

// Z-order
function bringForward(){
  const idx = blocks.findIndex(b => b.id === selectedId);
  if(idx < 0 || idx >= blocks.length - 1) return;
  [blocks[idx], blocks[idx+1]] = [blocks[idx+1], blocks[idx]];
  renderAll();
}
function sendBackward(){
  const idx = blocks.findIndex(b => b.id === selectedId);
  if(idx <= 0) return;
  [blocks[idx], blocks[idx-1]] = [blocks[idx-1], blocks[idx]];
  renderAll();
}

// ═══════════════════════════════
// DRAG & RESIZE
// ═══════════════════════════════
function startMove(e, id){
  selectBlock(id);
  const b = blocks.find(b => b.id === id);
  dragState = {
    type: 'move', id,
    startX: e.clientX, startY: e.clientY,
    startBlock: {...b}
  };
}

function startResize(e, id, handle){
  selectBlock(id);
  const b = blocks.find(b => b.id === id);
  dragState = {
    type: 'resize', id, handle,
    startX: e.clientX, startY: e.clientY,
    startBlock: {...b}
  };
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = Math.round((e.clientX - rect.left) / scale);
  const my = Math.round((e.clientY - rect.top) / scale);
  document.getElementById('statusPos').textContent = `X: ${mx}  Y: ${my}`;

  if(!dragState) return;

  const dx = (e.clientX - dragState.startX) / scale;
  const dy = (e.clientY - dragState.startY) / scale;
  const b = blocks.find(b => b.id === dragState.id);
  if(!b) return;
  const s = dragState.startBlock;

  if(dragState.type === 'move'){
    b.x = snap(s.x + dx);
    b.y = snap(s.y + dy);
    b.x = Math.max(0, Math.min(canvasW - b.w, b.x));
    b.y = Math.max(0, Math.min(canvasH - b.h, b.y));
  } else {
    const h = dragState.handle;
    let nx = s.x, ny = s.y, nw = s.w, nh = s.h;
    if(h.includes('r')) nw = snap(s.w + dx);
    if(h.includes('l')){ nx = snap(s.x + dx); nw = s.w - (nx - s.x); }
    if(h.includes('b')) nh = snap(s.h + dy);
    if(h.includes('t')){ ny = snap(s.y + dy); nh = s.h - (ny - s.y); }
    if(nw < 20){ nw = 20; if(h.includes('l')) nx = s.x + s.w - 20; }
    if(nh < 16){ nh = 16; if(h.includes('t')) ny = s.y + s.h - 16; }
    b.x = nx; b.y = ny; b.w = nw; b.h = nh;
  }

  renderBlock(b);
  if(b.id === selectedId){
    document.getElementById('propX').value = Math.round(b.x);
    document.getElementById('propY').value = Math.round(b.y);
    document.getElementById('propW').value = Math.round(b.w);
    document.getElementById('propH').value = Math.round(b.h);
  }
});

document.addEventListener('mouseup', () => { dragState = null; });

canvas.addEventListener('mousedown', (e) => {
  if(e.target === canvas || e.target.classList.contains('grid-lines')){
    selectBlock(null);
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  const b = blocks.find(b => b.id === selectedId);
  if(!b) return;

  const step = e.shiftKey ? 50 : snapVal;
  switch(e.key){
    case 'ArrowLeft':  b.x = snap(b.x - step); e.preventDefault(); break;
    case 'ArrowRight': b.x = snap(b.x + step); e.preventDefault(); break;
    case 'ArrowUp':    b.y = snap(b.y - step); e.preventDefault(); break;
    case 'ArrowDown':  b.y = snap(b.y + step); e.preventDefault(); break;
    case 'Delete': case 'Backspace': deleteSelected(); e.preventDefault(); return;
  }
  renderBlock(b);
  selectBlock(b.id);
});

// ═══════════════════════════════
// EXPORT
// ═══════════════════════════════
function exportLayout(){
  let css = `/* MYSTRA 01 — Layout from Builder */\n`;
  css += `/* Canvas: ${canvasW} x ${canvasH} */\n\n`;
  css += `.poster {\n  position: relative;\n  width: 100vw;\n  height: 100vh;\n  background: #000;\n  overflow: hidden;\n}\n\n`;

  blocks.forEach(b => {
    const xp = (b.x / canvasW * 100).toFixed(2);
    const yp = (b.y / canvasH * 100).toFixed(2);
    const wp = (b.w / canvasW * 100).toFixed(2);
    const hp = (b.h / canvasH * 100).toFixed(2);
    const cls = b.name.toLowerCase().replace(/[^a-z0-9]/g,'-');
    css += `.${cls} {\n`;
    css += `  position: absolute;\n`;
    css += `  left: ${xp}%; top: ${yp}%;\n  width: ${wp}%; height: ${hp}%;\n`;
    if(b.border){
      css += `  border: ${b.borderWidth||1}px ${b.borderStyle||'solid'} ${rgbaStr(b.borderColor||'#00FF41', b.borderOpacity||40)};\n`;
    }
    css += `  background: ${rgbaStr(b.fillColor||'#00FF41', b.fillOpacity||3)};\n`;
    if(b.glow){
      css += `  box-shadow: 0 0 ${b.glowSize||10}px ${rgbaStr(b.borderColor||'#00FF41', 25)};\n`;
    }
    css += `  /* ${b.type}: ${b.label} */\n`;
    css += `}\n\n`;
  });

  document.getElementById('exportCode').textContent = css;
  document.getElementById('exportPanel').classList.add('open');
}

function exportJSON(){
  const data = { canvasW, canvasH, blocks };
  const json = JSON.stringify(data, null, 2);
  document.getElementById('exportCode').textContent = json;
  document.getElementById('exportPanel').classList.add('open');
  navigator.clipboard.writeText(json).then(()=>{
    showToast('JSON copied to clipboard!');
  }).catch(()=>{});
}

function importJSON(){
  // Try clipboard first, then fallback to prompt
  navigator.clipboard.readText().then(text => {
    if(text && text.trim().startsWith('{')){
      if(confirm('Load layout from clipboard?')){
        loadFromJSON(text);
      }
    } else {
      loadFromPrompt();
    }
  }).catch(() => {
    loadFromPrompt();
  });
}

function loadFromPrompt(){
  const input = prompt('Paste JSON layout:');
  if(input) loadFromJSON(input);
}

function loadFromJSON(input){
  try {
    const data = JSON.parse(input);
    canvasW = data.canvasW || 1440;
    canvasH = data.canvasH || 900;
    blocks.forEach(b => {
      const el = document.getElementById('blk-' + b.id);
      if(el) el.remove();
    });
    blocks = data.blocks || [];
    idCounter = Math.max(0, ...blocks.map(b => b.id)) + 1;
    fitCanvas();
    renderAll();
    selectBlock(null);
    updateStatus();
    autoSave();
    showToast('Layout loaded! (' + blocks.length + ' blocks)');
  } catch(e){
    alert('Invalid JSON: ' + e.message);
  }
}

// ═══════════════════════════════
// AUTOSAVE to localStorage
// ═══════════════════════════════
const SAVE_KEY = 'mystra-builder-layout';

function autoSave(){
  const data = { canvasW, canvasH, blocks };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e){}
}

function autoLoad(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    canvasW = data.canvasW || 1440;
    canvasH = data.canvasH || 900;
    blocks = data.blocks || [];
    idCounter = Math.max(0, ...blocks.map(b => b.id)) + 1;
    return blocks.length > 0;
  } catch(e){ return false; }
}

// Autosave after every drag/resize
const _origMouseUp = document.onmouseup;
document.addEventListener('mouseup', () => {
  if(dragState) setTimeout(autoSave, 50);
});

// Autosave after property changes
const _origSetProp = setProp;
setProp = function(key, val){
  _origSetProp(key, val);
  autoSave();
};

// Toast notification
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#0f0;color:#000;padding:6px 16px;font-family:inherit;font-size:11px;letter-spacing:1px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(()=>{ t.style.opacity = '0'; }, 2000);
}

// ═══════════════════════════════
// PRESET
// ═══════════════════════════════

      fillColor:g,fillOpacity:2,textColor:g,textSize:9,glow:false,glowSize:10 },

    { name: 'MAIN', type: 'image', border: true, label: 'main assembly',

      borderColor:g,borderWidth:1,borderOpacity:30,borderStyle:'solid',
      fillColor:g,fillOpacity:2,textColor:g,textSize:9,glow:true,glowSize:12 },

    { name: 'LABEL', type: 'text', border: false, label: 'GHSTLN',
      x: pad, y: topStart + 620, w: 380, h: 80,
      borderColor:g,borderWidth:1,borderOpacity:0,borderStyle:'solid',
      fillColor:g,fillOpacity:0,textColor:g,textSize:11,glow:false,glowSize:10 },

    { name: 'INFO', type: 'info', border: true, label: 'BUILD AI REV SRV',
      x: pad + 390, y: topStart + 620, w: rightEdge - pad - 390, h: 80,
      borderColor:g,borderWidth:1,borderOpacity:15,borderStyle:'solid',
      fillColor:g,fillOpacity:1,textColor:g,textSize:8,glow:false,glowSize:10 },

    { name: 'VERT', type: 'text', border: false, label: 'M Y S T R A',
      x: rightEdge + gap, y: topStart + 110, w: vertW, h: 490,
      borderColor:g,borderWidth:1,borderOpacity:0,borderStyle:'solid',
      fillColor:g,fillOpacity:0,textColor:g,textSize:11,glow:false,glowSize:10 },

    { name: 'VBASE', type: 'open', border: true, label: '',
      x: rightEdge + gap, y: topStart + 620, w: vertW, h: 80,
      borderColor:g,borderWidth:1,borderOpacity:15,borderStyle:'dashed',
      fillColor:g,fillOpacity:0,textColor:g,textSize:8,glow:false,glowSize:10 },

    { name: 'FOOTER', type: 'text', border: false, label: 'GHOSTLINE LAB 2025',
      x: pad, y: bottomEdge - 50, w: rightEdge - pad, h: 30,

      fillColor:g,fillOpacity:0,textColor:g,textSize:7,glow:false,glowSize:10 },
  ];

  presets.forEach(p => {
    const id = ++idCounter;
    blocks.push({id, ...p});
  });

  fitCanvas();
  renderAll();
  selectBlock(null);
  updateStatus();
}

function updateStatus(){
  document.getElementById('statusInfo').textContent =
    `Blocks: ${blocks.length} | Arrows=nudge | Shift+Arrow=50px | Del=remove`;
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
window.addEventListener('resize', fitCanvas);
fitCanvas();

// Try to restore from autosave, otherwise load preset
if(autoLoad()){
  renderAll();
  selectBlock(null);
  updateStatus();
  showToast('Restored from autosave');
} else {
  loadPreset();
}
</script>
