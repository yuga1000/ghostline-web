<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYSTRA 01 — Ghostline Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#000;
  --g:#00FF41;
  --blue:#0033ff;
  --blue-deep:#00248f;
  --blue-bright:#0066FF;
  --orange:#FF6600;
  --magenta:#ee00ff;
  --white:#ffffff;
  --f1:'Press Start 2P',monospace;
  --f2:'Silkscreen',monospace;
  --f3:'VT323',monospace;
}

html,body{
  height:100%;overflow:hidden;
  background:var(--bg);color:var(--g);
}

/* ═══ BACKGROUNDS ═══ */
.bg-art{
  position:fixed;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.bg-art img{
  max-width:min(420px,55vw);opacity:0.03;
  image-rendering:pixelated;filter:brightness(0.3);
}
.bg-dots{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(circle,rgba(0,100,255,0.02) 0.5px,transparent 0.5px);
  background-size:72px 72px;pointer-events:none;
}
.scan{
  position:fixed;inset:0;z-index:9998;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,50,255,0.004) 2px,rgba(0,50,255,0.004) 4px);
  pointer-events:none;
}

/* ═══ POSTER — absolute positioned from builder JSON ═══ */
.poster{
  position:relative;z-index:2;
  width:100vw;height:100vh;
  overflow:hidden;
}

/* Scale factor: everything in % of viewport */

/* ───── IMG2: top-left — schematic/concept (340x240 @ 90,40) ───── */
.img2{
  position:absolute;
  left:6.25%;top:4.44%;
  width:23.61%;height:26.67%;
  border:4px dashed rgba(255,255,255,1);
  background:rgba(7,7,237,0.5);
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,50,255,0.2), inset 0 0 60px rgba(0,50,255,0.08);
}

/* ───── ICONS: isometric pixel chart — full left column width ───── */
.icons{
  position:absolute;
  left:6.25%;top:33.33%;
  width:23.61%;height:5.56%;
  overflow:hidden;
}
.icons canvas{
  width:100%;height:100%;
  image-rendering:pixelated;
}

/* ───── FOOTER line: (340x30 @ 90,370) ───── */
.foot-line{
  position:absolute;
  left:6.25%;top:41.11%;
  width:23.61%;height:3.33%;
  display:flex;align-items:center;
}

/* ───── IMG1: left-bottom — spider render (340x240 @ 90,430) ───── */
.img1{
  position:absolute;
  left:6.25%;top:47.78%;
  width:23.61%;height:26.67%;
  border:4px solid var(--orange);
  overflow:hidden;
}

/* ───── TITLE: MYSTRA 01 — stretches from left-col to VBASE ───── */
.title{
  position:absolute;
  left:33.33%;top:3%;
  right:6%;
  height:17%;
  display:flex;align-items:flex-end;justify-content:flex-start;
  padding-bottom:8px;
}

/* ───── VBASE: dashed block (180x110 @ 1180,190) ───── */
.vbase{
  position:absolute;
  left:81.94%;top:21.11%;
  width:12.5%;height:12.22%;
  border:4px dashed rgba(0,255,65,1);
  background:rgba(0,255,65,0.09);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* ───── MAIN: big center block — gif animation (660x460 @ 480,190) ───── */
.main{
  position:absolute;
  left:33.33%;top:21.11%;
  width:45.83%;height:51.11%;
  border:4px solid rgba(0,51,255,0.58);
  background:rgba(0,36,143,0.17);
  overflow:hidden;
  box-shadow:0 0 12px rgba(0,51,255,0.15), inset 0 0 30px rgba(0,36,143,0.06);
}

/* ───── VERT: vertical MYSTRA text (180x320 @ 1180,320) ───── */
.vert{
  position:absolute;
  left:81.94%;top:35.56%;
  width:12.5%;height:35.56%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
}

/* ───── SMALL GIF: overlay block (180x150 @ 980,520) ───── */
.small-gif{
  position:absolute;
  left:68.06%;top:57.78%;
  width:12.5%;height:16.67%;
  border:3px solid rgba(0,51,255,0.58);
  overflow:hidden;
  box-shadow:0 0 12px rgba(0,51,255,0.15);
}

/* ───── LABEL: bottom-left text (320x80 @ 90,690) ───── */
.label{
  position:absolute;
  left:6.25%;top:76.67%;
  width:22.22%;height:8.89%;
  display:flex;flex-direction:column;
  justify-content:center;gap:4px;
}

/* ───── INFO: bottom bar (910x80 @ 470,690) ───── */
.info{
  position:absolute;
  left:32.64%;top:76.67%;
  width:63.19%;height:8.89%;
  border:3px solid var(--magenta);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;padding:4px;
}

/* ═══ SHARED STYLES ═══ */
.th{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(0.5) contrast(1.15) saturate(0.8);
  transition:filter 0.4s,opacity 0.4s;
  opacity:0.6;
}
.img1:hover .th,.img2:hover .th,.main:hover .th,.small-gif:hover .th{
  filter:brightness(0.7) contrast(1.1) saturate(1);
  opacity:0.85;
}

.lb{
  position:absolute;top:8px;left:12px;
  font-family:var(--f2);font-size:7px;
  letter-spacing:2px;opacity:0.25;
  text-transform:uppercase;z-index:3;
}
.nr{
  position:absolute;bottom:6px;right:8px;
  font-family:var(--f3);font-size:10px;
  opacity:0.12;z-index:3;
}

/* ═══ TITLE ═══ */
.title .custom-font{
  max-width:100%;max-height:100%;
  image-rendering:pixelated;
  display:block;
  object-fit:contain;
  object-position:left bottom;
}

/* ═══ VERT LETTERS ═══ */
.vert span{
  font-family:var(--f1);
  font-size:clamp(11px,1.5vw,18px);
  color:var(--g);
  letter-spacing:0.06em;
  text-shadow:0 0 14px rgba(0,255,65,0.2);
  -webkit-text-stroke:0.5px var(--g);
  paint-order:stroke fill;
}

/* ═══ ICONS / SENSORS ═══ */
.sensors{display:flex;align-items:flex-end;gap:2px;height:100%;padding:4px}
.sensors .bar{
  width:3px;background:var(--blue-bright);
  box-shadow:0 0 3px var(--blue-bright);
  animation:sbar 2s ease-in-out infinite;
}
@keyframes sbar{0%,100%{height:15%}50%{height:85%}}

/* ═══ LABEL ═══ */
.label .big{
  font-family:var(--f1);
  font-size:clamp(12px,3vw,28px);
  letter-spacing:0.1em;line-height:1;
  color:var(--g);
  display:flex;align-items:center;gap:8px;
}
.label .big .arr{font-size:0.6em;opacity:0.3}
.label .tagline{
  font-family:var(--f2);font-size:7px;
  letter-spacing:2px;opacity:0.15;
  text-transform:uppercase;
}

/* ═══ INFO CELLS ═══ */
.info-c{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:var(--f3);font-size:10px;
  color:var(--g);opacity:0.35;
}
.info-c .v{
  font-size:14px;color:var(--magenta);
  opacity:0.7;margin-bottom:1px;
  text-shadow:0 0 8px rgba(238,0,255,0.2);
}

/* ═══ FOOT LINE ═══ */
.foot-line span{
  font-family:var(--f2);font-size:7px;
  letter-spacing:2px;opacity:0.1;
  text-transform:uppercase;
}
.foot-line .fl{flex:1;height:1px;background:rgba(0,255,65,0.04);margin:0 8px}

/* ═══ VBASE content ═══ */
.vbase-inner{
  font-family:var(--f3);font-size:10px;
  color:var(--blue-bright);opacity:0.4;
  text-align:center;line-height:1.6;
  letter-spacing:1px;
}

/* ═══ EXPAND OVERLAY ═══ */
.ex{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.96);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:12px;opacity:0;
  transform:scale(0.97);
  transition:opacity 0.3s cubic-bezier(0.16,1,0.3,1),transform 0.3s cubic-bezier(0.16,1,0.3,1);
  pointer-events:none;z-index:6;
}
.ex.open{opacity:1;transform:scale(1);pointer-events:all}
.ex img{max-width:94%;max-height:82%;object-fit:contain}
.ex .el{font-family:var(--f2);font-size:7px;letter-spacing:2px;opacity:0.2;margin-top:8px}
.ex .cx{position:absolute;top:6px;right:8px;font-family:var(--f2);font-size:14px;cursor:pointer;opacity:0.25}
.ex .cx:hover{opacity:1}

/* ═══ ANIMATIONS ═══ */
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.bk{animation:blink 1.2s step-end infinite}

@keyframes glowpulse{
  0%,100%{box-shadow:0 0 12px rgba(0,51,255,0.1), inset 0 0 30px rgba(0,36,143,0.04)}
  50%{box-shadow:0 0 25px rgba(0,51,255,0.2), inset 0 0 40px rgba(0,36,143,0.08)}
}
.main{animation:glowpulse 6s ease-in-out infinite}

@keyframes scanline{
  0%{transform:translateY(-100%)}
  100%{transform:translateY(100%)}
}
.main::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(transparent 40%,rgba(0,51,255,0.03) 50%,transparent 60%);
  animation:scanline 4s linear infinite;
  pointer-events:none;
}

/* ═══ MOBILE ═══ */
@media(max-width:768px){
  html,body{overflow:auto}
  .poster{height:auto;min-height:100vh;padding:12px}

  .img2,.img1,.main,.small-gif,.title,.vert,.vbase,.icons,.foot-line,.label,.info{
    position:relative;
    left:auto;top:auto;
    width:100%;height:auto;
    margin-bottom:8px;
  }
  .img2,.img1{height:200px}
  .main{height:280px}
  .small-gif{height:150px}
  .title{height:auto;padding:16px 0}
  .vert{flex-direction:row;height:auto;padding:8px 0;gap:12px}
  .vbase{height:60px}
  .icons{height:40px;width:100%}
  .info{height:auto;min-height:60px}
  .label{height:auto;padding:8px 0}
}
</style>
</head>
<body>

<div class="bg-art"><img src="img/R8I5I.jpg" alt=""></div>
<div class="bg-dots"></div>
<div class="scan"></div>

<div class="poster">

  <!-- IMG2: top-left — concept/schematic with blue fill -->
  <div class="img2" onclick="tgl(this)">
    <span class="lb" style="color:var(--white)">concept render</span>
    <span class="nr" style="color:var(--white)">No.1</span>
    <img class="th" src="img/spider-warhammer.jpg" alt="">
    <div class="ex">
      <div class="cx" onclick="event.stopPropagation();cls(this)">&#x2715;</div>
      <img src="img/spider-warhammer.jpg" alt="">
      <div class="el">CONCEPT 01 // ARMORED VARIANT</div>
    </div>
  </div>

  <!-- ICONS: pixel arcade bar chart -->
  <div class="icons">
    <canvas id="arcadeChart"></canvas>
  </div>

  <!-- FOOT LINE -->
  <div class="foot-line">
    <span>GHOSTLINE LAB</span>
    <span class="fl"></span>
    <span>HEX-01</span>
  </div>

  <!-- IMG1: left-bottom — spider photo -->
  <div class="img1" onclick="tgl(this)">
    <span class="lb" style="color:var(--orange)">primary viewport</span>
    <span class="nr" style="color:var(--orange)">No.2</span>
    <img class="th" src="img/spider-front.jpg" alt="">
    <div class="ex">
      <div class="cx" onclick="event.stopPropagation();cls(this)">&#x2715;</div>
      <img src="img/spider-front.jpg" alt="">
      <div class="el">MYSTRA 01 // FRONT VIEW</div>
    </div>
  </div>

  <!-- TITLE: MYSTRA 01 — PNG sequence, plays once -->
  <div class="title">
    <img id="titleAnim" class="custom-font" src="img/mystra-anim/1.PNG" alt="MYSTRA 01">
  </div>

  <!-- VBASE: dashed green block — data/status -->
  <div class="vbase">
    <div class="vbase-inner">
      SYS.ACTIVE<br>
      LINK:OK<br>
      PWR:98%<br>
      <span class="bk">_</span>
    </div>
  </div>

  <!-- MAIN: big center block — 3D pixel rotation gif -->
  <div class="main">
    <img class="th" src="img/scheme-pixel-mystra-3d/finalized_20260403_173400_x_boost.gif" alt="" style="filter:none;opacity:1;">
  </div>

  <!-- VERT: vertical MYSTRA letters -->
  <div class="vert">
    <span>M</span><span>Y</span><span>S</span><span>T</span><span>R</span><span>A</span>
  </div>

  <!-- SMALL GIF: overlay inside main area -->
  <div class="small-gif" onclick="tgl(this)">
    <span class="lb">detail</span>
    <img class="th" src="img/pixel-hex-large.jpg" alt="">
    <div class="ex">
      <div class="cx" onclick="event.stopPropagation();cls(this)">&#x2715;</div>
      <img src="img/pixel-hex-large.jpg" alt="">
      <div class="el">PIXEL HEX // DETAIL</div>
    </div>
  </div>

  <!-- LABEL: bottom-left -->
  <div class="label">
    <div class="big"><span class="arr">&#x2196;</span> GHSTLN</div>
    <div class="tagline">GHOSTLINE LAB // HEXAPOD DIVISION</div>
  </div>

  <!-- INFO: bottom bar with magenta border -->
  <div class="info">
    <div class="info-c"><span class="v">85%</span>BUILD</div>
    <div class="info-c"><span class="v">40%</span>AI</div>
    <div class="info-c"><span class="v">v1.0</span>REV</div>
    <div class="info-c"><span class="v">18</span>SRV</div>
    <div class="info-c"><span class="v">6</span>LEGS</div>
    <div class="info-c"><span class="v">3</span>DOF</div>
  </div>

</div>

<script>
function tgl(c){const e=c.querySelector('.ex');if(e)e.classList.toggle('open')}
function cls(b){b.closest('.ex').classList.remove('open')}

// ═══ ISOMETRIC PIXEL BAR CHART ═══
(function(){
  const canvas = document.getElementById('arcadeChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;

  const cols = 12;
  const colors = ['#0044cc','#0055ee','#0033ff','#0066FF','#0044dd','#0055cc','#0033ee','#0055ff','#0044bb','#0066ee','#0033dd','#0055bb'];
  const topColors = ['#0077ff','#0088ff','#0066ff','#0099ff','#0077ff','#0088ff','#0077ff','#0099ff','#0088ff','#0077ff','#0066ff','#0099ff'];
  const sideColors = ['#001a66','#002288','#001a55','#002299','#001a77','#002266','#001a66','#002288','#001a55','#002299','#001a77','#002266'];

  // Current and target heights (in blocks)
  let heights = [3,5,2,7,4,6,5,3,8,4,6,2];
  let displayed = new Array(cols).fill(0);
  let nextChange = 0;
  const changeInterval = 1800; // ms between height changes

  function resize(){
    canvas.width = parent.clientWidth * 2;
    canvas.height = parent.clientHeight * 2;
    canvas.style.width = parent.clientWidth + 'px';
    canvas.style.height = parent.clientHeight + 'px';
  }

  // Draw isometric block at grid position
  function drawBlock(bx, by, bz, color, topC, sideC){
    const w = 8; // block width in iso
    const h = 6; // block height in iso
    const d = 5; // depth

    // Iso projection
    const sx = canvas.width/2 + (bx - bz) * (w + 2) - cols * (w+2)/2;
    const sy = canvas.height - 10 - by * h + (bx + bz) * d/2;

    // Top face
    ctx.fillStyle = topC;
    ctx.beginPath();
    ctx.moveTo(sx, sy - h);
    ctx.lineTo(sx + w, sy - h + d/2);
    ctx.lineTo(sx, sy + d);
    ctx.lineTo(sx - w, sy - h + d/2);
    ctx.closePath();
    ctx.fill();

    // Left face
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(sx - w, sy - h + d/2);
    ctx.lineTo(sx, sy + d);
    ctx.lineTo(sx, sy + d + h);
    ctx.lineTo(sx - w, sy + d/2);
    ctx.closePath();
    ctx.fill();

    // Right face
    ctx.fillStyle = sideC;
    ctx.beginPath();
    ctx.moveTo(sx + w, sy - h + d/2);
    ctx.lineTo(sx, sy + d);
    ctx.lineTo(sx, sy + d + h);
    ctx.lineTo(sx + w, sy + d/2);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Step displayed heights toward targets — 8 steps per second
    if(!draw.lastStep || t - draw.lastStep > 120){
      draw.lastStep = t;
      for(let i = 0; i < cols; i++){
        if(displayed[i] < heights[i]) displayed[i]++;
        else if(displayed[i] > heights[i]) displayed[i]--;
      }
    }

    // Draw bars back to front
    for(let i = 0; i < cols; i++){
      for(let row = 0; row < displayed[i]; row++){
        drawBlock(i, row, 0, colors[i], topColors[i], sideColors[i]);
      }
    }

    // Change target heights periodically
    if(t > nextChange){
      nextChange = t + changeInterval;
      for(let i = 0; i < cols; i++){
        heights[i] = 2 + Math.floor(Math.random() * 8);
      }
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  // Initial fill animation — start from 0
  displayed = new Array(cols).fill(0);
  nextChange = performance.now() + changeInterval;
  requestAnimationFrame(draw);
})();

// ═══ PNG SEQUENCE: play once, stop on last frame ═══
(function(){
  const el = document.getElementById('titleAnim');
  const totalFrames = 8;
  const frameDelay = 150; // ms between frames
  let frame = 1;

  // Preload all frames
  const frames = [];
  let loaded = 0;
  for(let i = 1; i <= totalFrames; i++){
    const img = new Image();
    img.src = 'img/mystra-anim/' + i + '.PNG';
    img.onload = ()=>{ loaded++; if(loaded === totalFrames) play(); };
    frames.push(img);
  }

  function play(){
    const timer = setInterval(()=>{
      frame++;
      if(frame > totalFrames){
        clearInterval(timer);
        return; // stop on last frame
      }
      el.src = frames[frame-1].src;
    }, frameDelay);
  }
})();
</script>

</body>
</html>
